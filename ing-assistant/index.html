  function render() {
    if (progresDragActive) { renderQueuedDuringDrag = true; return; }
    var errorBanner = syncError ? '<div class="sync-error">' + esc(syncError) + '</div>' : "";
    var failedCount = Object.keys(failedCells).length;
    var retryBanner = failedCount > 0 ? '' +
      '<div class="sync-error retry-banner">' +
        (failedCount === 1 ? '1 zi nu s-a salvat.' : failedCount + ' zile nu s-au salvat.') +
        ' <span class="retry-link" data-retry-failed="1">Reîncearcă acum</span>' +
      '</div>' : '';

    if (!sb) { document.getElementById("app").innerHTML = sdkErrorScreenHTML(); return; }
    if (authState.loading) { document.getElementById("app").innerHTML = loadingScreenHTML(); return; }
    if (!authState.session) { document.getElementById("app").innerHTML = errorBanner + loginScreenHTML(); return; }

    var main = "";
    if (state.view === "dashboard") main = dashboardHTML();
    else if (state.view === "sites") main = sitesHTML();
    else if (state.view === "detail") main = detailHTML();
    else if (state.view === "pontaj-global") main = pontajGlobalHTML();

    var isWide = state.view === "detail" && state.activeTab === "progres";
    var expandBtn = state.sidebarCollapsed ? '<div class="sidebar-expand-btn" data-toggle-sidebar="1" title="Arată bara laterală">' + icon("chevronRight", 15) + '</div>' : "";
    document.getElementById("app").innerHTML = errorBanner + retryBanner + expandBtn +
      '<div class="app' + (state.sidebarCollapsed ? " sidebar-hidden" : "") + '">' + sidebarHTML() +
      '<div class="main"><div class="main-inner' + (isWide ? " wide" : "") + '">' + main + '</div></div></div>';
    positionOpenPopover();
    positionColorPopover();
  }

  function positionOpenPopover() {
    if (!state.pontaj.openCell) return;
    var pop = document.querySelector(".daypop");
    var cell = document.querySelector('[data-cell-toggle="' + state.pontaj.openCell + '"]');
    if (!pop || !cell) return;
    var r = cell.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.min(Math.max(r.left, 8), window.innerWidth - pw - 8);
    var top = (r.bottom + 4 + ph <= window.innerHeight) ? (r.bottom + 4) : Math.max(8, r.top - ph - 4);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function positionColorPopover() {
    var open = state.siteForm.colorPickerOpen;
    if (!open.id) return;
    var pop = document.querySelector(".colorpop");
    var btn = document.querySelector('[data-toggle-color="' + open.type + '|' + open.id + '"]');
    if (!pop || !btn) return;
    var r = btn.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.min(Math.max(r.left, 8), window.innerWidth - pw - 8);
    var top = (r.bottom + 4 + ph <= window.innerHeight) ? (r.bottom + 4) : Math.max(8, r.top - ph - 4);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  document.getElementById("app").addEventListener("click", function (e) {
    // A single click on an editable grid cell just selects it (as a paste
    // anchor for Ctrl+V) — it does NOT open the input, that's dblclick's job.
    // Crucially this must NOT call render() in the common case: replacing
    // the clicked <td> with a fresh DOM node between the two clicks of a
    // dblclick gesture stops the browser from ever firing "dblclick" on it.
    // While a cell formula is being built, the same click instead toggles
    // that cell in/out of the formula (add → flip sign → remove).
    var pasteTarget = e.target.closest("[data-edit-cell]");
    if (pasteTarget && e.target === pasteTarget) {
      var ptParts = pasteTarget.dataset.editCell.split("|");
      if (state.siteForm.formulaBuilder) {
        toggleFormulaTerm(ptParts[0], ptParts[1]);
        render();
        return;
      }
      state.siteForm.pasteAnchor = { rowId: ptParts[0], colId: ptParts[1] };
      var hadPopoverOpen = state.pontaj.openCell || state.siteForm.colorPickerOpen.id;
      state.pontaj.openCell = null;
      state.siteForm.colorPickerOpen = { type: null, id: null };
      if (hadPopoverOpen) {
        render();
        var refocus = document.querySelector('[data-edit-cell="' + ptParts[0] + '|' + ptParts[1] + '"]');
        if (refocus) refocus.focus();
      } else {
        pasteTarget.focus();
      }
      return;
    }

    var t = e.target.closest(
      "[data-go],[data-open-site],[data-tab],[data-global-site]," +
      "[data-pontaj-prev],[data-pontaj-next],[data-pontaj-mode],[data-cell-toggle],[data-set-status]," +
      "[data-add-worker],[data-remove-worker],[data-print-pontaj],[data-toggle-company],[data-save-company],[data-logout]," +
      "[data-toggle-select-mode],[data-bulk-status],[data-clear-selection],[data-retry-failed]," +
      "[data-open-add-site],[data-close-add-site],[data-save-new-site],[data-edit-site],[data-save-site-edit],[data-cancel-site-edit],[data-delete-site]," +
      "[data-site-subtab],[data-progres-subtab],[data-save-doc-valoare],[data-remove-doc-file],[data-add-aviz],[data-remove-aviz]," +
      "[data-add-gendoc],[data-remove-gendoc]," +
      "[data-add-row],[data-add-group-row],[data-remove-row],[data-remove-col],[data-toggle-addcol],[data-cancel-addcol],[data-submit-addcol]," +
      "[data-toggle-color],[data-pick-color],[data-toggle-sidebar]," +
      "[data-toggle-collapse-group],[data-duplicate-row],[data-export-progres-csv],[data-print-progres]," +
      "[data-toggle-cell-formula],[data-formula-save],[data-formula-cancel],[data-formula-clear]," +
      "[data-undo-progres]"
    );

    // Only re-render when something actually changes. A blanket render() on every
    // click would destroy-and-recreate any input/select the click just focused
    // (e.g. clicking into "Nume și prenume" then re-rendering immediately after
    // steals focus back off it), making it impossible to type. So: clicks on
    // plain page furniture (inputs, whitespace, table cells with no data-action)
    // must be a no-op here.
    var needsRender = false;

    // clicking anywhere outside an open day-popover closes it
    if (state.pontaj.openCell && !(t && (t.dataset.cellToggle || t.dataset.setStatus))) {
      state.pontaj.openCell = null;
      needsRender = true;
    }

    // clicking anywhere outside an open color popover closes it
    if (state.siteForm.colorPickerOpen.id && !(t && (t.dataset.toggleColor || t.dataset.pickColor))) {
      state.siteForm.colorPickerOpen = { type: null, id: null };
      needsRender = true;
    }

    var isNav = false;
    if (t) {
      needsRender = true;
      if (t.dataset.go) { state.view = t.dataset.go; isNav = true; }
      else if (t.dataset.openSite) {
        if (e.target.dataset.sidebarNameInput) {
          needsRender = false; // clicking inside the active rename input just places the cursor
        } else if (e.target.closest("[data-sidebar-name-label]")) {
          // might be the first half of a double-click-to-rename — delay
          // navigation briefly so a following dblclick can cancel it instead
          needsRender = false;
          var deferSiteId = t.dataset.openSite;
          clearTimeout(sidebarClickTimer);
          sidebarClickTimer = setTimeout(function () {
            state.view = "detail"; state.selectedSiteId = deferSiteId; state.activeTab = "date-santier";
            state.siteForm.editing = false; state.siteForm.subTab = "sintetice"; state.siteForm.progresSubTab = "capitole"; state.siteForm.formulaBuilder = null;
            render();
            window.scrollTo(0, 0);
          }, 260);
        } else {
          state.view = "detail"; state.selectedSiteId = t.dataset.openSite; state.activeTab = "date-santier"; state.siteForm.editing = false; state.siteForm.subTab = "sintetice"; state.siteForm.progresSubTab = "capitole"; state.siteForm.formulaBuilder = null; isNav = true;
        }
      }
      else if (t.dataset.tab) {
        state.activeTab = t.dataset.tab;
        if (t.dataset.tab === "progres") {
          var pgSite = findSite(state.selectedSiteId);
          if (pgSite) seedDefaultProgresColumns(pgSite, state.siteForm.progresSubTab || "capitole");
        }
      }
      else if (t.dataset.globalSite) state.globalSiteId = t.dataset.globalSite;
      else if (t.dataset.pontajPrev) shiftMonth(-1);
      else if (t.dataset.pontajNext) shiftMonth(1);
      else if (t.dataset.pontajMode) state.pontaj.periodMode = t.dataset.pontajMode;
      else if (t.dataset.cellToggle) {
        if (state.pontaj.selectMode) {
          var key = t.dataset.cellToggle;
          var idx = state.pontaj.selectedCells.indexOf(key);
          if (idx === -1) state.pontaj.selectedCells.push(key);
          else state.pontaj.selectedCells.splice(idx, 1);
        } else {
          state.pontaj.openCell = (state.pontaj.openCell === t.dataset.cellToggle) ? null : t.dataset.cellToggle;
        }
      }
      else if (t.dataset.setStatus) {
        var parts = t.dataset.setStatus.split("|"); // workerId|yyyy-mm-dd|status
        setStatus(parts[0], parts[1], parts[2]);
        state.pontaj.openCell = null;
      }
      else if (t.dataset.addWorker) { addWorkerFromInput(); }
      else if (t.dataset.removeWorker) { removeWorker(t.dataset.removeWorker); }
      else if (t.dataset.printPontaj) { printPontaj(); return; }
      else if (t.dataset.toggleCompany) {
        state.pontaj.editingCompany = !state.pontaj.editingCompany;

      }
      else if (t.dataset.saveCompany) { saveCompanyFromInputs(); state.pontaj.editingCompany = false; }
      else if (t.dataset.logout) { doLogout(); return; }
      else if (t.dataset.toggleSidebar) { state.sidebarCollapsed = !state.sidebarCollapsed; }
      else if (t.dataset.toggleSelectMode) {
        state.pontaj.selectMode = !state.pontaj.selectMode;
        state.pontaj.selectedCells = [];
        state.pontaj.openCell = null;
      }
      else if (t.dataset.bulkStatus) {
        setStatusBulk(state.pontaj.selectedCells, t.dataset.bulkStatus);
        state.pontaj.selectedCells = [];
      }
      else if (t.dataset.clearSelection) {
        state.pontaj.selectedCells = [];
      }
      else if (t.dataset.retryFailed) { retryFailedCells(); }
      else if (t.dataset.openAddSite) {
        state.siteForm.addOpen = true;
        state.siteForm.addDraft = emptySiteDraft();
      }
      else if (t.dataset.closeAddSite) { state.siteForm.addOpen = false; }
      else if (t.dataset.saveNewSite) { addSiteFromInput(); }
      else if (t.dataset.editSite) {
        var editSite = findSite(t.dataset.editSite);
        if (editSite) {
          state.activeTab = "date-santier";
          state.siteForm.editing = true;
          state.siteForm.editDraft = {
            nume: editSite.nume, adresa: editSite.adresa, numarProiect: editSite.numarProiect,

            perioadaExecutie: editSite.perioadaExecutie, dataExpirareContract: editSite.dataExpirareContract,
            garantie: editSite.garantie, ordinIncepere: editSite.ordinIncepere
          };
        }
      }
      else if (t.dataset.saveSiteEdit) { saveSiteEditFromInput(t.dataset.saveSiteEdit); state.siteForm.editing = false; }
      else if (t.dataset.cancelSiteEdit) { state.siteForm.editing = false; }
      else if (t.dataset.deleteSite) { removeSite(t.dataset.deleteSite); }
      else if (t.dataset.siteSubtab) { state.siteForm.subTab = t.dataset.siteSubtab; }
      else if (t.dataset.progresSubtab) {
        state.siteForm.progresSubTab = t.dataset.progresSubtab;
        state.siteForm.gridCellEdit = { rowId: null, colId: null, draft: "" };
        state.siteForm.gridColLabelEdit = { colId: null, draft: "" };
        state.siteForm.addColForm = emptyAddColForm();
        state.siteForm.colorPickerOpen = { type: null, id: null };
        state.siteForm.formulaBuilder = null;
        state.siteForm.pasteAnchor = null;
        var psSite = findSite(state.selectedSiteId);
        if (psSite) seedDefaultProgresColumns(psSite, t.dataset.progresSubtab);
      }
      else if (t.dataset.saveDocValoare) {
        var dvParts = t.dataset.saveDocValoare.split("|");
        saveDocValoare(dvParts[0], dvParts[1]);
      }
      else if (t.dataset.removeDocFile) {
        var rdParts = t.dataset.removeDocFile.split("|");
        var rdSite = findSite(rdParts[0]);
        if (rdSite) removeDocFile(rdSite, rdParts[1]);
      }
      else if (t.dataset.addAviz) { addRepeatableDoc(t.dataset.addAviz, "aviz"); }
      else if (t.dataset.removeAviz) {
        var raParts = t.dataset.removeAviz.split("|");
        var raSite = findSite(raParts[0]);
        if (raSite) removeRepeatableDoc(raSite, raParts[1], "avizul", "acest aviz", "avizul");
      }
      else if (t.dataset.addGendoc) { addRepeatableDoc(t.dataset.addGendoc, "doc"); }
      else if (t.dataset.removeGendoc) {
        var rgParts = t.dataset.removeGendoc.split("|");
        var rgSite = findSite(rgParts[0]);
        if (rgSite) removeRepeatableDoc(rgSite, rgParts[1], "documentul", "acest document", "documentul");
      }
      else if (t.dataset.addRow) { var arSite = findSite(t.dataset.addRow); if (arSite) addRow(arSite, progresTabelFromEl(t), null); }
      else if (t.dataset.addGroupRow) { var agSite = findSite(t.dataset.addGroupRow); if (agSite) addRow(agSite, progresTabelFromEl(t), "grup"); }
      else if (t.dataset.toggleColor) {
        var tcParts = t.dataset.toggleColor.split("|");
        var open = state.siteForm.colorPickerOpen;
        var isSameSwatch = open.type === tcParts[0] && open.id === tcParts[1];
        state.siteForm.colorPickerOpen = isSameSwatch ? { type: null, id: null } : { type: tcParts[0], id: tcParts[1] };
      }
      else if (t.dataset.pickColor) {
        var pcParts = t.dataset.pickColor.split("|");
        var pcSite = findSite(state.selectedSiteId);
        if (pcSite) {
          var pickedColor = pcParts[2] === "none" ? null : pcParts[2];
          if (pcParts[0] === "col") setColumnColor(pcSite, pcParts[1], pickedColor);
          else setRowColor(pcSite, pcParts[1], pickedColor);
        }
      }
      else if (t.dataset.removeRow) {
        var rrParts = t.dataset.removeRow.split("|");
        var rrSite = findSite(rrParts[0]);
        if (rrSite) removeRow(rrSite, rrParts[1]);
      }
      else if (t.dataset.removeCol) {
        var rcParts = t.dataset.removeCol.split("|");
        var rcSite = findSite(rcParts[0]);
        if (rcSite) removeColumn(rcSite, rcParts[1]);

      }
      else if (t.dataset.cancelAddcol) { state.siteForm.addColForm = emptyAddColForm(); }
      else if (t.dataset.submitAddcol) {
        var acSite = findSite(t.dataset.submitAddcol);
        if (acSite) {
          var f = state.siteForm.addColForm;
          var acTabel = f.tabel || progresTabelFromEl(t);
          var colLabel = (f.label || "").trim();
          if (!colLabel) { flashSyncError("Dă un nume coloanei."); }
          else if (f.tip === "calculat_procent") {
            if (!f.numarator || !f.numitor) flashSyncError("Alege numărătorul și numitorul.");
            else addColumn(acSite, acTabel, { label: colLabel, tip: "calculat", formula: "procent", surse: [f.numarator, f.numitor] });
          } else if (f.tip === "calculat_suma") {

          } else {
            addColumn(acSite, acTabel, { label: colLabel, tip: f.tip });
          }
        }
      }
      else if (t.dataset.toggleCollapseGroup) {
        var gId = t.dataset.toggleCollapseGroup;
        state.siteForm.collapsedGroups[gId] = !state.siteForm.collapsedGroups[gId];
      }
      else if (t.dataset.duplicateRow) {

        if (drSite) duplicateRow(drSite, drParts[1]);
      }
      else if (t.dataset.exportProgresCsv) {
        var ecSite = findSite(t.dataset.exportProgresCsv);
        if (ecSite) exportProgresCSV(ecSite, progresTabelFromEl(t));

      }
      else if (t.dataset.printProgres) {
        var ppSite = findSite(t.dataset.printProgres);
        if (ppSite) printProgres(ppSite, progresTabelFromEl(t));
        needsRender = false;
      }
      else if (t.dataset.undoProgres) {
        var undoSite = findSite(t.dataset.undoProgres);
        var undoTabel = progresTabelFromEl(t);
        if (undoSite && canUndoProgres(undoSite, undoTabel)) undoProgres(undoSite, undoTabel);
      }
      else if (t.dataset.toggleCellFormula) {
        var tcfParts = t.dataset.toggleCellFormula.split("|");
        startFormulaBuilder(progresTabelFromEl(t), tcfParts[0], tcfParts[1]);
      }
      else if (t.dataset.formulaSave) {
        var fsSite = findSite(state.selectedSiteId);
        if (fsSite) saveFormulaBuilder(fsSite); else state.siteForm.formulaBuilder = null;

        if (fcSite && fb) clearCellFormula(fcSite, fb.rowId, fb.colId);
        state.siteForm.formulaBuilder = null;
      }

    if (needsRender) {
      render();
      if (isNav) window.scrollTo(0, 0);
    }

  document.getElementById("app").addEventListener("dblclick", function (e) {
    var sidebarT = e.target.closest("[data-sidebar-name-label]");
    if (sidebarT) {
      clearTimeout(sidebarClickTimer); // cancel the pending single-click navigation
      var site = findSite(sidebarT.dataset.sidebarNameLabel);
      if (!site) return;
      state.sidebarNameEdit = { siteId: site.id, draft: site.numeScurt || site.nume };
      render();
      var sidebarInput = document.getElementById("sidebar-name-input-" + site.id);
      if (sidebarInput) {
        sidebarInput.focus();
        sidebarInput.select();
        sidebarInput.addEventListener("blur", commitSidebarNameEdit);
        sidebarInput.addEventListener("keydown", function (ke) {
          if (ke.key === "Enter") { ke.preventDefault(); sidebarInput.blur(); }
          else if (ke.key === "Escape") { ke.preventDefault(); sidebarInput.removeEventListener("blur", commitSidebarNameEdit); cancelSidebarNameEdit(); }
        });

    }

    var labelT = e.target.closest("[data-edit-label-tip]");
    if (labelT) {
      var currentLabel = labelT.dataset.currentLabel || "";
      startLabelEdit(labelT.dataset.editLabelTip, labelT.dataset.editLabelSite, currentLabel);
      render();
      var labelInput = document.getElementById("label-edit-" + labelT.dataset.editLabelTip);
      if (labelInput) {
        labelInput.focus();
        labelInput.select();
        labelInput.addEventListener("blur", commitLabelEdit);
        labelInput.addEventListener("keydown", function (ke) {
          if (ke.key === "Enter") { ke.preventDefault(); labelInput.blur(); }
          else if (ke.key === "Escape") { ke.preventDefault(); labelInput.removeEventListener("blur", commitLabelEdit); cancelLabelEdit(); }
        });
      }
      return;
    }

    var colLabelT = e.target.closest("[data-edit-col-label]");
    if (colLabelT) {
      var colId = colLabelT.dataset.editColLabel;
      var col = progresColoane.filter(function (c) { return c.id === colId; })[0];
      startColLabelEdit(colId, col ? col.label : "");
      render();
      var colInput = document.getElementById("progcol-edit-" + colId);
      if (colInput) {
        colInput.focus();
        colInput.select();
        colInput.addEventListener("blur", commitColLabelEdit);
        colInput.addEventListener("keydown", function (ke) {
          if (ke.key === "Enter") { ke.preventDefault(); colInput.blur(); }
          else if (ke.key === "Escape") { ke.preventDefault(); colInput.removeEventListener("blur", commitColLabelEdit); cancelColLabelEdit(); }
        });
      }
      return;
    }

    var cellT = e.target.closest("[data-edit-cell]");
    if (cellT) {
      var cellParts = cellT.dataset.editCell.split("|");
      var cellRowId = cellParts[0], cellColId = cellParts[1];
      var cellRow = progresRanduri.filter(function (r) { return r.id === cellRowId; })[0];
      var cellCol = progresColoane.filter(function (c) { return c.id === cellColId; })[0];
      if (!cellRow || !cellCol || cellCol.tip === "calculat") return; // computed by a column formula — not directly editable
      if (cellRow.formuleCelule && cellRow.formuleCelule[cellColId]) {
        startFormulaBuilder(cellRow.tabel, cellRowId, cellColId);
        render();
        return;
      }
      var currentCellVal = cellRow.valori[cellColId];
      startCellEdit(cellRowId, cellColId, currentCellVal);
      render();
      var cellInput = document.getElementById("progcell-edit-" + cellRowId + "-" + cellColId);
      if (cellInput) {
        cellInput.focus();
        cellInput.select();
        cellInput.addEventListener("blur", commitCellEdit);
        cellInput.addEventListener("keydown", function (ke) {
          if (ke.key === "Enter") { ke.preventDefault(); cellInput.blur(); }
          else if (ke.key === "Escape") { ke.preventDefault(); cellInput.removeEventListener("blur", commitCellEdit); cancelCellEdit(); }
        });
      }
    }
  });

  // Drag-to-reorder for the fixed "Date generale ale proiectului" rows.
  // Visual feedback (dragging/insertion classes) is applied directly to the
  // DOM instead of through render(), so the drag gesture isn't interrupted
  // by a full rebuild on every dragover.
  var dragState = { tip: null, scope: null };
  var progRowDragState = { id: null };
  var progColDragState = { id: null };
  // A native HTML5 drag is tied to the exact DOM node the gesture started
  // on. render() replaces #app's entire innerHTML, so if it runs WHILE a
  // progres-grid row/column drag is active, it destroys that node out from
  // under the browser's own drag session — the drag never gets a dragend,
  // the cursor stays stuck on the "grab" icon, and the page stops
  // responding to clicks (though other tabs are unaffected, since only this
  // page's drag session is orphaned, not the whole browser). This can be
  // triggered by something as ordinary as a Supabase write from an EARLIER
  // action resolving its .then() (which calls render() to reconcile a
  // temp-id) while the user is mid-drag on a different row. Guard render()
  // itself so it can never fire mid-drag; queue it and flush once the drag
  // actually ends.
  var progresDragActive = false;
  var renderQueuedDuringDrag = false;
  function clearDocDragClasses() {
    document.querySelectorAll(".docrow.dragging, .docrow.drag-over-top, .docrow.drag-over-bottom").forEach(function (el) {
      el.classList.remove("dragging", "drag-over-top", "drag-over-bottom");
    });
    document.querySelectorAll(".progrid tr.dragging, .progrid tr.drag-over-top, .progrid tr.drag-over-bottom").forEach(function (el) {
      el.classList.remove("dragging", "drag-over-top", "drag-over-bottom");
    });
    document.querySelectorAll(".progrid th.dragging, .progrid th.drag-over-left, .progrid th.drag-over-right").forEach(function (el) {
      el.classList.remove("dragging", "drag-over-left", "drag-over-right");
    });
  }
  // A native drag needs a ghost image, and by default the browser rasterizes
  // the dragged element itself. Doing that for a <tr>/<th> that contains
  // position:sticky cells inside a horizontally-scrolling table is a known
  // freeze trigger in Chromium — so hand it a trivial offscreen element to
  // snapshot instead. (Synthetic DragEvents in automated tests skip this
  // rendering path entirely, which is why it never showed up there.)
  var dragGhostEl = document.createElement("div");
  dragGhostEl.style.cssText = "position:fixed;top:-999px;left:-999px;width:1px;height:1px;";
  document.body.appendChild(dragGhostEl);
  document.getElementById("app").addEventListener("dragstart", function (e) {
    var progRow = e.target.closest("[data-progrow-drag-id]");
    if (progRow) {
      progRowDragState.id = progRow.dataset.progrowDragId;
      progresDragActive = true;
      progRow.classList.add("dragging");
      if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setDragImage(dragGhostEl, 0, 0); }
      return;
    }
    var progCol = e.target.closest("[data-progcol-drag-id]");
    if (progCol) {
      progColDragState.id = progCol.dataset.progcolDragId;
      progresDragActive = true;
      progCol.classList.add("dragging");
      if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setDragImage(dragGhostEl, 0, 0); }
      return;
    }
    var row = e.target.closest("[data-doc-drag-tip]");
    if (!row) return;
    dragState.tip = row.dataset.docDragTip;
    dragState.scope = row.dataset.dragScope;
    row.classList.add("dragging");
    if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
  });
  // dragover can fire far more often than once per frame, and reading
  // getBoundingClientRect() forces a synchronous layout every time — on a
  // wide table-layout:fixed table this adds up fast and reads as a freeze
  // during the drag itself. Coalesce it to at most once per animation frame.
  var dragoverRAF = null;
  var dragoverPending = null;
  function scheduleDragoverUpdate(el, coord, kind) {
    dragoverPending = { el: el, coord: coord, kind: kind };
    if (dragoverRAF) return;
    dragoverRAF = requestAnimationFrame(function () {
      dragoverRAF = null;
      var p = dragoverPending;
      dragoverPending = null;
      if (!p || !document.contains(p.el)) return;
      var rect = p.el.getBoundingClientRect();
      if (p.kind === "row") {
        var before = (p.coord - rect.top) < rect.height / 2;
        p.el.classList.toggle("drag-over-top", before);
        p.el.classList.toggle("drag-over-bottom", !before);
      } else {
        var beforeCol = (p.coord - rect.left) < rect.width / 2;
        p.el.classList.toggle("drag-over-left", beforeCol);
        p.el.classList.toggle("drag-over-right", !beforeCol);
      }
    });
  }
  document.getElementById("app").addEventListener("dragover", function (e) {
    var progRow = e.target.closest("[data-progrow-drag-id]");
    if (progRow && progRowDragState.id) {
      e.preventDefault();
      scheduleDragoverUpdate(progRow, e.clientY, "row");
      return;
    }
    var progCol = e.target.closest("[data-progcol-drag-id]");
    if (progCol && progColDragState.id) {
      e.preventDefault();
      scheduleDragoverUpdate(progCol, e.clientX, "col");
      return;
    }
    var row = e.target.closest("[data-doc-drag-tip]");
    if (!row || !dragState.tip || row.dataset.dragScope !== dragState.scope) return;
    e.preventDefault();
    var rect = row.getBoundingClientRect();
    var before = (e.clientY - rect.top) < rect.height / 2;
    row.classList.toggle("drag-over-top", before);
    row.classList.toggle("drag-over-bottom", !before);
  });
  document.getElementById("app").addEventListener("dragleave", function (e) {
    var progRow = e.target.closest("[data-progrow-drag-id]");
    if (progRow) { progRow.classList.remove("drag-over-top", "drag-over-bottom"); return; }
    var progCol = e.target.closest("[data-progcol-drag-id]");
    if (progCol) { progCol.classList.remove("drag-over-left", "drag-over-right"); return; }
    var row = e.target.closest("[data-doc-drag-tip]");
    if (row) row.classList.remove("drag-over-top", "drag-over-bottom");
  });
  document.getElementById("app").addEventListener("drop", function (e) {
    var progRow = e.target.closest("[data-progrow-drag-id]");
    if (progRow && progRowDragState.id) {
      e.preventDefault();
      // Computed fresh here (not read off the throttled dragover class,
      // which may not have caught up to this exact event yet).
      var rrect = progRow.getBoundingClientRect();
      var rbefore = (e.clientY - rrect.top) < rrect.height / 2;
      var rTargetId = progRow.dataset.progrowDragId;
      var rDraggedId = progRowDragState.id;
      progRowDragState.id = null;
      progresDragActive = false; // clear BEFORE reorderRows(), so its render() actually runs
      clearDocDragClasses();
      var rSite = findSite(state.selectedSiteId);
      if (rSite) reorderRows(rSite, rDraggedId, rTargetId, rbefore);
      return;
    }
    var progCol = e.target.closest("[data-progcol-drag-id]");
    if (progCol && progColDragState.id) {
      e.preventDefault();
      var crect = progCol.getBoundingClientRect();
      var cbefore = (e.clientX - crect.left) < crect.width / 2;
      var cTargetId = progCol.dataset.progcolDragId;
      var cDraggedId = progColDragState.id;
      progColDragState.id = null;
      progresDragActive = false; // clear BEFORE reorderColumns(), so its render() actually runs
      clearDocDragClasses();
      var cSite = findSite(state.selectedSiteId);
      if (cSite) reorderColumns(cSite, cDraggedId, cTargetId, cbefore);
      return;
    }
    var row = e.target.closest("[data-doc-drag-tip]");
    if (!row || !dragState.tip || row.dataset.dragScope !== dragState.scope) return;
    e.preventDefault();
    var before = row.classList.contains("drag-over-top");
    var targetTip = row.dataset.docDragTip;
    var draggedTip = dragState.tip;
    var scope = dragState.scope;
    dragState.tip = null; dragState.scope = null;
    clearDocDragClasses();
    var site = findSite(state.selectedSiteId);
    if (!site) return;
    var scopeTips = scope === "avize" ? avizeTips(site) : mainListTips(site);
    reorderWithinScope(draggedTip, targetTip, before, scopeTips);
  });
  document.getElementById("app").addEventListener("dragend", function () {
    dragState.tip = null; dragState.scope = null;
    progRowDragState.id = null;
    progColDragState.id = null;
    progresDragActive = false;
    if (dragoverRAF) { cancelAnimationFrame(dragoverRAF); dragoverRAF = null; }
    dragoverPending = null;
    clearDocDragClasses();
    // Any render() suppressed while this drag was active (e.g. an unrelated
    // Supabase write resolving mid-drag) is applied now that it's safe.
    if (renderQueuedDuringDrag) { renderQueuedDuringDrag = false; render(); }
  });

  // Column resize: a narrow handle at the right edge of each header cell.
  // Live width is applied straight to the <col> element (not through
  // render()) so dragging is smooth, then committed + persisted on mouseup.
  var colResizeState = { colId: null, startX: 0, startWidth: 0 };
  document.getElementById("app").addEventListener("mousedown", function (e) {
    var handle = e.target.closest("[data-resize-col]");
    if (!handle) return;
    e.preventDefault();
    var th = handle.closest("th");
    colResizeState.colId = handle.dataset.resizeCol;
    colResizeState.startX = e.clientX;
    colResizeState.startWidth = th ? th.getBoundingClientRect().width : 120;
  });
  document.addEventListener("mousemove", function (e) {
    if (!colResizeState.colId) return;
    var newWidth = Math.max(50, Math.round(colResizeState.startWidth + (e.clientX - colResizeState.startX)));
    var col = document.querySelector('col[data-col-id="' + colResizeState.colId + '"]');
    if (col) col.style.width = newWidth + "px";
  });
  document.addEventListener("mouseup", function () {
    if (!colResizeState.colId) return;
    var col = document.querySelector('col[data-col-id="' + colResizeState.colId + '"]');
    var newWidth = col ? parseInt(col.style.width, 10) : null;
    var colId = colResizeState.colId;
    colResizeState.colId = null;
    var site = findSite(state.selectedSiteId);
    if (site && newWidth) resizeColumn(site, colId, newWidth);
  });

  // Paste from Excel: with a grid cell selected (single click), Ctrl+V
  // spills the clipboard's tab/newline-separated values starting there.
  document.getElementById("app").addEventListener("paste", function (e) {
    var anchor = state.siteForm.pasteAnchor;
    if (!anchor || !anchor.rowId) return;
    var text = (e.clipboardData || window.clipboardData).getData("text");
    if (!text) return;
    var site = findSite(state.selectedSiteId);
    if (!site) return;
    e.preventDefault();
    pasteIntoGrid(site, anchor.rowId, anchor.colId, text);
  });

  // If a save failed (offline / dropped request), retry automatically the moment
  // the connection comes back, instead of waiting for the user to notice and tap.
  window.addEventListener("online", function () {
    if (Object.keys(failedCells).length > 0) retryFailedCells();
  });

  // Never let a completed-but-unsynced day get lost by an accidental tab close.
  window.addEventListener("beforeunload", function (e) {
    if (Object.keys(failedCells).length > 0) { e.preventDefault(); e.returnValue = ""; }
  });

  // Ctrl/Cmd+Z undoes the last Progres Șantier grid action — but never while
  // an input/textarea has focus, so the browser's own text-undo still works
  // normally inside a cell/column-name edit in progress.
  document.addEventListener("keydown", function (e) {
    if (!(e.key === "z" || e.key === "Z") || !(e.ctrlKey || e.metaKey) || e.shiftKey) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (state.view !== "detail" || state.activeTab !== "progres") return;
    var site = findSite(state.selectedSiteId);
    var tabel = state.siteForm.progresSubTab || "capitole";
    if (site && canUndoProgres(site, tabel)) { e.preventDefault(); undoProgres(site, tabel); }
  });

  render();
  if (sb) {
    sb.auth.getSession().then(function (res) {
      authState.loading = false;
      var session = res.data && res.data.session;
      if (session) {
        authState.session = session;
        loadAllData().then(render);
      } else {
        render();
      }
    });
  }
})();
</script>
</body>
</html>
