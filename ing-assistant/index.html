<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ing. Assistant</title>
<!-- Installable as a desktop/mobile app: manifest + icons + a service worker
     with a fetch handler are what Chrome/Edge require before they'll offer
     "Install app". The service worker (sw.js) deliberately caches nothing —
     see the comment in that file for why. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0e17">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ing. Assistant">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Motion (motion.dev) — vanilla-JS animation, no React/build step needed.
     Purely a progressive enhancement: every call site below guards for its
     absence (motionAnimate()), so a blocked/slow CDN never breaks the app,
     it just skips the transition. -->
<script src="https://cdn.jsdelivr.net/npm/motion@11/dist/motion.js" defer></script>
<!-- Generate real .docx PV files client-side from the templates in
     /templates/*.docx (a copy of the original Word document per tronson
     category, with {field} placeholders in place of the variable text —
     everything else, incl. header/footer/spacing, is byte-identical to
     what the user supplied). No server, no PDF step. -->
<script src="https://cdn.jsdelivr.net/npm/pizzip@3/dist/pizzip.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3/build/docxtemplater.min.js" defer></script>
<style>
  :root{
    /* "Bento 2026" — dark, industrial-blueprint base with a purple-blue/teal
       accent pair. Every "-soft" token is a low-alpha tint over the dark
       surface (not a pale pastel) so it still reads as a subtle wash rather
       than a bright patch; every semantic color (amber/green/red) keeps its
       original MEANING (warning/success/danger) but is re-tuned to stay
       legible as text/icon color against dark, translucent backgrounds. */
    --bg:#0b0e17; --surface:#141828; --surface-2:#1a1e30;
    --border:#262c44; --border-strong:#3d4570;
    --ink:#eceaf5; --ink-soft:#c2c0dc; --ink-faint:#8583a8;
    --navy:#6f7bff; --navy-hover:#8891ff; --navy-soft:rgba(111,123,255,.16);
    --amber:#ffb400; --amber-soft:rgba(255,180,0,.16); --amber-strong:#ffcf5c;
    --green:#22d3c5; --green-soft:rgba(34,211,197,.16);
    --red:#ff5a78; --red-soft:rgba(255,90,120,.16);
    --gray-soft:rgba(255,255,255,.07);
    --blue-soft:rgba(79,163,255,.18); --purple-soft:rgba(160,110,255,.18);
    --sans:'IBM Plex Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace;
    --display:'Chakra Petch', var(--sans);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  /* Tells the browser its OWN chrome (native <select> popups, date pickers,
     scrollbars, spell-check squiggles) should default to dark too — without
     this, those bits of UI the page can't style directly stay light even
     though every element below is explicitly dark. */
  :root { color-scheme: dark; }
  /* Form controls don't inherit color/background from the page the way
     plain elements do — every browser's UA stylesheet gives them their own
     opaque default (usually white/black) unless told otherwise. Several
     specific input/select/textarea rules further down only override a
     border or padding and were relying on inheriting the rest, which is
     exactly what silently left them white — this blanket rule is the actual
     fix, and it only fills in background/color/font where a more specific
     rule doesn't already set them, so nothing already-correct changes. */
  input, select, textarea { background: var(--surface); color: var(--ink); font-family: var(--sans); border-color: var(--border-strong); }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); opacity: 1; }
  input:disabled, select:disabled, textarea:disabled { opacity: .5; }
  body { font-family: var(--sans); color: var(--ink);
    background:
      radial-gradient(circle at 8% 90%, rgba(255,255,255,.025), transparent 40%),
      radial-gradient(circle at 95% 4%, rgba(111,123,255,.07), transparent 40%),
      repeating-linear-gradient(0deg, rgba(120,150,255,.05) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(120,150,255,.05) 0 1px, transparent 1px 46px),
      linear-gradient(160deg, #0b0e17 0%, #101526 55%, #0b0e17 100%);
    background-attachment: fixed;
  }
  a { color: var(--navy); } a:hover { color: var(--navy-hover); }
  button { font-family: inherit; }
  .app { display: flex; width: 100%; min-height: 100vh; }

  /* sidebar */
  .sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  /* Collapsed state is width:0 (animated via Motion, see toggleSidebarCollapsed())
     rather than display:none, so the width change itself can be animated —
     display can't be transitioned, but width can. */
  .app.sidebar-hidden .sidebar { width: 0; min-width: 0; padding: 0; border-right: none; overflow: hidden; }
  .app.sidebar-hidden .sidebar-collapse-btn { opacity: 0; pointer-events: none; }
  .sidebar-collapse-btn { position: absolute; top: 18px; right: -12px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink-soft); box-shadow: 0 1px 4px rgba(20,20,30,.14); z-index: 5;
    transition: opacity .15s ease, transform .1s ease; }
  .sidebar-collapse-btn:active, .sidebar-expand-btn:active { transform: scale(.9); }
  .sidebar-expand-btn { position: fixed; top: 18px; left: 14px; width: 28px; height: 28px; border-radius: 7px;
    background: var(--surface); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink-soft); box-shadow: 0 2px 8px rgba(20,20,30,.1); z-index: 50; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--navy), var(--green)); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 16px rgba(111,123,255,.4); }
  .brand-name { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }
  .nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px;
    font-size: 13.5px; font-weight: 500; color: var(--ink-soft); cursor: pointer;
    transition: background-color .15s ease, color .15s ease, transform .1s ease; }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item:active { transform: scale(.97); }
  .nav-item svg { flex-shrink: 0; color: var(--ink-faint); }
  .nav-item.active { background: var(--navy-soft); color: var(--navy-hover); box-shadow: inset 0 0 0 1px rgba(111,123,255,.3); }
  .nav-item.active svg { color: var(--navy); }
  .sites { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
  .site-row { display: flex; align-items: center; gap: 9px; padding: 8px 10px 8px 34px; border-radius: 7px;
    font-size: 12.5px; color: var(--ink-soft); cursor: pointer;
    transition: background-color .15s ease, color .15s ease, transform .1s ease; }
  .site-row:hover { background: var(--surface-2); }
  .site-row:active { transform: scale(.97); }
  .site-row.active { background: var(--surface-2); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--navy); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .dot-activ { background: var(--green); }
  .dot-final { background: var(--ink-faint); }
  .site-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site-label-input { width: 100%; min-width: 0; border: 1px solid var(--navy); border-radius: 3px; padding: 2px 6px;
    font-size: 12.5px; font-family: var(--sans); background: var(--surface); color: var(--ink); }
  .spacer { flex: 1 1 auto; }
  .user-box { margin: 10px; padding: 10px; border-radius: 9px; background: var(--surface-2);
    display: flex; align-items: center; gap: 9px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; font-family: var(--mono); flex-shrink: 0; }
  .user-name { font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .user-role { font-size: 11px; color: var(--ink-faint); }

  /* main */
  .main { flex: 1 1 auto; padding: 26px 32px 40px; min-width: 0; }
  .main-inner { max-width: 1220px; }
  .main-inner.wide { max-width: none; }
  .crumb { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
  .crumb b { color: var(--ink-soft); font-weight: 600; }
  .crumb-link { cursor: pointer; text-decoration: underline; text-decoration-color: transparent; }
  .crumb-link:hover { text-decoration-color: var(--ink-faint); }
  .h1 { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .h1-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 9px; font-family: var(--display);
    font-size: 13px; font-weight: 600; letter-spacing: .01em; cursor: pointer; padding: 10px 16px; border: none;
    transition: background-color .15s ease, border-color .15s ease, opacity .15s ease, transform .1s ease, box-shadow .15s ease; }
  .btn-primary { background: linear-gradient(135deg, var(--navy), #4b53d6); color: white;
    box-shadow: 0 6px 18px -6px rgba(111,123,255,.55); }
  .btn-primary:hover:not([disabled]) { transform: translateY(-1px); box-shadow: 0 8px 22px -4px rgba(111,123,255,.75); }
  .btn-ghost { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--navy); color: var(--navy-hover); }
  .btn-sm { padding: 6px 11px; font-size: 11.5px; border-radius: 7px; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .btn:active:not([disabled]) { transform: scale(.96); }

  /* dashboard */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 15px 18px; }
  .stat-val { font-family: var(--mono); font-size: 24px; font-weight: 600; }
  .stat-label { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; cursor: pointer; position: relative;
    transition: border-color .12s ease, box-shadow .12s ease; }
  .card-del { position: absolute; top: 10px; right: 10px; z-index: 2; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(20,24,38,.85); display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); cursor: pointer; }
  .card-del:hover { color: var(--red); background: var(--surface-2); }
  .dash-seeall { display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--navy);
    cursor: pointer; margin-top: 14px; width: fit-content; }
  .dash-seeall:hover { color: var(--navy-hover); }
  .card:hover { border-color: var(--navy); box-shadow: 0 10px 30px -14px rgba(111,123,255,.5); }
  .thumb { height: 108px; position: relative; background-image:
      linear-gradient(rgba(20,24,38,.94), rgba(20,24,38,.94)),
      linear-gradient(rgba(111,123,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(111,123,255,.12) 1px, transparent 1px);
    background-size: 100% 100%, 16px 16px, 16px 16px; display: flex; align-items: center; justify-content: center; }
  .thumb svg { color: var(--navy-hover); opacity: 0.7; }
  .card-body { padding: 15px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-title { font-family: var(--display); font-size: 14.5px; font-weight: 700; line-height: 1.3; }
  .card-addr { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft); }
  .card-addr svg { flex-shrink: 0; color: var(--ink-faint); }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px;
    border-radius: 100px; width: fit-content; }
  .badge-activ { background: var(--green-soft); color: var(--green); }
  .badge-final { background: var(--surface-2); color: var(--ink-soft); }
  .prog-row { display: flex; align-items: center; gap: 9px; }
  .prog-track { flex: 1; height: 6px; border-radius: 100px; background: var(--surface-2); overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--navy), var(--green)); }
  .prog-pct { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink-soft); width: 32px; text-align: right; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border);
    padding-top: 10px; margin-top: 2px; }
  .card-date { font-size: 11px; color: var(--ink-faint); }
  .card-open { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--navy); }
  .card-new { border: 1.5px dashed var(--border-strong); background: transparent; align-items: center;
    justify-content: center; flex-direction: column; gap: 8px; min-height: 240px; color: var(--ink-faint); cursor: pointer; }
  .card-new:hover { border-color: var(--border-strong); box-shadow: none; }
  .card-new-label { font-size: 13px; font-weight: 600; }

  /* detail header + tabs */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 20px;
    border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .h1row { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .head-sub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .head-meta { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
  .ring-val { position: relative; font-family: var(--mono); font-size: 11px; font-weight: 700; }
  .tabs { display: flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--ink-soft); border-bottom: 2px solid transparent;
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    transition: color .15s ease, border-color .15s ease, transform .1s ease; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--navy); border-bottom-color: var(--navy); }
  .tab:active { transform: scale(.97); }
  .subtabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .subtab { padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--ink-faint); border-bottom: 2px solid transparent;
    cursor: pointer; transition: color .15s ease, border-color .15s ease, transform .1s ease; }
  .subtab:hover { color: var(--ink-soft); }
  .subtab.active { color: var(--navy); border-bottom-color: var(--navy); }
  .subtab:active { transform: scale(.97); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }

  /* pontaj */
  .pontaj-panel { padding: 0; }
  .pontaj-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px 0; flex-wrap: wrap; }
  .period { display: flex; align-items: center; gap: 10px; }
  .period-nav { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border-strong); display: flex;
    align-items: center; justify-content: center; color: var(--ink-soft); background: var(--surface); }
  .period-label { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .tbl-wrap { overflow-x: auto; margin-top: 16px; }
  table { border-collapse: collapse; font-size: 12px; min-width: 100%; }
  th, td { padding: 0; text-align: center; }
  th.name-h, td.name { position: sticky; left: 0; background: var(--surface); z-index: 2; box-shadow: 1px 0 0 var(--border); }
  th { font-weight: 600; padding: 8px 4px 6px; border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); background: var(--surface-2); }
  th.name-h { text-align: left; padding-left: 14px; background: var(--surface-2); }
  .daynum { font-family: var(--mono); font-size: 12.5px; }
  .daydow { font-size: 9.5px; color: var(--ink-faint); font-weight: 500; margin-top: 1px; }
  th.weekend { background: #12162a; }
  td.name { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--border); min-width: 168px; }
  td.name b { display: block; font-size: 12.5px; font-weight: 600; }
  td.name span { display: block; font-size: 10.5px; color: var(--ink-faint); margin-top: 1px; }
  td.day { border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); width: 42px; padding: 4px 2px; }
  .cell { position: relative; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px;
    font-family: var(--mono); font-weight: 600; font-size: 12px; margin: 0 2px; }
  .cw { color: var(--ink); }
  .coff { color: var(--ink-faint); font-weight: 500; }
  .cleave { background: var(--navy-soft); color: var(--navy); }
  .csick { background: var(--red-soft); color: var(--red); }
  .cempty { color: var(--border-strong); font-weight: 400; }
  .covertime { background: var(--amber-soft); color: var(--amber-strong); box-shadow: inset 0 0 0 1.5px var(--amber-strong); }
  .edited-ring { box-shadow: inset 0 0 0 1.5px var(--amber-strong); }
  .pencil-badge { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--amber); color: #1a1610; display: flex; align-items: center; justify-content: center; }
  td.total { border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); font-family: var(--mono);
    font-weight: 700; font-size: 12.5px; background: var(--surface-2); width: 56px; }
  .foot-note { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 20px; margin-top: 4px;
    border-top: 1px solid var(--border); background: var(--surface-2); }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); }
  .legend .sw { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
  .edit-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); margin-left: auto; }
  .edit-note svg { color: var(--amber-strong); flex-shrink: 0; }

  /* proces-verbal */
  .cols { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
  .panel-title { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
  .panel-sub { font-size: 12px; color: var(--ink-faint); margin-bottom: 14px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; display: flex;
    align-items: center; justify-content: space-between; }
  .mic { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--navy); }
  textarea { width: 100%; min-height: 150px; border: 1px solid var(--border-strong); border-radius: 3px; padding: 12px;
    font-family: var(--sans); font-size: 13px; color: var(--ink); resize: none; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .chip { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 100px; border: 1px solid var(--border-strong);
    color: var(--ink-soft); background: var(--surface-2); }
  .btn-block { width: 100%; justify-content: center; }
  .helper { font-size: 11.5px; color: var(--ink-faint); margin-top: 9px; line-height: 1.4; }
  .doc-panel { padding: 0; overflow: hidden; }
  .doc-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; gap: 8px; }
  .ai-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--amber-strong);
    background: var(--amber-soft); padding: 4px 10px; border-radius: 100px; }
  .doc-actions { display: flex; gap: 8px; }
  .doc-page { padding: 34px 40px; }
  .doc-letterhead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
  .doc-logo { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 700; color: var(--ink-faint); }
  .doc-logo-mark { width: 26px; height: 26px; border-radius: 6px; border: 1.5px dashed var(--border-strong); }
  .doc-nr { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); text-align: right; }
  .doc-title { text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 18px; }
  .doc-meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .doc-table th, .doc-table td { border: 1px solid var(--border-strong); padding: 6px 9px; text-align: left; }
  .doc-table th { background: var(--surface-2); font-weight: 600; font-size: 11px; }
  .doc-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
  .doc-sign-line { border-top: 1px solid var(--ink-faint); padding-top: 6px; font-size: 11.5px; color: var(--ink-soft); }

  /* progres */
  .summary { display: flex; align-items: center; gap: 28px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 26px; margin-bottom: 16px; }
  .summary-meta { display: flex; gap: 36px; flex-wrap: wrap; }
  .meta-item .mv { font-family: var(--mono); font-size: 19px; font-weight: 700; }
  .meta-item .ml { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .badge-done { background: var(--green-soft); color: var(--green); }
  .badge-progress { background: var(--amber-soft); color: var(--amber-strong); }
  .badge-notstarted { background: var(--surface-2); color: var(--ink-faint); }

  /* progres: grid liber (coloane + rânduri configurabile) */
  .progrid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; max-width: 100%; }
  table.progrid { border-collapse: collapse; width: 100%; font-size: 12.5px; table-layout: fixed; }
  .progrid th, .progrid td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progrid th:last-child, .progrid td:last-child { border-right: none; }
  .progrid thead th { background: var(--surface-2); font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--ink-faint); padding: 0; text-align: left; position: relative; }
  .progrid-th-inner { display: flex; align-items: center; gap: 5px; padding: 8px 10px; overflow: hidden; }
  .progrid-resize-handle { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 4; }
  /* Frozen (position:sticky) columns were removed — combined with native
     HTML5 drag-and-drop on the row/column headers, sticky table cells are
     a known freeze trigger in Chromium, and it kept reproducing even after
     mitigating the drag-image and dragover-layout costs. The class names
     stay (still used for background/border styling) but no longer stick. */
  .progrid .progrid-sticky-2 { border-right: 1.5px solid var(--border-strong); }
  .progrid td.progrid-sticky-1, .progrid td.progrid-sticky-2 { background: var(--surface); }
  .progrid th.progrid-sticky-1, .progrid th.progrid-sticky-2 { background: var(--surface-2); }
  .progrid tbody tr.progrow-group td.progrid-sticky-1, .progrid tbody tr.progrow-group td.progrid-sticky-2 { background: var(--surface-2); }
  .progrid-collapse-btn { cursor: pointer; color: var(--ink-soft); display: inline-flex; align-items: center;
    justify-content: center; width: 12px; font-size: 11px; font-weight: 700; vertical-align: middle; margin-right: 2px; }
  .progrid td.progrid-cell-editable:focus { outline: 2px solid var(--navy); outline-offset: -2px; }
  .progrid-col-grip { cursor: grab; color: var(--ink-faint); flex-shrink: 0; display: flex; }
  .progrid-col-label { cursor: pointer; border-radius: 3px; padding: 2px 4px; margin: -2px -4px; flex: 1; }
  .progrid-col-label:hover { background: var(--border); }
  .progrid-col-input { font-size: 10.5px; font-weight: 600; font-family: var(--sans); text-transform: none; letter-spacing: normal;
    border: 1px solid var(--navy); border-radius: 3px; padding: 3px 5px; min-width: 100px; field-sizing: content; }
  .progrid-col-tag { color: var(--ink-faint); font-weight: 700; }
  .progrid-col-del { cursor: pointer; color: var(--ink-faint); flex-shrink: 0; display: flex; }
  .progrid-col-del:hover { color: var(--red); }
  .progrid th.dragging { opacity: .4; }
  .progrid th.drag-over-left { box-shadow: inset 2px 0 0 var(--navy); }
  .progrid th.drag-over-right { box-shadow: inset -2px 0 0 var(--navy); }
  .progrid tbody tr.dragging { opacity: .4; }
  .progrid tbody tr.drag-over-top td { box-shadow: inset 0 2px 0 var(--navy); }
  .progrid tbody tr.drag-over-bottom td { box-shadow: inset 0 -2px 0 var(--navy); }
  .progrid tbody tr.progrow-group td { background: var(--surface-2); font-weight: 700; }
  .progrid td { padding: 8px 10px; color: var(--ink); }
  .progrid-color-btn { width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--border-strong);
    cursor: pointer; flex-shrink: 0; display: inline-block; background: transparent; padding: 0; }
  .progrid-color-btn.has-color { border-color: transparent; }
  .colorpop { position: fixed; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(20,20,30,.18); padding: 8px; z-index: 40; display: flex; gap: 6px; align-items: center; }
  .colorpop-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border-strong); padding: 0; }
  .colorpop-clear { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; color: var(--ink-faint); background: var(--surface); font-size: 11px; padding: 0; }
  .progrid-rowsrc-btn { color: var(--ink-faint); cursor: pointer; display: flex; flex-shrink: 0; }
  .progrid-rowsrc-btn:hover { color: var(--navy); }
  .progrid td.progrid-cell { text-align: center; position: relative; }
  .progrid td.progrid-cell-editable { cursor: pointer; }
  .progrid td.progrid-cell-editable:hover { background: var(--surface-2); }
  .progrid td.progrid-cell-computed { color: var(--ink-soft); font-style: italic; }
  .progrid .progrid-grip { text-align: center; width: 22px; padding: 8px 6px; color: var(--ink-faint); }
  /* Manual (mousedown/mousemove/mouseup) row/column reordering — see the
     comment above endManualProgDrag() for why this replaced native HTML5
     drag-and-drop. Suppress text selection and show a consistent "grabbing"
     cursor for the whole page while a grip is held down. */
  body.progrid-manual-drag { cursor: grabbing !important; user-select: none !important; }
  body.progrid-manual-drag * { cursor: grabbing !important; }
  .progrid .progrid-num { font-family: var(--mono); }
  .progrid .progrid-del-cell { text-align: center; width: 30px; padding: 8px 6px; }
  .progrid-del { color: var(--ink-faint); cursor: pointer; display: inline-flex; }
  .progrid-del:hover { color: var(--red); }
  .progrid-cell-input { width: 100%; box-sizing: border-box; border: 1px solid var(--navy); border-radius: 3px;
    padding: 3px 5px; font-family: inherit; font-size: inherit; text-align: center; }
  .doclist-empty.progrid-empty-cell { padding: 16px 22px; text-align: center; }
  .tronson-input { width: 100%; min-width: 90px; box-sizing: border-box; border: 1px solid transparent; border-radius: 3px;
    padding: 6px 7px; font-family: var(--sans); font-size: 12.5px; background: transparent; }
  .tronson-input:hover { border-color: var(--border-strong); }
  .tronson-input:focus { border-color: var(--navy); outline: none; background: var(--surface); }

  /* per-cell formula: the small "ƒ" toggle + the pick-cells builder mode.
     Deliberately NOT hover-revealed: a "td:hover .child" rule forces the
     browser to recompute a descendant's style on every cell the pointer
     crosses, and during a native HTML5 row/column drag the pointer sweeps
     over every cell in the table — the same freeze-trigger profile that
     position:sticky caused earlier (see the drag-freeze note below). Always
     visible but dim keeps the cost flat instead of per-cell-crossed. */
  .progrid-formula-btn { position: absolute; top: 1px; right: 2px; font-size: 9px; font-weight: 700; font-style: normal;
    line-height: 1; color: var(--border-strong); cursor: pointer; padding: 1px 3px; border-radius: 3px; }
  .progrid-formula-btn.has-formula { color: var(--navy); background: var(--navy-soft); }
  .progrid td.progrid-term-target { box-shadow: inset 0 0 0 2px var(--navy); background: var(--navy-soft) !important; }
  .progrid td.progrid-term-pos { box-shadow: inset 0 0 0 2px var(--green); background: var(--green-soft) !important; }
  .progrid td.progrid-term-neg { box-shadow: inset 0 0 0 2px var(--red); background: var(--red-soft) !important; }

  /* Cell merge: a rectangle of 2+ cells drawn as one cell (rowspan/colspan)
     — see the comment above mergesForTabel() for why the underlying data
     stays independent per cell. progrid-range-cell is the live drag-select
     highlight shown while picking the rectangle, before it's confirmed. */
  .progrid td.progrid-range-cell { box-shadow: inset 0 0 0 2px var(--navy); background: var(--navy-soft) !important; }
  .progrid td.progrid-cell-merged { text-align: center; vertical-align: middle; }
  .progrid-unmerge-btn { position: absolute; top: 1px; left: 2px; color: var(--border-strong); cursor: pointer;
    display: flex; padding: 1px; border-radius: 3px; }
  .progrid-unmerge-btn:hover { color: var(--red); background: var(--surface-2); }

  .progrid-toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .addcol-form { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 12px;
    background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
  .addcol-row { display: flex; flex-direction: column; gap: 4px; }
  .addcol-row label { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .addcol-row input, .addcol-row select { border: 1px solid var(--border-strong); border-radius: 3px; padding: 8px 10px;
    font-size: 12.5px; font-family: var(--sans); background: var(--surface); }

  /* documente */

  /* pontaj global */
  .site-select { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

  .site-chip:hover { border-color: var(--border-strong); }

  /* pontaj — period controls, quick-entry popover, add/remove worker */
  .mode-select { display: flex; gap: 6px; flex-wrap: wrap; }
  .mode-chip { padding: 7px 12px; border-radius: 100px; border: 1px solid var(--border-strong); background: var(--surface);
    font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .mode-chip:hover { border-color: var(--border-strong); }
  .mode-chip.active { background: var(--navy); border-color: var(--navy); color: white; }
  .select-toggle { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 100px;
    border: 1px solid var(--border-strong); background: var(--surface); font-size: 12px; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; }
  .select-toggle:hover { border-color: var(--border-strong); }
  .select-toggle.active { background: var(--amber-soft); border-color: var(--amber-strong); color: var(--amber-strong); }
  .daycell { position: relative; cursor: pointer; }
  .daycell.selectable .cell { box-shadow: inset 0 0 0 1.5px var(--border-strong); }
  .daycell.cell-picked .cell { box-shadow: inset 0 0 0 2px var(--amber-strong); background: var(--amber-soft); }
  .daycell.cell-failed .cell { box-shadow: inset 0 0 0 2px var(--red); }
  .cell-failed-dot { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--red); color: #fff; font-size: 10px; font-weight: 800; line-height: 14px; text-align: center; }
  .bulk-bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 40;
    background: #0a0c14; color: white; border-radius: 100px; padding: 8px 8px 8px 16px;

  /* fixed (not absolute) so it escapes .tbl-wrap's scroll clipping — position set in JS via
     positionOpenPopover(), since overflow-x:auto on an ancestor forces overflow-y:auto too
     (a real CSS quirk), which would otherwise clip an absolutely-positioned popover. */
  .daypop { position: fixed; background: var(--surface);

  .daypop-opt { padding: 7px 10px; font-size: 12px; font-weight: 600; color: var(--ink); border-radius: 6px; white-space: nowrap; cursor: pointer; }

  .logout-link { margin-left: auto; cursor: pointer; color: var(--ink-faint); }

  @media print {

<body>
<div id="app"></div>
<div id="print-sheet"></div>
<script>
(function () {
  "use strict";

  var BUILD = "b52-2026-09-20";
  var todayD = new Date();

  function emptySiteDraft() {
    return { nume: "", adresa: "", numarProiect: "", proiectant: "", constructor: "", contract: "", perioadaExecutie: "", dataExpirareContract: "", garantie: "", ordinIncepere: "" };
  }

  var state = {
    view: "dashboard", selectedSiteId: null, activeTab: "date-santier", globalSiteId: null, sidebarCollapsed: false,
    pontaj: {
      year: todayD.getFullYear(),
      month: todayD.getMonth() + 1,
      periodMode: todayD.getDate() <= 14 ? "avans" : "lichidare",
      openCell: null,
      editingCompany: false,
      newWorker: { name: "", functie: "", salariu: "", metoda: "CARD", telefon: "" },
      companyDraft: { name: "", cif: "" },
      selectMode: false,
      selectedCells: []
    },
    siteForm: {
      addOpen: false,
      addDraft: emptySiteDraft(),
      editing: false,
      editDraft: emptySiteDraft(),
      subTab: "sintetice",
      progresSubTab: "capitole",
      docDrafts: {},
      docUploading: {},
      labelEdit: { tip: null, siteId: null, draft: "" },
      gridCellEdit: { rowId: null, colId: null, draft: "" },
      gridColLabelEdit: { colId: null, draft: "" },
      addColForm: { open: false, tabel: null, label: "", tip: "numar", numarator: "", numitor: "", surseSuma: {} },
      colorPickerOpen: { type: null, id: null },
      formulaBuilder: null,
      collapsedGroups: {},
      pasteAnchor: null,
      cellRangeSelect: null,
      pvDateEditing: false,
      pvDateDraft: null
    },
    sidebarNameEdit: { siteId: null, draft: "" }
  };

  // --- șantiere: persisted in Supabase, loaded via loadAllData() below ---
  var sites = [];

  function statusBadgeCls(status) { return status === "Finalizat" ? "badge-final" : "badge-activ"; }
  function statusDotCls(status) { return status === "Finalizat" ? "dot-final" : "dot-activ"; }

  // --- Date generale ale proiectului: nr/dată + fișier scanat, per tip de document ---
  var DOC_BUCKET = "santier-documente";
  var PROJECT_DOCS = [
    ["autorizatie", "Autorizație"],
    ["certificat_urbanism", "Certificat de Urbanism"],
    ["ordin_incepere", "Ordin de începere"]
  ];
  var projectDocs = [];
  function docFromRow(d) {
    return { id: d.id, santierId: d.santier_id, tip: d.tip, eticheta: d.eticheta || "", valoare: d.valoare || "", fisierPath: d.fisier_path || "", fisierNume: d.fisier_nume || "", fisierMarime: d.fisier_marime || null };
  }
  function findProjectDoc(santierId, tip) {
    for (var i = 0; i < projectDocs.length; i++) if (projectDocs[i].santierId === santierId && projectDocs[i].tip === tip) return projectDocs[i];
    return null;
  }
  function docDraftKey(santierId, tip) { return santierId + "|" + tip; }
  function sanitizeFilename(name) { return String(name).replace(/[^a-zA-Z0-9.\-_]+/g, "_"); }

  // Row order is one shared list (company-wide) holding every tip ever seen —
  // fixed types and per-site custom rows (doc-/aviz-) alike. Each panel only
  // ever drags within its own tips, so reordering one scope can never disturb
  // another's relative order, even though they all live in the same array.
  function isFixedTip(tip) { return PROJECT_DOCS.some(function (d) { return d[0] === tip; }); }
  function docTipLabel(tip, fallback) {
    return (company.docTipLabels && company.docTipLabels[tip]) || fallback;
  }
  function mainListTips(site) {
    var fixed = PROJECT_DOCS.map(function (d) { return d[0]; });
    var custom = projectDocs.filter(function (d) { return d.santierId === site.id && d.tip.indexOf("doc-") === 0; }).map(function (d) { return d.tip; });
    return fixed.concat(custom);
  }
  function avizeTips(site) {
    return projectDocs.filter(function (d) { return d.santierId === site.id && d.tip.indexOf("aviz-") === 0; }).map(function (d) { return d.tip; });
  }
  function orderedTipsFor(candidateTips, orderArray) {
    if (!orderArray || !orderArray.length) return candidateTips.slice();
    var set = {};
    candidateTips.forEach(function (t) { set[t] = true; });
    var ordered = orderArray.filter(function (t) { return set[t]; });
    var seen = {};
    ordered.forEach(function (t) { seen[t] = true; });
    candidateTips.forEach(function (t) { if (!seen[t]) ordered.push(t); });
    return ordered;
  }
  function reorderWithinScope(draggedTip, targetTip, before, scopeTips) {
    if (draggedTip === targetTip) return;
    if (scopeTips.indexOf(draggedTip) === -1 || scopeTips.indexOf(targetTip) === -1) return; // no cross-scope drops
    var fullOrder = (company.docTipOrder || []).slice();
    scopeTips.forEach(function (t) { if (fullOrder.indexOf(t) === -1) fullOrder.push(t); });
    var fromIdx = fullOrder.indexOf(draggedTip);
    if (fromIdx === -1) return;
    fullOrder.splice(fromIdx, 1);
    var toIdx = fullOrder.indexOf(targetTip);
    if (toIdx === -1) return;
    if (!before) toIdx += 1;
    fullOrder.splice(toIdx, 0, draggedTip);
    company.docTipOrder = fullOrder;
    render();
    sb.from("companie").update({ doc_tip_order: fullOrder }).eq("id", 1).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva ordinea documentelor."); console.error(res.error); }
    });
  }

  // --- pontaj: persisted in Supabase (workers, daily statuses, company header) ---
  var SUPABASE_URL = "https://rwxsvsqoohepcfbawfng.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3eHN2c3Fvb2hlcGNmYmF3Zm5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NTM4NjksImV4cCI6MjEwNTAyOTg2OX0.kQDsm-LvaKf9iNg9g8fdzdpaHBznK94-_S3jfukKyCs";
  var sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  var authState = { loading: true, session: null, loginError: "", loggingIn: false };
  var syncError = null;

  var workers = [];
  var entries = {};
  var company = { name: "", cif: "", docTipOrder: null, docTipLabels: null };
  // Cells whose write to Supabase failed — kept until retried successfully, so a
  // network blip can never silently drop a completed day (per user requirement:
  // "nu vreau sa pierd ce completez").
  var failedCells = {};

  function flashSyncError(msg) {
    syncError = msg;
    render();
    setTimeout(function () { syncError = null; render(); }, 4000);
  }

  function siteFromRow(s) {
    return {
      id: s.id, nume: s.nume, adresa: s.adresa || "", numarProiect: s.numar_proiect || "",
      proiectant: s.proiectant || "", constructor: s.constructor || "", contract: s.contract || "",
      perioadaExecutie: s.perioada_executie || "", dataExpirareContract: s.data_expirare_contract || "",
      garantie: s.garantie || "", ordinIncepere: s.ordin_incepere || "", status: s.status || "Activ",
      numeScurt: s.nume_scurt || "", progresColoaneOrder: s.progres_coloane_order || null, progresRanduriOrder: s.progres_randuri_order || null,
      progresMerges: s.progres_merges || null
    };
  }

  function loadAllData() {
    return Promise.all([
      sb.from("muncitori").select("*").order("created_at"),
      sb.from("pontaj_intrari").select("*"),
      sb.from("companie").select("*").eq("id", 1).single(),
      sb.from("santiere").select("*").order("created_at"),
      sb.from("santier_documente").select("*"),
      sb.from("santier_progres_coloane").select("*"),
      sb.from("santier_progres_randuri").select("*"),
      sb.from("santier_pv_date").select("*"),
      sb.from("santier_tronsoane").select("*").order("ordine")
    ]).then(function (results) {
      var mRes = results[0], eRes = results[1], cRes = results[2], sRes = results[3], dRes = results[4], pcRes = results[5], prRes = results[6], pvRes = results[7], trRes = results[8];
      workers = (mRes.data || []).map(function (w) {
        return { id: w.id, name: w.nume, functie: w.functie || "", salariu: w.salariu, metodaPlata: w.metoda_plata || "CARD", telefon: w.telefon || "" };
      });
      entries = {};
      (eRes.data || []).forEach(function (e) { entries[e.muncitor_id + "|" + e.data] = e.status; });
      if (cRes.data) company = { name: cRes.data.nume, cif: cRes.data.cod_fiscal, docTipOrder: cRes.data.doc_tip_order || null, docTipLabels: cRes.data.doc_tip_labels || null };
      sites = (sRes.data || []).map(siteFromRow);
      projectDocs = (dRes.data || []).map(docFromRow);
      progresColoane = (pcRes.data || []).map(progresColFromRow);
      progresRanduri = (prRes.data || []).map(progresRandFromRow);
      pvDateList = (pvRes.data || []).map(pvDateFromRow);
      tronsoane = (trRes.data || []).map(tronsonFromRow);
    }).catch(function (err) {
      flashSyncError("Nu am putut încărca datele din Supabase.");
      console.error(err);
    });
  }

  function doLogin() {
    var emailEl = document.getElementById("login-email");
    var passEl = document.getElementById("login-password");
    if (!emailEl || !passEl) return;
    authState.loginError = "";
    authState.loggingIn = true;
    render();
    sb.auth.signInWithPassword({ email: emailEl.value.trim(), password: passEl.value }).then(function (res) {
      authState.loggingIn = false;
      if (res.error) { authState.loginError = "Email sau parolă greșită."; render(); return; }
      authState.session = res.data.session;
      loadAllData().then(render);
    });
  }

  function doLogout() {
    sb.auth.signOut().then(function () {
      authState.session = null;
      workers = []; entries = {}; company = { name: "", cif: "", docTipOrder: null, docTipLabels: null }; sites = []; projectDocs = [];
      progresColoane = []; progresRanduri = []; progresSeededSites = {}; progresUndoStack = {};
      pvDateList = []; tronsoane = [];
      state.view = "dashboard"; state.selectedSiteId = null;
      render();
    });
  }

  var MONTHS_RO = ["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function dateKey(y, m, d) { return y + "-" + pad2(m) + "-" + pad2(d); }
  function isWeekend(y, m, d) { var dow = new Date(y, m - 1, d).getDay(); return dow === 0 || dow === 6; }
  function dowShort(y, m, d) { return ["D","L","Ma","Mi","J","V","S"][new Date(y, m - 1, d).getDay()]; }
  function weekendLabel(y, m, d) { return new Date(y, m - 1, d).getDay() === 6 ? "Sambata" : "Duminica"; }

  function periodRange(mode, y, m) {
    var last = daysInMonth(y, m);
    if (mode === "avans") return { start: 1, end: 15 };
    if (mode === "lichidare") return { start: 16, end: last };
    return { start: 1, end: last };
  }

  function cellStatus(workerId, y, m, d) {
    if (isWeekend(y, m, d)) return "weekend";
    return entries[workerId + "|" + dateKey(y, m, d)] || "empty"; // "empty" = nothing recorded yet — never assume worked
  }
  function setStatus(workerId, dk, status) {
    var key = workerId + "|" + dk;
    if (status === "empty") delete entries[key]; else entries[key] = status;
    delete failedCells[key]; // this is a fresh attempt — clear any earlier failure mark
    if (String(workerId).indexOf("tmp-") === 0) return; // worker not yet persisted, nothing to sync
    var req = status === "empty"
      ? sb.from("pontaj_intrari").delete().match({ muncitor_id: workerId, data: dk })
      : sb.from("pontaj_intrari").upsert({ muncitor_id: workerId, data: dk, status: status }, { onConflict: "muncitor_id,data" });
    req.then(function (res) {
      if (res.error) {
        failedCells[key] = status;
        flashSyncError("Nu s-a putut salva o zi — va rămâne marcată până se reîncearcă.");
        console.error(res.error);
        render();
      }
    });
  }
  function setStatusBulk(cellKeys, status) {
    cellKeys.forEach(function (key) {
      var sep = key.indexOf("|");
      var workerId = key.slice(0, sep), dk = key.slice(sep + 1);
      setStatus(workerId, dk, status);
    });
  }
  function retryFailedCells() {
    Object.keys(failedCells).forEach(function (key) {
      var status = failedCells[key];
      var sep = key.indexOf("|");
      setStatus(key.slice(0, sep), key.slice(sep + 1), status);
    });
  }
  function addWorkerFromInput() {
    var nw = state.pontaj.newWorker;
    var name = (nw.name || "").trim();
    if (!name) return;
    var functie = (nw.functie || "").trim();
    var salariu = nw.salariu ? Number(nw.salariu) : null;
    var metodaPlata = nw.metoda || "CARD";
    var telefon = (nw.telefon || "").trim();

    var tempId = "tmp-" + Date.now();
    workers.push({ id: tempId, name: name, functie: functie, salariu: salariu, metodaPlata: metodaPlata, telefon: telefon });
    sb.from("muncitori").insert({ nume: name, functie: functie, salariu: salariu, metoda_plata: metodaPlata, telefon: telefon })
      .select().single().then(function (res) {
        if (res.error) {
          // roll back the optimistic row — leaving it would look "saved" while
          // being purely local, and any pontaj entries typed against it would
          // vanish silently since they were never sent to Supabase either
          workers = workers.filter(function (x) { return x.id !== tempId; });
          flashSyncError("Nu am putut salva muncitorul nou — încearcă din nou.");
          console.error(res.error);
          render();
          return;
        }
        var w = workers.filter(function (x) { return x.id === tempId; })[0];
        if (w) w.id = res.data.id;
        render();
      });
    state.pontaj.newWorker = { name: "", functie: "", salariu: "", metoda: "CARD", telefon: "" };
  }
  // Every destructive delete in the app must ask before it happens — nothing
  // disappears from a single accidental click.
  function confirmDelete(msg) { return window.confirm(msg); }

  function removeWorker(id) {
    var w = workers.filter(function (x) { return x.id === id; })[0];
    if (!w) return;
    if (!confirmDelete('Ștergi muncitorul "' + w.name + '"? Se șterge și tot pontajul lui înregistrat. Această acțiune nu poate fi anulată.')) return;
    workers = workers.filter(function (x) { return x.id !== id; });
    render();
    if (String(id).indexOf("tmp-") === 0) return;
    sb.from("muncitori").delete().eq("id", id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut șterge muncitorul."); console.error(res.error); }
    });
  }
  function saveCompanyFromInputs() {
    var cd = state.pontaj.companyDraft;
    if (cd.name && cd.name.trim()) company.name = cd.name.trim();
    if (cd.cif && cd.cif.trim()) company.cif = cd.cif.trim();
    sb.from("companie").update({ nume: company.name, cod_fiscal: company.cif }).eq("id", 1).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva datele firmei."); console.error(res.error); }
    });
  }

  function siteDraftToRow(d) {
    return {
      nume: (d.nume || "").trim(), adresa: (d.adresa || "").trim(), numar_proiect: (d.numarProiect || "").trim(),
      proiectant: (d.proiectant || "").trim(), constructor: (d.constructor || "").trim(), contract: (d.contract || "").trim(),
      perioada_executie: (d.perioadaExecutie || "").trim(), data_expirare_contract: (d.dataExpirareContract || "").trim(),
      garantie: (d.garantie || "").trim(), ordin_incepere: (d.ordinIncepere || "").trim()
    };
  }

  function addSiteFromInput() {
    var d = state.siteForm.addDraft;
    var nume = (d.nume || "").trim();
    if (!nume) return; // denumirea este obligatorie — apare direct în PV-uri

    var tempId = "tmp-" + Date.now();
    var optimistic = siteDraftToRow(d);
    optimistic.id = tempId; optimistic.status = "Activ";
    sites.push(siteFromRow(optimistic));

    sb.from("santiere").insert(siteDraftToRow(d)).select().single().then(function (res) {
      if (res.error) {
        sites = sites.filter(function (s) { return s.id !== tempId; });
        flashSyncError("Nu am putut salva șantierul — încearcă din nou.");
        console.error(res.error);
        render();
        return;
      }
      var s = sites.filter(function (x) { return x.id === tempId; })[0];
      if (s) s.id = res.data.id;
      render();
    });

    state.siteForm.addOpen = false;
    state.siteForm.addDraft = emptySiteDraft();
  }

  function saveSiteEditFromInput(id) {
    var site = findSite(id);
    if (!site) return;
    var row = siteDraftToRow(state.siteForm.editDraft);
    if (!row.nume) delete row.nume; // never blank out the name via an empty edit field
    Object.assign(site, {
      nume: row.nume || site.nume, adresa: row.adresa, numarProiect: row.numar_proiect, proiectant: row.proiectant,
      constructor: row.constructor, contract: row.contract, perioadaExecutie: row.perioada_executie,
      dataExpirareContract: row.data_expirare_contract, garantie: row.garantie, ordinIncepere: row.ordin_incepere
    });
    sb.from("santiere").update(row).eq("id", id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva datele șantierului."); console.error(res.error); render(); }
    });
  }

  // Sidebar-only short name: a separate field so it can be abbreviated to fit
  // the narrow sidebar without touching the real name used everywhere else
  // (cards, headers, procese-verbale, print).
  var sidebarClickTimer = null;
  function commitSidebarNameEdit() {
    var edit = state.sidebarNameEdit;
    if (!edit || !edit.siteId) return;
    var site = findSite(edit.siteId);
    if (site) {
      var val = (edit.draft || "").trim();
      site.numeScurt = val;
      sb.from("santiere").update({ nume_scurt: val || null }).eq("id", site.id).then(function (res) {
        if (res.error) { flashSyncError("Nu am putut salva numele din bară."); console.error(res.error); render(); }
      });
    }
    state.sidebarNameEdit = { siteId: null, draft: "" };
    render();
  }
  function cancelSidebarNameEdit() {
    state.sidebarNameEdit = { siteId: null, draft: "" };
    render();
  }

  function removeSite(id) {
    var site = findSite(id);
    if (!site) return;
    if (!confirmDelete('Ștergi șantierul "' + site.nume + '"? Această acțiune nu poate fi anulată.')) return;
    sites = sites.filter(function (s) { return s.id !== id; });
    if (state.selectedSiteId === id) { state.view = "sites"; state.selectedSiteId = null; }
    render();
    sb.from("santiere").delete().eq("id", id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut șterge șantierul."); console.error(res.error); }
    });
  }

  function saveDocValoare(siteId, tip) {
    var key = docDraftKey(siteId, tip);
    var val = (state.siteForm.docDrafts[key] || "").trim();
    var existing = findProjectDoc(siteId, tip);
    if (existing) existing.valoare = val;
    else { existing = { id: "tmp-" + Date.now(), santierId: siteId, tip: tip, valoare: val, fisierPath: "", fisierNume: "", fisierMarime: null }; projectDocs.push(existing); }
    delete state.siteForm.docDrafts[key];
    sb.from("santier_documente").upsert({ santier_id: siteId, tip: tip, valoare: val }, { onConflict: "santier_id,tip" })
      .select().single().then(function (res) {
        if (res.error) { flashSyncError("Nu am putut salva valoarea."); console.error(res.error); render(); return; }
        if (String(existing.id).indexOf("tmp-") === 0) existing.id = res.data.id;
        render();
      });
  }

  function uploadDocFile(site, tip, file) {
    var key = docDraftKey(site.id, tip);
    var existing = findProjectDoc(site.id, tip);
    var oldPath = existing ? existing.fisierPath : "";
    state.siteForm.docUploading[key] = true;
    render();
    var path = site.id + "/" + tip + "/" + Date.now() + "-" + sanitizeFilename(file.name);
    sb.storage.from(DOC_BUCKET).upload(path, file).then(function (upRes) {
      if (upRes.error) {
        state.siteForm.docUploading[key] = false;
        flashSyncError("Nu am putut încărca fișierul — încearcă din nou.");
        console.error(upRes.error);
        render();
        return;
      }
      sb.from("santier_documente")
        .upsert({ santier_id: site.id, tip: tip, fisier_path: path, fisier_nume: file.name, fisier_marime: file.size }, { onConflict: "santier_id,tip" })
        .select().single().then(function (res) {
          state.siteForm.docUploading[key] = false;
          if (res.error) {
            flashSyncError("Fișierul s-a încărcat dar nu am putut salva referința — încearcă din nou.");
            console.error(res.error);
            render();
            return;
          }
          if (existing) { existing.fisierPath = path; existing.fisierNume = file.name; existing.fisierMarime = file.size; }
          else { existing = { id: res.data.id, santierId: site.id, tip: tip, valoare: "", fisierPath: path, fisierNume: file.name, fisierMarime: file.size }; projectDocs.push(existing); }
          render();
          if (oldPath) sb.storage.from(DOC_BUCKET).remove([oldPath]); // replaced file — drop the orphaned old one
        });
    });
  }

  function removeDocFile(site, tip) {
    var existing = findProjectDoc(site.id, tip);
    if (!existing || !existing.fisierPath) return;
    if (!confirmDelete('Ștergi fișierul "' + existing.fisierNume + '"? Această acțiune nu poate fi anulată.')) return;
    var oldPath = existing.fisierPath;
    existing.fisierPath = ""; existing.fisierNume = ""; existing.fisierMarime = null;
    render();
    sb.storage.from(DOC_BUCKET).remove([oldPath]).then(function (res) {

      sb.from("santier_documente").upsert({ santier_id: siteId, tip: tip, eticheta: label }, { onConflict: "santier_id,tip" })

  // Tronsoane: liste simple per categorie (cd/cm/cr acum; camine/spau/

  var TRONSON_CATEGORII = ["cd", "cm", "cr"];

  var TRONSON_FIELDS = [

  function tronsonFromRow(r) {

      cod: r.cod || "", specificatieConducta: r.specificatie_conducta || "",

    tronsoane.push({ id: tempId, santierId: site.id, categorie: categorie, cod: "", specificatieConducta: "", reperStart: "", reperEnd: "", lungime: "", planse: "", profilLongitudinal: "", ordine: ordine });
    render();
    sb.from("santier_tronsoane").insert({ santier_id: site.id, categorie: categorie, ordine: ordine }).select().single().then(function (res) {

        flashSyncError("Nu am putut adăuga tronsonul."); console.error(res.error); render(); return;
      }
      var live = tronsoane.filter(function (t) { return t.id === tempId; })[0];
      if (!live) { sb.from("santier_tronsoane").delete().eq("id", res.data.id).then(function (r2) { if (r2.error) console.error(r2.error); }); return; }
      live.id = res.data.id;

    });
  }
  function removeTronson(id) {

    if (!t) return;

    });
  }
  function persistTronsonField(id, field) {

    if (!t || String(t.id).indexOf("tmp-") === 0) return; // still being created — the insert already carries current values
    var dbField = TRONSON_DB_FIELD[field];
    if (!dbField) return;
    var payload = {}; payload[dbField] = t[field];
    sb.from("santier_tronsoane").update(payload).eq("id", t.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva tronsonul."); console.error(res.error); render(); }
    });
  }

  // Generare .docx real, în browser, dintr-un șablon din /templates —
  // niciun server, niciun pas prin PDF. Fiecare șablon e o copie exactă a
  // documentului Word furnizat, cu textul variabil înlocuit de tag-uri
  // {câmp}; docxtemplater completează acele tag-uri și produce un .docx nou,
  // descărcat direct (vezi comentariul din <head> despre pizzip/docxtemplater).
  var TRONSON_TEMPLATE_URLS = { cd: "/templates/pv-cd.docx", cm: "/templates/pv-cm.docx", cr: "/templates/pv-cr.docx" };
  function generatePvForTronson(site, tronsonId) {
    var t = tronsoane.filter(function (x) { return x.id === tronsonId; })[0];
    if (!t) return;
    var pv = pvDateForSite(site);
    if (!pv) { flashSyncError("Completează mai întâi Date șantier → Date generale ale proiectului → Date pentru procese-verbale."); return; }
    var templateUrl = TRONSON_TEMPLATE_URLS[t.categorie];
    if (!templateUrl) { flashSyncError("Nu există încă șablon pentru această categorie."); return; }
    var DocxCtor = window.docxtemplater || window.Docxtemplater;
    if (typeof PizZip === "undefined" || !DocxCtor) {
      flashSyncError("Generatorul de procese-verbale nu s-a încărcat (verifică conexiunea la internet) — reîncearcă.");
      return;
    }
    fetch(templateUrl).then(function (res) {
      if (!res.ok) throw new Error("nu am putut încărca șablonul (" + res.status + ")");
      return res.arrayBuffer();
    }).then(function (buf) {
      var zip = new PizZip(buf);
      var doc = new DocxCtor(zip, { paragraphLoop: true, linebreaks: true });
      doc.render({
        locatie: pv.locatie, obiectiv: pv.obiectiv,
        autorizatie_nr: pv.autorizatieNr, autorizatie_data: pv.autorizatieData,
        proiect_nr: pv.proiectNr, proiectant_companie: pv.proiectantCompanie, proiectant_reprezentant: pv.proiectantReprezentant,
        diriginte_nume: pv.dirigenteNume, diriginte_autorizatie: pv.dirigenteAutorizatie, diriginte_domenii: pv.dirigenteDomenii,
        rte_nume: pv.rteNume, rte_atestat: pv.rteAtestat, rte_domenii: pv.rteDomenii,
        constructor_reprezentant: pv.constructorReprezentant,
        tronson_cod: t.cod, specificatie_conducta: t.specificatieConducta,
        reper_start: t.reperStart, reper_end: t.reperEnd, lungime: t.lungime,
        planse: t.planse, profil_longitudinal: t.profilLongitudinal
      });
      var blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
      var codSlug = (t.cod || t.categorie).toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "");
      var siteSlug = (site.numeScurt || site.nume || "santier").toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "");
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "PV-" + codSlug + "-" + siteSlug + ".docx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }).catch(function (err) {
      console.error(err);
      flashSyncError("Nu am putut genera procesul verbal.");
    });
  }

  // Deep-clones a row's formuleCelule map ({ colId: { terms: [{rowId,colId,sign}] } })
  // so undo snapshots and reconciliation never share mutable term arrays
  // with the live row.
  function cloneFormuleCelule(formule) {
    var out = {};
    Object.keys(formule || {}).forEach(function (colId) {
      out[colId] = { terms: (formule[colId].terms || []).map(function (t) { return { rowId: t.rowId, colId: t.colId, sign: t.sign }; }) };
    });
    return out;
  }

  // Generic snapshot-based undo: every mutating action snapshots the site's
  // full columns+rows+order BEFORE it runs, so undo never needs a bespoke
  // "inverse" per action — it just reconciles current state back to the
  // last snapshot (insert/update/delete whatever differs) and re-syncs it.
  // Each grid instance ("tabel": "centralizare" | "capitole") gets its own
  // stack, keyed by site+tabel, so undoing in one grid never touches the other.
  function snapshotProgres(site, tabel) {
    return {
      coloane: coloaneForSite(site, tabel).map(function (c) { return { id: c.id, label: c.label, tip: c.tip, formula: c.formula, surse: (c.surse || []).slice(), culoare: c.culoare, latime: c.latime }; }),
      randuri: randuriForSite(site, tabel).map(function (r) { return { id: r.id, grup: r.grup, valori: Object.assign({}, r.valori), culoare: r.culoare, formuleCelule: cloneFormuleCelule(r.formuleCelule) }; }),
      coloaneOrder: (site.progresColoaneOrder && site.progresColoaneOrder[tabel]) ? site.progresColoaneOrder[tabel].slice() : null,
      randuriOrder: (site.progresRanduriOrder && site.progresRanduriOrder[tabel]) ? site.progresRanduriOrder[tabel].slice() : null,
      merges: mergesForTabel(site, tabel).map(function (m) { return { id: m.id, rowIds: m.rowIds.slice(), colIds: m.colIds.slice() }; })
    };
  }
  function pushProgresUndo(site, tabel) {
    var key = site.id + "::" + tabel;
    if (!progresUndoStack[key]) progresUndoStack[key] = [];
    var stack = progresUndoStack[key];
    stack.push(snapshotProgres(site, tabel));
    if (stack.length > PROGRES_UNDO_LIMIT) stack.shift();
  }
  function canUndoProgres(site, tabel) { var key = site.id + "::" + tabel; return !!(progresUndoStack[key] && progresUndoStack[key].length); }
  function reconcileProgresColumns(site, tabel, targetCols) {
    var current = coloaneForSite(site, tabel).slice();
    var targetIds = targetCols.map(function (c) { return c.id; });
    current.forEach(function (c) {
      if (targetIds.indexOf(c.id) !== -1) return;
      progresColoane = progresColoane.filter(function (x) { return x !== c; });
      if (String(c.id).indexOf("tmp-") !== 0) {
        sb.from("santier_progres_coloane").delete().eq("id", c.id).then(function (res) { if (res.error) console.error(res.error); });
      }
    });
    targetCols.forEach(function (tc) {
      var existing = progresColoane.filter(function (c) { return c.id === tc.id; })[0];
      if (!existing) {
        var copy = { id: tc.id, santierId: site.id, label: tc.label, tip: tc.tip, formula: tc.formula, surse: tc.surse.slice(), culoare: tc.culoare, latime: tc.latime, tabel: tabel };
        progresColoane.push(copy);
        sb.from("santier_progres_coloane").insert({ id: copy.id, santier_id: site.id, label: copy.label, tip: copy.tip, formula: copy.formula, surse: copy.surse, culoare: copy.culoare, latime: copy.latime, tabel: tabel }).then(function (res) { if (res.error) console.error(res.error); });
      } else {
        existing.label = tc.label; existing.tip = tc.tip; existing.formula = tc.formula; existing.surse = tc.surse.slice(); existing.culoare = tc.culoare; existing.latime = tc.latime;
        sb.from("santier_progres_coloane").update({ label: existing.label, tip: existing.tip, formula: existing.formula, surse: existing.surse, culoare: existing.culoare, latime: existing.latime }).eq("id", existing.id).then(function (res) { if (res.error) console.error(res.error); });
      }
    });
  }
  function reconcileProgresRows(site, tabel, targetRows) {
    var current = randuriForSite(site, tabel).slice();
    var targetIds = targetRows.map(function (r) { return r.id; });
    current.forEach(function (r) {
      if (targetIds.indexOf(r.id) !== -1) return;
      progresRanduri = progresRanduri.filter(function (x) { return x !== r; });
      if (String(r.id).indexOf("tmp-") !== 0) {
        sb.from("santier_progres_randuri").delete().eq("id", r.id).then(function (res) { if (res.error) console.error(res.error); });
      }
    });
    targetRows.forEach(function (tr) {
      var existing = progresRanduri.filter(function (r) { return r.id === tr.id; })[0];
      if (!existing) {
        var copy = { id: tr.id, santierId: site.id, grup: tr.grup, valori: Object.assign({}, tr.valori), culoare: tr.culoare, formuleCelule: cloneFormuleCelule(tr.formuleCelule), tabel: tabel };
        progresRanduri.push(copy);
        sb.from("santier_progres_randuri").insert({ id: copy.id, santier_id: site.id, grup: copy.grup, valori: copy.valori, culoare: copy.culoare, formule_celule: copy.formuleCelule, tabel: tabel }).then(function (res) { if (res.error) console.error(res.error); });
      } else {
        existing.grup = tr.grup; existing.valori = Object.assign({}, tr.valori); existing.culoare = tr.culoare; existing.formuleCelule = cloneFormuleCelule(tr.formuleCelule);
        sb.from("santier_progres_randuri").update({ grup: existing.grup, valori: existing.valori, culoare: existing.culoare, formule_celule: existing.formuleCelule }).eq("id", existing.id).then(function (res) { if (res.error) console.error(res.error); });
      }
    });
  }
  function undoProgres(site, tabel) {
    var key = site.id + "::" + tabel;
    var stack = progresUndoStack[key];
    if (!stack || !stack.length) return;
    var snap = stack.pop();
    reconcileProgresColumns(site, tabel, snap.coloane);
    reconcileProgresRows(site, tabel, snap.randuri);
    if (!site.progresColoaneOrder) site.progresColoaneOrder = {};
    if (!site.progresRanduriOrder) site.progresRanduriOrder = {};
    if (!site.progresMerges) site.progresMerges = {};
    site.progresColoaneOrder[tabel] = snap.coloaneOrder;
    site.progresRanduriOrder[tabel] = snap.randuriOrder;
    site.progresMerges[tabel] = snap.merges;
    state.siteForm.gridCellEdit = { rowId: null, colId: null, draft: "" };

  // --- Îmbinare celule (merge): un grup de celule ADIACENTE (rânduri și

  // din date; revine automat la normal dacă adiacența se restabilește.

  // grup restrâns) NU e tratată aici, ca să se poată auto-repara mai târziu.

    var list = mergesForTabel(site, tabel);

    if (pruned.length !== list.length) {
      if (!site.progresMerges) site.progresMerges = {};
      site.progresMerges[tabel] = pruned;

    }

  }
  // Rândurile de tip "grup" pot fi restrânse, ascunzând vizual rândurile
  // dintre ele și grupul următor — pur vizual, nu schimbă datele niciunui rând.
  function visibleProgresRows(orderedRows, collapsedGroups) {
    var visible = [];
    var hiding = false;
    orderedRows.forEach(function (row) {
      if (row.grup) { visible.push(row); hiding = !!collapsedGroups[row.id]; return; }

  // Pentru fiecare îmbinare validă (adiacentă chiar acum), calculează celula

  // acoperite (care nu se mai desenează separat, fiind incluse în ancoră).
  function computeMergeCoverage(merges, visibleRows, orderedCols) {
    var rowIndex = {}; visibleRows.forEach(function (r, i) { rowIndex[r.id] = i; });
    var colIndex = {}; orderedCols.forEach(function (c, i) { colIndex[c.id] = i; });
    var anchorSpan = {}, covered = {};
    merges.forEach(function (m) {
      var rIdxs = m.rowIds.map(function (id) { return rowIndex[id]; });
      var cIdxs = m.colIds.map(function (id) { return colIndex[id]; });
      if (rIdxs.indexOf(undefined) !== -1 || cIdxs.indexOf(undefined) !== -1) return; // un rând e ascuns (grup restrâns) chiar acum

      cIdxs.sort(function (a, b) { return a - b; });

      var cContig = cIdxs.every(function (v, i) { return i === 0 || v === cIdxs[i - 1] + 1; });
      if (!rContig || !cContig) return; // nu mai sunt adiacente — nu se desenează îmbinat acum

      anchorSpan[anchorRow.id + "|" + anchorCol.id] = { rowSpan: rIdxs.length, colSpan: cIdxs.length, mergeId: m.id };
      m.rowIds.forEach(function (rid) {

  // Rezolvă rectangolul curent (id-uri de rânduri/coloane) dintre două

    var rIdx = {}; visRows.forEach(function (r, i) { rIdx[r.id] = i; });
    var cIdx = {}; data.orderedCols.forEach(function (c, i) { cIdx[c.id] = i; });
    if (!(rowIdA in rIdx) || !(rowIdB in rIdx) || !(colIdA in cIdx) || !(colIdB in cIdx)) return null;

  function mergeCells(site, tabel, rowIds, colIds) {

  // Default (empty) column layout for each grid instance, keyed by "tabel".

  // A brand-new site/tabel combo (never touched) gets seeded once with its

    var rows = specs.map(function (s) {

    });

  function numOf(valori, id) { var v = valori[id]; var n = typeof v === "number" ? v : parseFloat(v); return isNaN(n) ? 0 : n; }

    }
    if (col.formula === "procent") {
      var num = numOf(valori, col.surse[0]);

    }
    // "rest_lei": surse = [oferta, suplimentatLei, realizatLei, renuntatLei]
    // -> oferta + suplimentat - realizat - renuntat (used for "Rest de realizat")
    if (col.formula === "rest_lei") {
      return numOf(valori, col.surse[0]) + numOf(valori, col.surse[1]) - numOf(valori, col.surse[2]) - numOf(valori, col.surse[3]);
    }
    // "procent_pool": surse = [numeratorLei, oferta, suplimentatLei, renuntatLei]
    // -> numerator / (oferta + suplimentat - renuntat) * 100 — used where the
    // percentage base isn't the raw offer but the offer adjusted for
    // extra/cancelled work (e.g. "Realizat total %", "Rest de realizat %").
    if (col.formula === "procent_pool") {
      var pool = numOf(valori, col.surse[1]) + numOf(valori, col.surse[2]) - numOf(valori, col.surse[3]);

  // Resolves every "calculat" column into `vals` via fixed-point iteration,
  // so calculated columns may reference each other regardless of left-to-right
  // display order (unlike a single forward pass, this doesn't require a
  // dependency to be positioned before its dependent column).
  function resolveCalcColumns(orderedCols, vals) {
    var pending = orderedCols.filter(function (c) { return c.tip === "calculat"; });
    var progress = true;
    while (pending.length && progress) {
      progress = false;
      pending = pending.filter(function (c) {
        var ready = (c.surse || []).every(function (s) { return vals.hasOwnProperty(s); });
        if (!ready) return true;
        vals[c.id] = computeCalcValue(c, vals);
        progress = true;
        return false;
      });
    }
    // any left over have a missing/cyclic dependency — compute defensively
    // (missing sources read as 0) rather than leave the cell blank forever.
    pending.forEach(function (c) { vals[c.id] = computeCalcValue(c, vals); });
  }

    var rounded = Math.round(n * 100) / 100;
    return rounded.toLocaleString("ro-RO", { maximumFractionDigits: 2 });
  }

  // Builds the fully-resolved grid for a site: column/row order applied,
  // every cell independent. "grup" is purely a visual/collapse marker now —
  // every row (group or not) computes the same way: its own raw values,
  // with column-level "calculat" columns (from a template or "Adaugă
  // coloană") resolved first, then any per-cell formulas (row.formuleCelule
  // — an arbitrary, user-picked set of +/- cells from anywhere in the grid)
  // resolved on top, across the whole table. There is no automatic
  // grand-total row anymore: with every cell independently editable, a full
  // automatic column sum could silently double-count a row the user built
  // as their own manual total — so a total is only ever what the user
  // explicitly builds via a cell formula, like any other computed cell.
  function progresGridData(site, tabel) {
    var colsById = {};
    coloaneForSite(site, tabel).forEach(function (c) { colsById[c.id] = c; });
    var orderedCols = orderedColIds(site, tabel).map(function (id) { return colsById[id]; }).filter(Boolean);

    var rowsById = {};
    randuriForSite(site, tabel).forEach(function (r) { rowsById[r.id] = r; });
    var orderedRows = orderedRandIds(site, tabel).map(function (id) { return rowsById[id]; }).filter(Boolean);

    var displayValori = {};
    orderedRows.forEach(function (row) {
      var vals = {};
      orderedCols.forEach(function (col) { if (col.tip !== "calculat") vals[col.id] = row.valori[col.id]; });
      // resolveCalcColumns lets a calculated column reference ANY other
      // calculated column regardless of display order (e.g. a "%" column
      // placed before the "total" column it divides by).
      resolveCalcColumns(orderedCols, vals);
      displayValori[row.id] = vals;
    });
    resolveCellFormulas(orderedRows, displayValori);

    return { orderedCols: orderedCols, orderedRows: orderedRows, displayValori: displayValori };
  }

  // A cell formula (row.formuleCelule[colId] = { terms: [{rowId,colId,sign}] })
  // adds/subtracts an arbitrary, user-picked set of OTHER cells — any row,

  // always scoped to fixed columns. Same fixed-point approach so formula

    var pending = [];

      return terms.reduce(function (acc, t) {
        var rowVals = displayValori[t.rowId];
        var v = rowVals ? rowVals[t.colId] : undefined;

    while (pending.length && progress) {
      progress = false;
      pending = pending.filter(function (f) {
        var ready = f.terms.every(function (t) { return displayValori[t.rowId] && displayValori[t.rowId].hasOwnProperty(t.colId); });
        if (!ready) return true;
        displayValori[f.rowId][f.colId] = sumTerms(f.terms);
        progress = true;
        return false;
      });
    }
    // leftover = missing/cyclic reference — compute defensively (a missing
    // source reads as 0) rather than leave the cell blank forever.
    pending.forEach(function (f) { displayValori[f.rowId][f.colId] = sumTerms(f.terms); });
  }

  function rowDisplayLabel(site, row) {
    var labelCol = coloaneForSite(site, row.tabel).filter(function (c) { return c.tip === "text"; })[0];

  function reorderColumns(site, draggedId, targetId, before) {

  function addRow(site, tabel, kind) {

  function duplicateRow(site, rowId) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    if (!row) return;
    var tabel = row.tabel;
    pushProgresUndo(site, tabel);
    var tempId = "tmp-" + Date.now();
    // a duplicated cell formula still points at the ORIGINAL cells it was
    // built from, not at the new row — copying the row copies its values,
    // not a re-target of every formula, matching how a spreadsheet paste
    // of a single cell (not a range) keeps its references literal here.
    var copy = { id: tempId, santierId: site.id, grup: row.grup, valori: Object.assign({}, row.valori), culoare: row.culoare, formuleCelule: cloneFormuleCelule(row.formuleCelule), tabel: tabel };
    progresRanduri.push(copy);
    var current = orderedRandIds(site, tabel);
    var atIdx = current.indexOf(rowId);
    current.splice(atIdx === -1 ? current.length : atIdx + 1, 0, tempId);
    if (!site.progresRanduriOrder) site.progresRanduriOrder = {};
    site.progresRanduriOrder[tabel] = current;
    render();
    sb.from("santier_progres_randuri").insert({ santier_id: site.id, grup: copy.grup, valori: copy.valori, culoare: copy.culoare, formule_celule: copy.formuleCelule, tabel: tabel }).select().single().then(function (res) {
      if (res.error) {
        progresRanduri = progresRanduri.filter(function (r) { return r.id !== tempId; });
        flashSyncError("Nu am putut duplica rândul."); console.error(res.error); render(); return;
      }
      if (progresRanduri.indexOf(copy) === -1) {
        // undone before the insert resolved — clean up the orphaned server row
        sb.from("santier_progres_randuri").delete().eq("id", res.data.id).then(function (r2) { if (r2.error) console.error(r2.error); });
        return;
      }
      copy.id = res.data.id;
      var order = orderedRandIds(site, tabel).map(function (id) { return id === tempId ? res.data.id : id; });
      site.progresRanduriOrder[tabel] = order;
      render();
      sb.from("santiere").update({ progres_randuri_order: site.progresRanduriOrder }).eq("id", site.id).then(function (r2) {
        if (r2.error) console.error(r2.error);
      });
    });
  }
  function reorderRows(site, draggedId, targetId, before) {
    if (draggedId === targetId) return;
    var draggedRow = progresRanduri.filter(function (r) { return r.id === draggedId; })[0];
    if (!draggedRow) return;
    var tabel = draggedRow.tabel;

    if (fromIdx === -1) return;
    current.splice(fromIdx, 1);
    var toIdx = current.indexOf(targetId);
    if (toIdx === -1) return;
    if (!before) toIdx += 1;
    current.splice(toIdx, 0, draggedId);
    pushProgresUndo(site, tabel);
    if (!site.progresRanduriOrder) site.progresRanduriOrder = {};
    site.progresRanduriOrder[tabel] = current;
