<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ing. Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:oklch(97% 0.006 75); --surface:oklch(100% 0 0); --surface-2:oklch(94.5% 0.012 75);
    --border:oklch(84% 0.018 75); --border-strong:oklch(68% 0.03 65);
    --ink:oklch(18% 0.01 60); --ink-soft:oklch(40% 0.015 60); --ink-faint:oklch(58% 0.012 60);
    --navy:oklch(21% 0.01 60); --navy-hover:oklch(14% 0.01 60); --navy-soft:oklch(92% 0.02 60);
    --amber:oklch(68% 0.19 45); --amber-soft:oklch(93% 0.06 50); --amber-strong:oklch(58% 0.2 40);
    --green:oklch(58% 0.15 145); --green-soft:oklch(92% 0.05 145);
    --red:oklch(55% 0.2 25); --red-soft:oklch(93% 0.05 25);
    --gray-soft:oklch(94% 0.006 75);
    --blue-soft:oklch(92% 0.05 250); --purple-soft:oklch(92% 0.05 310);
    --sans:'IBM Plex Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); }
  a { color: var(--navy); } a:hover { color: var(--navy-hover); }
  button { font-family: inherit; }
  .app { display: flex; width: 100%; min-height: 100vh; }

  /* sidebar */
  .sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .app.sidebar-hidden .sidebar { display: none; }
  .sidebar-collapse-btn { position: absolute; top: 18px; right: -12px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink-soft); box-shadow: 0 1px 4px rgba(20,20,30,.14); z-index: 5; }
  .sidebar-expand-btn { position: fixed; top: 18px; left: 14px; width: 28px; height: 28px; border-radius: 7px;
    background: var(--surface); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink-soft); box-shadow: 0 2px 8px rgba(20,20,30,.1); z-index: 50; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--navy); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; }
  .brand-name { font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }
  .nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px;
    font-size: 13.5px; font-weight: 500; color: var(--ink-soft); cursor: pointer; }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item svg { flex-shrink: 0; color: var(--ink-faint); }
  .nav-item.active { background: var(--navy-soft); color: var(--navy); }
  .nav-item.active svg { color: var(--navy); }
  .sites { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
  .site-row { display: flex; align-items: center; gap: 9px; padding: 8px 10px 8px 34px; border-radius: 7px;
    font-size: 12.5px; color: var(--ink-soft); cursor: pointer; }
  .site-row:hover { background: var(--surface-2); }
  .site-row.active { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .dot-activ { background: var(--green); }
  .dot-final { background: var(--ink-faint); }
  .site-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site-label-input { width: 100%; min-width: 0; border: 1px solid var(--navy); border-radius: 3px; padding: 2px 6px;
    font-size: 12.5px; font-family: var(--sans); background: var(--surface); color: var(--ink); }
  .spacer { flex: 1 1 auto; }
  .user-box { margin: 10px; padding: 10px; border-radius: 9px; background: var(--surface-2);
    display: flex; align-items: center; gap: 9px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; font-family: var(--mono); flex-shrink: 0; }
  .user-name { font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .user-role { font-size: 11px; color: var(--ink-faint); }

  /* main */
  .main { flex: 1 1 auto; padding: 26px 32px 40px; min-width: 0; }
  .main-inner { max-width: 1220px; }
  .main-inner.wide { max-width: none; }
  .crumb { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
  .crumb b { color: var(--ink-soft); font-weight: 600; }
  .crumb-link { cursor: pointer; text-decoration: underline; text-decoration-color: transparent; }
  .crumb-link:hover { text-decoration-color: var(--ink-faint); }
  .h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .h1-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 3px; font-family: var(--sans);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 10px 16px; border: none; }
  .btn-primary { background: var(--navy); color: white; }
  .btn-ghost { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .btn-sm { padding: 6px 11px; font-size: 11.5px; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }

  /* dashboard */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1.5px solid var(--border); border-radius: 4px; padding: 15px 18px; }
  .stat-val { font-family: var(--mono); font-size: 24px; font-weight: 600; }
  .stat-label { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden;
    display: flex; flex-direction: column; cursor: pointer; position: relative;
    transition: border-color .12s ease, box-shadow .12s ease; }
  .card-del { position: absolute; top: 10px; right: 10px; z-index: 2; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); cursor: pointer; }
  .card-del:hover { color: var(--red); background: #fff; }
  .dash-seeall { display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--navy);
    cursor: pointer; margin-top: 14px; width: fit-content; }
  .dash-seeall:hover { color: var(--navy-hover); }
  .card:hover { border-color: var(--amber-strong); box-shadow: none; }
  .thumb { height: 108px; position: relative; background-image:
      linear-gradient(oklch(94% 0.01 258 / 0.9), oklch(94% 0.01 258 / 0.9)),
      linear-gradient(rgba(30,50,90,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(30,50,90,.09) 1px, transparent 1px);
    background-size: 100% 100%, 16px 16px, 16px 16px; display: flex; align-items: center; justify-content: center; }
  .thumb svg { color: var(--navy); opacity: 0.55; }
  .card-body { padding: 15px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-title { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
  .card-addr { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft); }
  .card-addr svg { flex-shrink: 0; color: var(--ink-faint); }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px;
    border-radius: 100px; width: fit-content; }
  .badge-activ { background: var(--green-soft); color: oklch(38% 0.1 150); }
  .badge-final { background: var(--surface-2); color: var(--ink-soft); }
  .prog-row { display: flex; align-items: center; gap: 9px; }
  .prog-track { flex: 1; height: 6px; border-radius: 100px; background: var(--surface-2); overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 100px; background: var(--navy); }
  .prog-pct { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink-soft); width: 32px; text-align: right; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border);
    padding-top: 10px; margin-top: 2px; }
  .card-date { font-size: 11px; color: var(--ink-faint); }
  .card-open { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--navy); }
  .card-new { border: 1.5px dashed var(--border-strong); background: transparent; align-items: center;
    justify-content: center; flex-direction: column; gap: 8px; min-height: 240px; color: var(--ink-faint); cursor: pointer; }
  .card-new:hover { border-color: var(--border-strong); box-shadow: none; }
  .card-new-label { font-size: 13px; font-weight: 600; }

  /* detail header + tabs */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 20px;
    border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .h1row { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .head-sub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .head-meta { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
  .ring-val { position: relative; font-family: var(--mono); font-size: 11px; font-weight: 700; }
  .tabs { display: flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--ink-soft); border-bottom: 2px solid transparent;
    display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--navy); border-bottom-color: var(--navy); }
  .subtabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .subtab { padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--ink-faint); border-bottom: 2px solid transparent;
    cursor: pointer; }
  .subtab:hover { color: var(--ink-soft); }
  .subtab.active { color: var(--navy); border-bottom-color: var(--navy); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 22px; }

  /* pontaj */
  .pontaj-panel { padding: 0; }
  .pontaj-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px 0; flex-wrap: wrap; }
  .period { display: flex; align-items: center; gap: 10px; }
  .period-nav { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border-strong); display: flex;
    align-items: center; justify-content: center; color: var(--ink-soft); background: var(--surface); }
  .period-label { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .tbl-wrap { overflow-x: auto; margin-top: 16px; }
  table { border-collapse: collapse; font-size: 12px; min-width: 100%; }
  th, td { padding: 0; text-align: center; }
  th.name-h, td.name { position: sticky; left: 0; background: var(--surface); z-index: 2; box-shadow: 1px 0 0 var(--border); }
  th { font-weight: 600; padding: 8px 4px 6px; border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); background: var(--surface-2); }
  th.name-h { text-align: left; padding-left: 14px; background: var(--surface-2); }
  .daynum { font-family: var(--mono); font-size: 12.5px; }
  .daydow { font-size: 9.5px; color: var(--ink-faint); font-weight: 500; margin-top: 1px; }
  th.weekend { background: oklch(94% 0.006 250); }
  td.name { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--border); min-width: 168px; }
  td.name b { display: block; font-size: 12.5px; font-weight: 600; }
  td.name span { display: block; font-size: 10.5px; color: var(--ink-faint); margin-top: 1px; }
  td.day { border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); width: 42px; padding: 4px 2px; }
  .cell { position: relative; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px;
    font-family: var(--mono); font-weight: 600; font-size: 12px; margin: 0 2px; }
  .cw { color: var(--ink); }
  .coff { color: var(--ink-faint); font-weight: 500; }
  .cleave { background: var(--navy-soft); color: var(--navy); }
  .csick { background: var(--red-soft); color: var(--red); }
  .cempty { color: var(--border-strong); font-weight: 400; }
  .covertime { background: var(--amber-soft); color: oklch(45% 0.14 50); box-shadow: inset 0 0 0 1.5px var(--amber-strong); }
  .edited-ring { box-shadow: inset 0 0 0 1.5px var(--amber-strong); }
  .pencil-badge { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--amber-strong); color: white; display: flex; align-items: center; justify-content: center; }
  td.total { border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); font-family: var(--mono);
    font-weight: 700; font-size: 12.5px; background: var(--surface-2); width: 56px; }
  .foot-note { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 20px; margin-top: 4px;
    border-top: 1px solid var(--border); background: var(--surface-2); }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); }
  .legend .sw { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
  .edit-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); margin-left: auto; }
  .edit-note svg { color: var(--amber-strong); flex-shrink: 0; }

  /* proces-verbal */
  .cols { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
  .panel-title { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
  .panel-sub { font-size: 12px; color: var(--ink-faint); margin-bottom: 14px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; display: flex;
    align-items: center; justify-content: space-between; }
  .mic { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--navy); }
  textarea { width: 100%; min-height: 150px; border: 1px solid var(--border-strong); border-radius: 3px; padding: 12px;
    font-family: var(--sans); font-size: 13px; color: var(--ink); resize: none; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .chip { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 100px; border: 1px solid var(--border-strong);
    color: var(--ink-soft); background: var(--surface-2); }
  .btn-block { width: 100%; justify-content: center; }
  .helper { font-size: 11.5px; color: var(--ink-faint); margin-top: 9px; line-height: 1.4; }
  .doc-panel { padding: 0; overflow: hidden; }
  .doc-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; gap: 8px; }
  .ai-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: oklch(45% 0.14 50);
    background: var(--amber-soft); padding: 4px 10px; border-radius: 100px; }
  .doc-actions { display: flex; gap: 8px; }
  .doc-page { padding: 34px 40px; }
  .doc-letterhead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
  .doc-logo { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 700; color: var(--ink-faint); }
  .doc-logo-mark { width: 26px; height: 26px; border-radius: 6px; border: 1.5px dashed var(--border-strong); }
  .doc-nr { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); text-align: right; }
  .doc-title { text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 18px; }
  .doc-meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }
  .doc-body { font-size: 13px; line-height: 1.7; color: var(--ink); margin-bottom: 18px; }
  .doc-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
  .doc-table th, .doc-table td { border: 1px solid var(--border-strong); padding: 6px 9px; text-align: left; }
  .doc-table th { background: var(--surface-2); font-weight: 600; font-size: 11px; }
  .doc-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
  .doc-sign-line { border-top: 1px solid var(--ink-faint); padding-top: 6px; font-size: 11.5px; color: var(--ink-soft); }

  /* progres */
  .summary { display: flex; align-items: center; gap: 28px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 26px; margin-bottom: 16px; }
  .summary-meta { display: flex; gap: 36px; flex-wrap: wrap; }
  .meta-item .mv { font-family: var(--mono); font-size: 19px; font-weight: 700; }
  .meta-item .ml { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .badge-done { background: var(--green-soft); color: oklch(38% 0.1 150); }
  .badge-progress { background: var(--amber-soft); color: oklch(45% 0.14 50); }
  .badge-notstarted { background: var(--surface-2); color: var(--ink-faint); }

  /* progres: grid liber (coloane + rânduri configurabile) */
  .progrid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow-x: auto; max-width: 100%; }
  table.progrid { border-collapse: collapse; width: 100%; font-size: 12.5px; table-layout: fixed; }
  .progrid th, .progrid td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progrid th:last-child, .progrid td:last-child { border-right: none; }
  .progrid thead th { background: var(--surface-2); font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--ink-faint); padding: 0; text-align: left; position: relative; }
  .progrid-th-inner { display: flex; align-items: center; gap: 5px; padding: 8px 10px; overflow: hidden; }
  .progrid-resize-handle { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 4; }
  /* Frozen (position:sticky) columns were removed — combined with native
     HTML5 drag-and-drop on the row/column headers, sticky table cells are
     a known freeze trigger in Chromium, and it kept reproducing even after
     mitigating the drag-image and dragover-layout costs. The class names
     stay (still used for background/border styling) but no longer stick. */
  .progrid .progrid-sticky-2 { border-right: 1.5px solid var(--border-strong); }
  .progrid td.progrid-sticky-1, .progrid td.progrid-sticky-2 { background: var(--surface); }
  .progrid th.progrid-sticky-1, .progrid th.progrid-sticky-2 { background: var(--surface-2); }
  .progrid tbody tr.progrow-group td.progrid-sticky-1, .progrid tbody tr.progrow-group td.progrid-sticky-2 { background: var(--surface-2); }
  .progrid-collapse-btn { cursor: pointer; color: var(--ink-soft); display: inline-flex; align-items: center;
    justify-content: center; width: 12px; font-size: 11px; font-weight: 700; vertical-align: middle; margin-right: 2px; }
  .progrid td.progrid-cell-editable:focus { outline: 2px solid var(--navy); outline-offset: -2px; }
  .progrid-col-grip { cursor: grab; color: var(--ink-faint); flex-shrink: 0; display: flex; }
  .progrid-col-label { cursor: pointer; border-radius: 3px; padding: 2px 4px; margin: -2px -4px; flex: 1; }
  .progrid-col-label:hover { background: var(--border); }
  .progrid-col-input { font-size: 10.5px; font-weight: 600; font-family: var(--sans); text-transform: none; letter-spacing: normal;
    border: 1px solid var(--navy); border-radius: 3px; padding: 3px 5px; min-width: 100px; field-sizing: content; }
  .progrid-col-tag { color: var(--ink-faint); font-weight: 700; }
  .progrid-col-del { cursor: pointer; color: var(--ink-faint); flex-shrink: 0; display: flex; }
  .progrid-col-del:hover { color: oklch(55% 0.18 25); }
  .progrid th[draggable="true"] { cursor: default; }
  .progrid th.dragging { opacity: .4; }
  .progrid th.drag-over-left { box-shadow: inset 2px 0 0 var(--navy); }
  .progrid th.drag-over-right { box-shadow: inset -2px 0 0 var(--navy); }
  .progrid tbody tr[draggable="true"] { cursor: default; }

    ["autorizatie", "Autorizație"],
    ["certificat_urbanism", "Certificat de Urbanism"],
    ["ordin_incepere", "Ordin de începere"]
  ];
  var projectDocs = [];

    return { id: d.id, santierId: d.santier_id, tip: d.tip, eticheta: d.eticheta || "", valoare: d.valoare || "", fisierPath: d.fisier_path || "", fisierNume: d.fisier_nume || "", fisierMarime: d.fisier_marime || null };
  }

    for (var i = 0; i < projectDocs.length; i++) if (projectDocs[i].santierId === santierId && projectDocs[i].tip === tip) return projectDocs[i];
    return null;

  // fixed types and per-site custom rows (doc-/aviz-) alike. Each panel only
  // ever drags within its own tips, so reordering one scope can never disturb
  // another's relative order, even though they all live in the same array.
  function isFixedTip(tip) { return PROJECT_DOCS.some(function (d) { return d[0] === tip; }); }
  function docTipLabel(tip, fallback) {
    return (company.docTipLabels && company.docTipLabels[tip]) || fallback;
  }
  function mainListTips(site) {
    var fixed = PROJECT_DOCS.map(function (d) { return d[0]; });
    var custom = projectDocs.filter(function (d) { return d.santierId === site.id && d.tip.indexOf("doc-") === 0; }).map(function (d) { return d.tip; });
    return fixed.concat(custom);
  }
  function avizeTips(site) {
    return projectDocs.filter(function (d) { return d.santierId === site.id && d.tip.indexOf("aviz-") === 0; }).map(function (d) { return d.tip; });
  }
  function orderedTipsFor(candidateTips, orderArray) {
    if (!orderArray || !orderArray.length) return candidateTips.slice();
    var set = {};
    candidateTips.forEach(function (t) { set[t] = true; });
    var ordered = orderArray.filter(function (t) { return set[t]; });
    var seen = {};
    ordered.forEach(function (t) { seen[t] = true; });
    candidateTips.forEach(function (t) { if (!seen[t]) ordered.push(t); });

    if (scopeTips.indexOf(draggedTip) === -1 || scopeTips.indexOf(targetTip) === -1) return; // no cross-scope drops

    scopeTips.forEach(function (t) { if (fullOrder.indexOf(t) === -1) fullOrder.push(t); });

    if (fromIdx === -1) return;

    var toIdx = fullOrder.indexOf(targetTip);
    if (toIdx === -1) return;
    if (!before) toIdx += 1;
    fullOrder.splice(toIdx, 0, draggedTip);

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function dateKey(y, m, d) { return y + "-" + pad2(m) + "-" + pad2(d); }
  function isWeekend(y, m, d) { var dow = new Date(y, m - 1, d).getDay(); return dow === 0 || dow === 6; }
  function dowShort(y, m, d) { return ["D","L","Ma","Mi","J","V","S"][new Date(y, m - 1, d).getDay()]; }
  function weekendLabel(y, m, d) { return new Date(y, m - 1, d).getDay() === 6 ? "Sambata" : "Duminica"; }

  function periodRange(mode, y, m) {
    var last = daysInMonth(y, m);
    if (mode === "avans") return { start: 1, end: 15 };
    if (mode === "lichidare") return { start: 16, end: last };
    return { start: 1, end: last };
  }

  function cellStatus(workerId, y, m, d) {
    if (isWeekend(y, m, d)) return "weekend";
    return entries[workerId + "|" + dateKey(y, m, d)] || "empty"; // "empty" = nothing recorded yet — never assume worked
  }
  function setStatus(workerId, dk, status) {
    var key = workerId + "|" + dk;
    if (status === "empty") delete entries[key]; else entries[key] = status;
    delete failedCells[key]; // this is a fresh attempt — clear any earlier failure mark
    if (String(workerId).indexOf("tmp-") === 0) return; // worker not yet persisted, nothing to sync
    var req = status === "empty"
      ? sb.from("pontaj_intrari").delete().match({ muncitor_id: workerId, data: dk })
      : sb.from("pontaj_intrari").upsert({ muncitor_id: workerId, data: dk, status: status }, { onConflict: "muncitor_id,data" });
    req.then(function (res) {
      if (res.error) {
        failedCells[key] = status;
        flashSyncError("Nu s-a putut salva o zi — va rămâne marcată până se reîncearcă.");
        console.error(res.error);
        render();
      }
    });
  }
  function setStatusBulk(cellKeys, status) {
    cellKeys.forEach(function (key) {
      var sep = key.indexOf("|");
      var workerId = key.slice(0, sep), dk = key.slice(sep + 1);
      setStatus(workerId, dk, status);
    });
  }
  function retryFailedCells() {
    Object.keys(failedCells).forEach(function (key) {
      var status = failedCells[key];
      var sep = key.indexOf("|");
      setStatus(key.slice(0, sep), key.slice(sep + 1), status);
    });
  }

  // --- Progres șantier: grid liber (coloane + rânduri configurabile per șantier) ---
  var progresColoane = [];
  var progresRanduri = [];
  var progresSeededSites = {};
  var progresUndoStack = {};
  var PROGRES_UNDO_LIMIT = 20;

  // Deep-clones a row's formuleCelule map ({ colId: { terms: [{rowId,colId,sign}] } })
  // so undo snapshots and reconciliation never share mutable term arrays
  // with the live row.
  function cloneFormuleCelule(formule) {
    var out = {};
    Object.keys(formule || {}).forEach(function (colId) {
      out[colId] = { terms: (formule[colId].terms || []).map(function (t) { return { rowId: t.rowId, colId: t.colId, sign: t.sign }; }) };
    });
    return out;
  }

  // Generic snapshot-based undo: every mutating action snapshots the site's
  // full columns+rows+order BEFORE it runs, so undo never needs a bespoke
  // "inverse" per action — it just reconciles current state back to the
  // last snapshot (insert/update/delete whatever differs) and re-syncs it.
  // Each grid instance ("tabel": "centralizare" | "capitole") gets its own
  // stack, keyed by site+tabel, so undoing in one grid never touches the other.
  function snapshotProgres(site, tabel) {
    return {
      coloane: coloaneForSite(site, tabel).map(function (c) { return { id: c.id, label: c.label, tip: c.tip, formula: c.formula, surse: (c.surse || []).slice(), culoare: c.culoare, latime: c.latime }; }),
      randuri: randuriForSite(site, tabel).map(function (r) { return { id: r.id, grup: r.grup, valori: Object.assign({}, r.valori), culoare: r.culoare, formuleCelule: cloneFormuleCelule(r.formuleCelule) }; }),
      coloaneOrder: (site.progresColoaneOrder && site.progresColoaneOrder[tabel]) ? site.progresColoaneOrder[tabel].slice() : null,
      randuriOrder: (site.progresRanduriOrder && site.progresRanduriOrder[tabel]) ? site.progresRanduriOrder[tabel].slice() : null
    };
  }
  function pushProgresUndo(site, tabel) {
    var key = site.id + "::" + tabel;
    if (!progresUndoStack[key]) progresUndoStack[key] = [];
    var stack = progresUndoStack[key];
    stack.push(snapshotProgres(site, tabel));
    if (stack.length > PROGRES_UNDO_LIMIT) stack.shift();
  }
  function canUndoProgres(site, tabel) { var key = site.id + "::" + tabel; return !!(progresUndoStack[key] && progresUndoStack[key].length); }
  function reconcileProgresColumns(site, tabel, targetCols) {
    var current = coloaneForSite(site, tabel).slice();
    var targetIds = targetCols.map(function (c) { return c.id; });
    current.forEach(function (c) {
      if (targetIds.indexOf(c.id) !== -1) return;
      progresColoane = progresColoane.filter(function (x) { return x !== c; });
      if (String(c.id).indexOf("tmp-") !== 0) {

  function numOf(valori, id) { var v = valori[id]; var n = typeof v === "number" ? v : parseFloat(v); return isNaN(n) ? 0 : n; }

    if (col.formula === "suma") {
      return (col.surse || []).reduce(function (sum, srcId) { return sum + numOf(valori, srcId); }, 0);
    }
    if (col.formula === "procent") {
      var num = numOf(valori, col.surse[0]);
      var den = numOf(valori, col.surse[1]);
      return den ? (num / den * 100) : 0;
    }
    // "rest_lei": surse = [oferta, suplimentatLei, realizatLei, renuntatLei]
    // -> oferta + suplimentat - realizat - renuntat (used for "Rest de realizat")
    if (col.formula === "rest_lei") {
      return numOf(valori, col.surse[0]) + numOf(valori, col.surse[1]) - numOf(valori, col.surse[2]) - numOf(valori, col.surse[3]);
    }
    // "procent_pool": surse = [numeratorLei, oferta, suplimentatLei, renuntatLei]
    // -> numerator / (oferta + suplimentat - renuntat) * 100 — used where the
    // percentage base isn't the raw offer but the offer adjusted for
    // extra/cancelled work (e.g. "Realizat total %", "Rest de realizat %").
    if (col.formula === "procent_pool") {
      var pool = numOf(valori, col.surse[1]) + numOf(valori, col.surse[2]) - numOf(valori, col.surse[3]);
      return pool ? (numOf(valori, col.surse[0]) / pool * 100) : 0;
    }
    return 0;
  }
  // Resolves every "calculat" column into `vals` via fixed-point iteration,
  // so calculated columns may reference each other regardless of left-to-right
  // display order (unlike a single forward pass, this doesn't require a
  // dependency to be positioned before its dependent column).
  function resolveCalcColumns(orderedCols, vals) {
    var pending = orderedCols.filter(function (c) { return c.tip === "calculat"; });
    var progress = true;
    while (pending.length && progress) {
      progress = false;
      pending = pending.filter(function (c) {
        var ready = (c.surse || []).every(function (s) { return vals.hasOwnProperty(s); });
        if (!ready) return true;
        vals[c.id] = computeCalcValue(c, vals);
        progress = true;
        return false;
      });
    }
    // any left over have a missing/cyclic dependency — compute defensively
    // (missing sources read as 0) rather than leave the cell blank forever.
    pending.forEach(function (c) { vals[c.id] = computeCalcValue(c, vals); });

    return rounded.toLocaleString("ro-RO", { maximumFractionDigits: 2 });
  }

  // Builds the fully-resolved grid for a site: column/row order applied,
  // every cell independent. "grup" is purely a visual/collapse marker now —
  // every row (group or not) computes the same way: its own raw values,
  // with column-level "calculat" columns (from a template or "Adaugă
  // coloană") resolved first, then any per-cell formulas (row.formuleCelule
  // — an arbitrary, user-picked set of +/- cells from anywhere in the grid)
  // resolved on top, across the whole table. There is no automatic
  // grand-total row anymore: with every cell independently editable, a full
  // automatic column sum could silently double-count a row the user built
  // as their own manual total — so a total is only ever what the user
  // explicitly builds via a cell formula, like any other computed cell.
  function progresGridData(site, tabel) {
    var colsById = {};
    coloaneForSite(site, tabel).forEach(function (c) { colsById[c.id] = c; });
    var orderedCols = orderedColIds(site, tabel).map(function (id) { return colsById[id]; }).filter(Boolean);

    var rowsById = {};
    randuriForSite(site, tabel).forEach(function (r) { rowsById[r.id] = r; });
    var orderedRows = orderedRandIds(site, tabel).map(function (id) { return rowsById[id]; }).filter(Boolean);

    var displayValori = {};
    orderedRows.forEach(function (row) {
      var vals = {};
      orderedCols.forEach(function (col) { if (col.tip !== "calculat") vals[col.id] = row.valori[col.id]; });
      // resolveCalcColumns lets a calculated column reference ANY other
      // calculated column regardless of display order (e.g. a "%" column
      // placed before the "total" column it divides by).
      resolveCalcColumns(orderedCols, vals);
      displayValori[row.id] = vals;
    });
    resolveCellFormulas(orderedRows, displayValori);

    return { orderedCols: orderedCols, orderedRows: orderedRows, displayValori: displayValori };
  }

  // A cell formula (row.formuleCelule[colId] = { terms: [{rowId,colId,sign}] })
  // adds/subtracts an arbitrary, user-picked set of OTHER cells — any row,
  // any column — unlike the column-level "calculat" formulas above, which are
  // always scoped to fixed columns. Same fixed-point approach so formula
  // cells may reference other formula cells regardless of order.
  function resolveCellFormulas(orderedRows, displayValori) {
    var pending = [];
    orderedRows.forEach(function (row) {
      var formule = row.formuleCelule || {};
      Object.keys(formule).forEach(function (colId) {
        pending.push({ rowId: row.id, colId: colId, terms: formule[colId].terms || [] });
      });
    });
    function sumTerms(terms) {
      return terms.reduce(function (acc, t) {
        var rowVals = displayValori[t.rowId];
        var v = rowVals ? rowVals[t.colId] : undefined;
        var n = typeof v === "number" ? v : parseFloat(v);
        return acc + (isNaN(n) ? 0 : n) * (t.sign || 1);
      }, 0);
    }
    var progress = true;
    while (pending.length && progress) {
      progress = false;
      pending = pending.filter(function (f) {
        var ready = f.terms.every(function (t) { return displayValori[t.rowId] && displayValori[t.rowId].hasOwnProperty(t.colId); });
        if (!ready) return true;
        displayValori[f.rowId][f.colId] = sumTerms(f.terms);
        progress = true;
        return false;
      });
    }
    // leftover = missing/cyclic reference — compute defensively (a missing
    // source reads as 0) rather than leave the cell blank forever.
    pending.forEach(function (f) { displayValori[f.rowId][f.colId] = sumTerms(f.terms); });
  }

  function rowDisplayLabel(site, row) {
    var labelCol = coloaneForSite(site, row.tabel).filter(function (c) { return c.tip === "text"; })[0];

  }

  // --- Coloane: adăugare / ștergere / redenumire / reordonare ---
  function addColumn(site, tabel, spec) {

      if (res.error) {
        progresColoane = progresColoane.filter(function (c) { return c.id !== tempId; });
        flashSyncError("Nu am putut adăuga coloana."); console.error(res.error); render(); return;
      }
      if (progresColoane.indexOf(col) === -1) {
        // undone before the insert resolved — clean up the orphaned server row
        sb.from("santier_progres_coloane").delete().eq("id", res.data.id).then(function (r2) { if (r2.error) console.error(r2.error); });
        return;

    if (!confirmDelete("Ștergi " + label + "? Se pierd toate valorile completate pe această coloană.")) return;
    pushProgresUndo(site, col.tabel);
    progresColoane = progresColoane.filter(function (c) { return c !== col; });
    render();
    if (String(col.id).indexOf("tmp-") === 0) return;
    sb.from("santier_progres_coloane").delete().eq("id", col.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut șterge coloana."); console.error(res.error); }

  function startColLabelEdit(colId, currentLabel) { state.siteForm.gridColLabelEdit = { colId: colId, draft: currentLabel }; }
  function commitColLabelEdit() {
    var edit = state.siteForm.gridColLabelEdit;

    });

  function reorderColumns(site, draggedId, targetId, before) {
    if (draggedId === targetId) return;
    var draggedCol = progresColoane.filter(function (c) { return c.id === draggedId; })[0];
    if (!draggedCol) return;
    var tabel = draggedCol.tabel;
    var current = orderedColIds(site, tabel);
    var fromIdx = current.indexOf(draggedId);
    if (fromIdx === -1) return;
    current.splice(fromIdx, 1);
    var toIdx = current.indexOf(targetId);
    if (toIdx === -1) return;
    if (!before) toIdx += 1;
    current.splice(toIdx, 0, draggedId);
    pushProgresUndo(site, tabel);
    if (!site.progresColoaneOrder) site.progresColoaneOrder = {};
    site.progresColoaneOrder[tabel] = current;
    render();
    sb.from("santiere").update({ progres_coloane_order: site.progresColoaneOrder }).eq("id", site.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva ordinea coloanelor."); console.error(res.error); }
    });
  }
  function resizeColumn(site, colId, widthPx) {
    var col = progresColoane.filter(function (c) { return c.id === colId; })[0];
    if (!col) return;
    pushProgresUndo(site, col.tabel);
    col.latime = Math.max(50, Math.round(widthPx));
    render();
    sb.from("santier_progres_coloane").update({ latime: col.latime }).eq("id", col.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva lățimea coloanei."); console.error(res.error); }
    });

  // --- Rânduri: adăugare / ștergere / reordonare ---
  // kind: null/undefined = rând normal, "grup" = antet de capitol (doar
  // vizual — bold, se poate restrânge/extinde — nu adună nimic automat).
  // Fiecare celulă e independentă: dacă vrei un total, îl construiești
  // printr-o formulă pe acea celulă (vezi startFormulaBuilder), alegând
  // manual orice celule din orice rând/coloană vrei să aduni sau să scazi.
  function addRow(site, tabel, kind) {
    pushProgresUndo(site, tabel);
    var tempId = "tmp-" + Date.now();
    var isGrup = kind === "grup";
    progresRanduri.push({ id: tempId, santierId: site.id, grup: isGrup, valori: {}, culoare: null, formuleCelule: {}, tabel: tabel });
    render();
    sb.from("santier_progres_randuri").insert({ santier_id: site.id, grup: isGrup, valori: {}, tabel: tabel }).select().single().then(function (res) {
      if (res.error) {
        progresRanduri = progresRanduri.filter(function (r) { return r.id !== tempId; });
        flashSyncError("Nu am putut adăuga rândul."); console.error(res.error); render(); return;
      }
      var row = progresRanduri.filter(function (r) { return r.id === tempId; })[0];
      if (!row) {
        // undone before the insert resolved — clean up the orphaned server row
        sb.from("santier_progres_randuri").delete().eq("id", res.data.id).then(function (r2) { if (r2.error) console.error(r2.error); });
        return;
      }
      row.id = res.data.id;
      render();
    });
  }
  function removeRow(site, rowId) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    if (!row) return;
    var text = rowDisplayLabel(site, row);
    var label = text ? ('rândul "' + text + '"') : (row.grup ? "acest grup" : "acest rând");
    if (!confirmDelete("Ștergi " + label + "? Această acțiune nu poate fi anulată.")) return;
    pushProgresUndo(site, row.tabel);
    progresRanduri = progresRanduri.filter(function (r) { return r !== row; });
    render();
    if (String(row.id).indexOf("tmp-") === 0) return;
    sb.from("santier_progres_randuri").delete().eq("id", row.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut șterge rândul."); console.error(res.error); }
    });
  }
  function duplicateRow(site, rowId) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    if (!row) return;
    var tabel = row.tabel;
    pushProgresUndo(site, tabel);
    var tempId = "tmp-" + Date.now();
    // a duplicated cell formula still points at the ORIGINAL cells it was
    // built from, not at the new row — copying the row copies its values,
    // not a re-target of every formula, matching how a spreadsheet paste
    // of a single cell (not a range) keeps its references literal here.
    var copy = { id: tempId, santierId: site.id, grup: row.grup, valori: Object.assign({}, row.valori), culoare: row.culoare, formuleCelule: cloneFormuleCelule(row.formuleCelule), tabel: tabel };
    progresRanduri.push(copy);
    var current = orderedRandIds(site, tabel);
    var atIdx = current.indexOf(rowId);
    current.splice(atIdx === -1 ? current.length : atIdx + 1, 0, tempId);
    if (!site.progresRanduriOrder) site.progresRanduriOrder = {};
    site.progresRanduriOrder[tabel] = current;
    render();
    sb.from("santier_progres_randuri").insert({ santier_id: site.id, grup: copy.grup, valori: copy.valori, culoare: copy.culoare, formule_celule: copy.formuleCelule, tabel: tabel }).select().single().then(function (res) {
      if (res.error) {
        progresRanduri = progresRanduri.filter(function (r) { return r.id !== tempId; });
        flashSyncError("Nu am putut duplica rândul."); console.error(res.error); render(); return;
      }
      if (progresRanduri.indexOf(copy) === -1) {
        // undone before the insert resolved — clean up the orphaned server row
        sb.from("santier_progres_randuri").delete().eq("id", res.data.id).then(function (r2) { if (r2.error) console.error(r2.error); });
        return;
      }
      copy.id = res.data.id;
      var order = orderedRandIds(site, tabel).map(function (id) { return id === tempId ? res.data.id : id; });
      site.progresRanduriOrder[tabel] = order;
      render();
      sb.from("santiere").update({ progres_randuri_order: site.progresRanduriOrder }).eq("id", site.id).then(function (r2) {
        if (r2.error) console.error(r2.error);
      });
    });
  }
  function reorderRows(site, draggedId, targetId, before) {
    if (draggedId === targetId) return;
    var draggedRow = progresRanduri.filter(function (r) { return r.id === draggedId; })[0];
    if (!draggedRow) return;
    var tabel = draggedRow.tabel;
    var current = orderedRandIds(site, tabel);
    var fromIdx = current.indexOf(draggedId);
    if (fromIdx === -1) return;
    current.splice(fromIdx, 1);
    var toIdx = current.indexOf(targetId);
    if (toIdx === -1) return;
    if (!before) toIdx += 1;
    current.splice(toIdx, 0, draggedId);
    pushProgresUndo(site, tabel);
    if (!site.progresRanduriOrder) site.progresRanduriOrder = {};
    site.progresRanduriOrder[tabel] = current;
    render();
    sb.from("santiere").update({ progres_randuri_order: site.progresRanduriOrder }).eq("id", site.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva ordinea rândurilor."); console.error(res.error); }
    });
  }

  // --- Culori: coloană / rând (paletă fixă, cheie salvată, nu cod de culoare brut) ---
  function setColumnColor(site, colId, color) {
    var col = progresColoane.filter(function (c) { return c.id === colId; })[0];
    if (!col) return;
    pushProgresUndo(site, col.tabel);

    state.siteForm.colorPickerOpen = { type: null, id: null };
    render();

      if (res.error) { flashSyncError("Nu am putut salva culoarea coloanei."); console.error(res.error); render(); }
    });
  }
  function setRowColor(site, rowId, color) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    if (!row) return;

      if (res.error) { flashSyncError("Nu am putut salva culoarea rândului."); console.error(res.error); render(); }
    });

  // --- Celule: editare in-place — fiecare celulă e independentă. Ce se tastează
  // decide tipul: dacă arată ca un număr, se salvează ca număr; altfel rămâne
  // text — indiferent de coloană, indiferent de rând. ---
  function parseCellInput(text) {
    var trimmed = (text || "").trim();
    if (trimmed === "") return "";
    var normalized = trimmed.replace(",", ".");
    return /^-?\d+(\.\d+)?$/.test(normalized) ? parseFloat(normalized) : trimmed;
  }
  function startCellEdit(rowId, colId, currentValue) {
    state.siteForm.gridCellEdit = { rowId: rowId, colId: colId, draft: currentValue === undefined || currentValue === null ? "" : String(currentValue) };
  }
  function commitCellEdit() {
    var edit = state.siteForm.gridCellEdit;
    if (!edit.rowId) return;
    var row = progresRanduri.filter(function (r) { return r.id === edit.rowId; })[0];
    var col = progresColoane.filter(function (c) { return c.id === edit.colId; })[0];
    state.siteForm.gridCellEdit = { rowId: null, colId: null, draft: "" };
    if (!row || !col) { render(); return; }
    var cellSite = findSite(state.selectedSiteId);
    if (cellSite) pushProgresUndo(cellSite, row.tabel);
    row.valori = Object.assign({}, row.valori);
    row.valori[col.id] = parseCellInput(edit.draft);
    render();
    sb.from("santier_progres_randuri").update({ valori: row.valori }).eq("id", row.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva valoarea."); console.error(res.error); render(); }
    });
  }
  function cancelCellEdit() { state.siteForm.gridCellEdit = { rowId: null, colId: null, draft: "" }; render(); }

  // --- Lipire dintr-un tabel Excel: pornind de la celula selectată, valorile
  // separate prin tab/linie nouă din clipboard se scriu în celulele
  // corespunzătoare (text sau număr, după cum arată fiecare valoare) —
  // coloanele calculate și celulele cu formulă proprie sunt sărite, fără să
  // strice alinierea restului lipirii. ---
  function pasteIntoGrid(site, anchorRowId, anchorColId, text) {
    var anchorRowLive = progresRanduri.filter(function (r) { return r.id === anchorRowId; })[0];
    if (!anchorRowLive) return;
    var tabel = anchorRowLive.tabel;
    var data = progresGridData(site, tabel);
    var orderedCols = data.orderedCols, orderedRows = data.orderedRows;
    var rowIdx = orderedRows.findIndex(function (r) { return r.id === anchorRowId; });
    var colIdx = orderedCols.findIndex(function (c) { return c.id === anchorColId; });
    if (rowIdx === -1 || colIdx === -1) return;
    pushProgresUndo(site, tabel);
    var lines = text.replace(/\r/g, "").split("\n");
    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
    var rowsById = {};
    randuriForSite(site, tabel).forEach(function (r) { rowsById[r.id] = r; });
    var touched = [];
    lines.forEach(function (line, i) {
      var targetRow = orderedRows[rowIdx + i];
      if (!targetRow) return;
      var liveRow = rowsById[targetRow.id];
      if (!liveRow) return;
      var cells = line.split("\t");
      var changed = false;
      cells.forEach(function (cellText, j) {
        var col = orderedCols[colIdx + j];
        if (!col || col.tip === "calculat") return;
        if (liveRow.formuleCelule && liveRow.formuleCelule[col.id]) return; // a formula cell keeps its formula — paste doesn't silently overwrite it
        liveRow.valori[col.id] = parseCellInput(cellText);
        changed = true;
      });
      if (changed && touched.indexOf(liveRow) === -1) touched.push(liveRow);
    });
    if (!touched.length) return;
    render();
    touched.forEach(function (row) {
      sb.from("santier_progres_randuri").update({ valori: row.valori }).eq("id", row.id).then(function (res) {
        if (res.error) { flashSyncError("Nu am putut salva datele lipite."); console.error(res.error); render(); }
      });
    });
  }

  // --- Formula pe celulă: alegi manual orice celule din orice rând/coloană
  // ca să le aduni sau să le scazi într-o celulă țintă — independent de
  // structura rândului/coloanei (spre deosebire de coloanele "calculat",
  // care sunt fixate pe aceleași coloane pentru tot tabelul). ---
  function startFormulaBuilder(tabel, rowId, colId) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    var existing = row && row.formuleCelule && row.formuleCelule[colId];
    state.siteForm.formulaBuilder = { tabel: tabel, rowId: rowId, colId: colId, terms: existing ? existing.terms.map(function (t) { return { rowId: t.rowId, colId: t.colId, sign: t.sign }; }) : [] };
  }
  function cancelFormulaBuilder() { state.siteForm.formulaBuilder = null; }
  // First click on a cell adds it (+), a second click flips it to (-), a
  // third click removes it — no drag-select needed, and it works across
  // any rows/columns since each click just names one specific cell.
  function toggleFormulaTerm(rowId, colId) {
    var fb = state.siteForm.formulaBuilder;
    if (!fb) return;
    if (rowId === fb.rowId && colId === fb.colId) return; // can't reference itself
    var idx = fb.terms.findIndex(function (t) { return t.rowId === rowId && t.colId === colId; });
    if (idx === -1) fb.terms.push({ rowId: rowId, colId: colId, sign: 1 });
    else if (fb.terms[idx].sign === 1) fb.terms[idx].sign = -1;
    else fb.terms.splice(idx, 1);
  }
  function saveFormulaBuilder(site) {
    var fb = state.siteForm.formulaBuilder;
    if (!fb) return;
    var row = progresRanduri.filter(function (r) { return r.id === fb.rowId; })[0];
    state.siteForm.formulaBuilder = null;
    if (!row) { render(); return; }
    pushProgresUndo(site, fb.tabel);
    row.formuleCelule = Object.assign({}, row.formuleCelule);
    if (fb.terms.length) row.formuleCelule[fb.colId] = { terms: fb.terms };
    else delete row.formuleCelule[fb.colId]; // no terms picked — back to a plain, manually-editable cell
    render();
    sb.from("santier_progres_randuri").update({ formule_celule: row.formuleCelule }).eq("id", row.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva formula."); console.error(res.error); render(); }
    });
  }
  function clearCellFormula(site, rowId, colId) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    if (!row || !row.formuleCelule || !row.formuleCelule[colId]) return;
    pushProgresUndo(site, row.tabel);
    row.formuleCelule = Object.assign({}, row.formuleCelule);
    delete row.formuleCelule[colId];
    render();
    sb.from("santier_progres_randuri").update({ formule_celule: row.formuleCelule }).eq("id", row.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut șterge formula."); console.error(res.error); render(); }
    });
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function findSite(id) { for (var i = 0; i < sites.length; i++) if (sites[i].id === id) return sites[i]; return null; }
  // Resolves which grid instance ("centralizare" vs "capitole") a click
  // inside the Progres Șantier panel belongs to, via the wrapping
  // [data-progres-tabel] container each progresPanelHTML() render emits.
  function progresTabelFromEl(el) {
    var wrap = el.closest("[data-progres-tabel]");
    return wrap ? wrap.dataset.progresTabel : "centralizare";
  }

  function docRowHTML(site, tip, label, scope, opts) {

    var draftVal = state.siteForm.docDrafts[key];

    var placeholderLabel = scope === "avize" ? "Tip aviz (dublu-click)" : "Denumire document (dublu-click)";
    var displayLabel = label || placeholderLabel;
    var labelEmptyCls = label ? "" : " docrow-label-empty";

    var labelHtml = isEditingLabel
      ? '<input class="docrow-label-input" id="label-edit-' + tip + '" draggable="false" data-label-edit-input="1" value="' + esc(label || "") + '">'

      '<button class="btn btn-ghost btn-sm" data-save-doc-valoare="' + site.id + '|' + tip + '">Salvează</button>' +

  function pontajGridHTML() {
    var y = state.pontaj.year, m = state.pontaj.month, mode = state.pontaj.periodMode;
    var range = periodRange(mode, y, m);
    var dayNums = [];
    for (var d = range.start; d <= range.end; d++) dayNums.push(d);

    var headCells = dayNums.map(function (dd) {
      return '<th class="' + (isWeekend(y, m, dd) ? "weekend" : "") + '"><div class="daynum">' + dd + '</div><div class="daydow">' + dowShort(y, m, dd) + '</div></th>';
    }).join("");

    var STATUS_LABEL = { empty: "—", normal: "8", co: "CO", cm: "CM", liber: "L" };
    var STATUS_CLS = { empty: "cempty", normal: "cw", co: "cleave", cm: "csick", liber: "coff" };

    var rows = workers.map(function (w) {
      var total = 0;
      var cells = dayNums.map(function (dd) {
        var status = cellStatus(w.id, y, m, dd);
        if (status === "normal") total += 8;
        if (status === "weekend") {
          return '<td class="day"><div class="cell coff">' + (new Date(y, m - 1, dd).getDay() === 6 ? "S" : "D") + '</div></td>';
        }
        var dk = dateKey(y, m, dd);
        var cellKey = w.id + "|" + dk;
        var isOpen = state.pontaj.openCell === cellKey;
        var isPicked = state.pontaj.selectedCells.indexOf(cellKey) !== -1;
        var isFailed = !!failedCells[cellKey];
        var pop = "";
        if (isOpen) {
          pop = '<div class="daypop">' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|normal">Normal (8h)</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|co">CO</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|cm">CM</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|liber">Liber</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|empty">Șterge (necompletat)</div>' +
          '</div>';
        }
        var cellCls = "day daycell" + (state.pontaj.selectMode ? " selectable" : "") + (isPicked ? " cell-picked" : "") + (isFailed ? " cell-failed" : "");
        var failedMark = isFailed ? '<span class="cell-failed-dot" title="Nu s-a salvat — apasă din nou">!</span>' : "";
        return '<td class="' + cellCls + '" data-cell-toggle="' + cellKey + '"><div class="cell ' + STATUS_CLS[status] + '">' + STATUS_LABEL[status] + failedMark + '</div>' + pop + '</td>';
      }).join("");
      return '<tr><td class="name"><b>' + esc(w.name) + '</b><span>' + esc(w.functie || "—") + '<span class="rm-worker" data-remove-worker="' + w.id + '">×</span></span></td>' + cells + '<td class="total">' + total + '</td></tr>';
    }).join("");

    return '' +
      '<div class="tbl-wrap"><table><thead><tr><th class="name-h">Muncitor</th>' + headCells + '<th style="width:56px">Total</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  function buildPrintSheetHTML(y, m, mode) {
    var range = periodRange(mode, y, m);
    var dayNums = [];
    for (var d = range.start; d <= range.end; d++) dayNums.push(d);
    var headCells = dayNums.map(function (dd) { return "<th>" + dd + "</th>"; }).join("");

    var rowsHtml = workers.map(function (w, idx) {
      var labels = ["ora de intare", "pauza", "ora de iesire", "ore lucrate"];
      return labels.map(function (label, li) {
        var cells = dayNums.map(function (dd) {
          var status = cellStatus(w.id, y, m, dd);
          var val;
          if (status === "weekend") val = weekendLabel(y, m, dd);
          else if (status === "co") val = "CO";
          else if (status === "cm") val = "CM";
          else if (status === "liber") val = "L";
          else if (status === "normal") val = ["08:00", "12:00-13:00", "17:00", "8"][li];
          else val = ""; // "empty" — never printed as if the person worked
          return '<td class="' + (status === "weekend" ? "ps-weekend" : "") + '">' + esc(val) + "</td>";
        }).join("");
        var programLucru = (w.salariu ? esc(String(w.salariu)) + "<br>" : "") + esc(w.metodaPlata || "CARD");
        var firstCols = li === 0
          ? '<td rowspan="4">' + (idx + 1) + '</td><td class="ps-nume" rowspan="4">' + esc(w.name) + '</td><td rowspan="4">' + programLucru + '</td><td class="ps-label">' + label + "</td>"
          : '<td class="ps-label">' + label + "</td>";
        return "<tr>" + firstCols + cells + "</tr>";
      }).join("");
    }).join("");

    return '' +
      '<div class="ps-header">' +
        '<div class="ps-company">' + esc(company.name) + '</div>' +
        '<div class="ps-cif">Cod fiscal: ' + esc(company.cif) + '</div>' +
        '<div class="ps-title">FOAIE COLECTIVA DE PREZENTA - EVIDENTA NUMARULUI DE ORE LUCRATE</div>' +
        '<div class="ps-period"><span>Luna ' + MONTHS_RO[m - 1] + '</span><span>Anul ' + y + '</span></div>' +
      '</div>' +
      '<table class="ps-table"><thead>' +
        '<tr><th rowspan="2">Nr. Crt</th><th rowspan="2">Nume si prenume</th><th rowspan="2">Program de lucru</th><th rowspan="2"></th><th colspan="' + dayNums.length + '">DATA</th></tr>' +
        "<tr>" + headCells + "</tr>" +
      "</thead><tbody>" + rowsHtml + "</tbody></table>";
  }

    window.print();

    var tipOptions = '<option value="text"' + (f.tip === "text" ? " selected" : "") + '>Text</option>' +
      '<option value="numar"' + (f.tip === "numar" ? " selected" : "") + '>Număr</option>' +
      '<option value="calculat_procent"' + (f.tip === "calculat_procent" ? " selected" : "") + '>Calculat — procent (A / B × 100)</option>' +
      '<option value="calculat_suma"' + (f.tip === "calculat_suma" ? " selected" : "") + '>Calculat — sumă</option>';

    var extra = "";
    if (f.tip === "calculat_procent") {
      var numOpts = numericCols.map(function (c) { return '<option value="' + c.id + '"' + (f.numarator === c.id ? " selected" : "") + '>' + esc(c.label) + '</option>'; }).join("");
      var denOpts = numericCols.map(function (c) { return '<option value="' + c.id + '"' + (f.numitor === c.id ? " selected" : "") + '>' + esc(c.label) + '</option>'; }).join("");
      extra = '<div class="addcol-row"><label>Numărător</label><select id="addcol-numarator"><option value="">— alege —</option>' + numOpts + '</select></div>' +
        '<div class="addcol-row"><label>Numitor</label><select id="addcol-numitor"><option value="">— alege —</option>' + denOpts + '</select></div>';
    } else if (f.tip === "calculat_suma") {
      var checks = numericCols.map(function (c) {
        var checked = f.surseSuma[c.id] ? " checked" : "";
        return '<label class="addcol-check"><input type="checkbox" data-addcol-suma-check="' + c.id + '"' + checked + '> ' + esc(c.label) + '</label>';
      }).join("");
      extra = '<div class="addcol-row"><label>Coloane de adunat</label><div class="addcol-checks">' +
        (checks || '<span style="color:var(--ink-faint);font-size:12px">Nu există coloane numerice.</span>') + '</div></div>';
    }

    return '<div class="addcol-form">' +
      '<div class="addcol-row"><label>Denumire coloană</label><input id="addcol-label-input" data-addcol-label-input="1" value="' + esc(f.label) + '" placeholder="ex. Termen limită"></div>' +
      '<div class="addcol-row"><label>Tip</label><select id="addcol-tip-select">' + tipOptions + '</select></div>' +
      extra +
      '<div class="addcol-actions">' +
        '<button class="btn btn-primary btn-sm" data-submit-addcol="' + site.id + '">Adaugă</button>' +
        '<button class="btn btn-ghost btn-sm" data-cancel-addcol="1">Anulează</button>' +
      '</div>' +
    '</div>';
  }

  function collapseToggleHTML(row) {
    var collapsed = !!state.siteForm.collapsedGroups[row.id];
    return '<span class="progrid-collapse-btn" draggable="false" data-toggle-collapse-group="' + row.id + '" title="' + (collapsed ? "Extinde grupul" : "Restrânge grupul") + '">' + (collapsed ? "▸" : "▾") + '</span>';
  }
  function colorSwatchHTML(kind, id, colorKey) {
    var bg = colorKey ? progresColorCss(colorKey) : "transparent";
    var cls = "progrid-color-btn" + (colorKey ? " has-color" : "");
    return '<span class="' + cls + '" style="background:' + bg + '" draggable="false" data-toggle-color="' + kind + '|' + id + '" title="Culoare"></span>';
  }
  function colorPopoverHTML(kind, id) {
    var dots = PROGRES_COLORS.map(function (c) {
      return '<span class="colorpop-dot" style="background:' + c.css + '" data-pick-color="' + kind + '|' + id + '|' + c.key + '" title="' + esc(c.key) + '"></span>';
    }).join("");
    return '<div class="colorpop">' +
      '<span class="colorpop-clear" data-pick-color="' + kind + '|' + id + '|none" title="Fără culoare">✕</span>' +
      dots +
    '</div>';
  }

  function progresLabelColId(orderedCols) {
    for (var i = 0; i < orderedCols.length; i++) if (orderedCols[i].tip === "text") return orderedCols[i].id;
    return null;
  }
  // Cell content is independent of the column type now — a "numar" column
  // can hold typed text, a "text" column can hold a number. Display follows
  // what's actually stored (its runtime type), except "calculat" columns
  // and formula cells, which are always numbers.
  function progresCellDisplayForExport(col, v) {
    if (col.tip === "calculat") {
      var out = formatGridNumber(typeof v === "number" ? v : (parseFloat(v) || 0));
      return isPercentFormula(col.formula) ? out + "%" : out;
    }
    if (typeof v === "number") return formatGridNumber(v);
    return v || "";
  }
  function csvEscape(v) {
    var s = String(v === undefined || v === null ? "" : v);
    if (/[";\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function exportProgresCSV(site, tabel) {
    var data = progresGridData(site, tabel);
    var orderedCols = data.orderedCols, orderedRows = data.orderedRows, displayValori = data.displayValori;
    var lines = [orderedCols.map(function (c) { return csvEscape(c.label); }).join(";")];
    orderedRows.forEach(function (row) {
      var vals = displayValori[row.id] || {};
      lines.push(orderedCols.map(function (col) { return csvEscape(progresCellDisplayForExport(col, vals[col.id])); }).join(";"));
    });
    var csv = "﻿" + lines.join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    var slug = (site.numeScurt || site.nume || "santier").toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "");
    a.download = "progres-" + slug + (tabel === "capitole" ? "-capitole" : "") + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function printProgres(site, tabel) {
    var data = progresGridData(site, tabel);
    var orderedCols = data.orderedCols, orderedRows = data.orderedRows, displayValori = data.displayValori;
    var headHtml = orderedCols.map(function (c) { return "<th>" + esc(c.label) + "</th>"; }).join("");
    var rowsHtml = orderedRows.map(function (row) {
      var vals = displayValori[row.id] || {};
      var cells = orderedCols.map(function (col) {
        var v = vals[col.id];
        var isNum = col.tip === "calculat" || typeof v === "number";
        return "<td" + (isNum ? ' style="text-align:right;font-family:monospace"' : "") + ">" + esc(progresCellDisplayForExport(col, v)) + "</td>";
      }).join("");
      var rowStyle = row.grup ? ' style="font-weight:700;background:#f0ede7"' : "";
      return "<tr" + rowStyle + ">" + cells + "</tr>";
    }).join("");
    var html = '<div style="font-family:sans-serif;padding:10px">' +
      "<h2 style=\"margin:0 0 4px\">" + esc(site.nume) + "</h2>" +
      '<div style="font-size:12px;color:#555;margin-bottom:14px">Progres șantier — generat ' + new Date().toLocaleDateString("ro-RO") + "</div>" +
      '<table style="width:100%;border-collapse:collapse;font-size:11px" border="1" cellpadding="5">' +
        "<thead><tr>" + headHtml + "</tr></thead><tbody>" + rowsHtml + "</tbody>" +
      "</table></div>";
    var sheet = document.getElementById("print-sheet");
    if (sheet) sheet.innerHTML = html;
    window.print();
  }

  function progresPanelHTML(site, tabel) {
    var data = progresGridData(site, tabel);
    var orderedCols = data.orderedCols, orderedRows = data.orderedRows, displayValori = data.displayValori;
    var labelColId = progresLabelColId(orderedCols);

    var colGroupHtml = '<colgroup><col style="width:56px">' +
      orderedCols.map(function (c) { return '<col data-col-id="' + c.id + '" style="width:' + colWidth(c) + 'px">'; }).join("") +
      '<col style="width:50px"></colgroup>';

    var headCells = orderedCols.map(function (col, idx) {
      var isEditing = state.siteForm.gridColLabelEdit.colId === col.id;
      var labelHtml = isEditing
        ? '<input class="progrid-col-input" id="progcol-edit-' + col.id + '" draggable="false" data-progcol-label-input="1" value="' + esc(col.label) + '">'
        : '<span class="progrid-col-label" draggable="false" data-edit-col-label="' + col.id + '" title="Dublu-click pentru a redenumi">' + esc(col.label || "(fără nume)") + '</span>';
      var typeTag = "";
      if (col.tip === "calculat") {
        var tagSymbol = isPercentFormula(col.formula) ? "%" : "Σ";
        if (col.label.indexOf(tagSymbol) === -1) typeTag = " " + tagSymbol;
      }
      var thStyle = col.culoare ? ' style="background:' + progresColorCss(col.culoare) + '"' : "";
      var stickyCls = idx === 0 ? " progrid-sticky-2" : "";
      return '<th class="' + stickyCls.trim() + '" draggable="true" data-progcol-drag-id="' + col.id + '"' + thStyle + '><div class="progrid-th-inner">' +
        '<span class="progrid-col-grip" title="Trage pentru a reordona">' + icon("grip", 13) + '</span>' +
        colorSwatchHTML("col", col.id, col.culoare) +
        labelHtml + (typeTag ? '<span class="progrid-col-tag">' + esc(typeTag) + '</span>' : "") +
        '<span class="progrid-col-del" data-remove-col="' + site.id + '|' + col.id + '" title="Șterge coloana">' + icon("trash", 12) + '</span>' +
        '<span class="progrid-resize-handle" draggable="false" data-resize-col="' + col.id + '"></span>' +
      '</div></th>';
    }).join("");

    // Collapsing a group only hides rows visually between it and the next
    // group (position-based), independent of which rows actually feed its
    // total (which is now an explicit, user-picked selection).
    var visibleRows = [];
    var hiding = false;
    orderedRows.forEach(function (row) {
      if (row.grup) { visibleRows.push(row); hiding = !!state.siteForm.collapsedGroups[row.id]; return; }
      if (!hiding) visibleRows.push(row);
    });

    var fb = state.siteForm.formulaBuilder;
    var fbActive = fb && fb.tabel === tabel;

    var bodyRows = visibleRows.map(function (row) {
      var vals = displayValori[row.id] || {};
      var rowBg = row.culoare ? progresColorCss(row.culoare) : null;
      var cellsHtml = orderedCols.map(function (col, idx) {
        var isCalc = col.tip === "calculat";
        var cellFormula = !isCalc ? (row.formuleCelule && row.formuleCelule[col.id]) : null;
        var manualEditable = !isCalc && !cellFormula;
        var isEditingCell = manualEditable && state.siteForm.gridCellEdit.rowId === row.id && state.siteForm.gridCellEdit.colId === col.id;
        var raw = vals[col.id];
        // Cell content is independent of the column now — display follows
        // what's actually stored (its runtime type), not the column's tip.
        var isNumeric = isCalc || !!cellFormula || typeof raw === "number";
        var display = isNumeric
          ? (formatGridNumber(typeof raw === "number" ? raw : (parseFloat(raw) || 0)) + (isCalc && isPercentFormula(col.formula) ? "%" : ""))
          : esc(raw || "");
        var stickyCls = idx === 0 ? " progrid-sticky-2" : "";
        var cls = "progrid-cell" + (isNumeric ? " progrid-num" : "") + ((isCalc || cellFormula) ? " progrid-cell-computed" : "") + (manualEditable ? " progrid-cell-editable" : "") + stickyCls;
        if (fbActive) {
          if (fb.rowId === row.id && fb.colId === col.id) cls += " progrid-term-target";
          else {
            var term = fb.terms.filter(function (t) { return t.rowId === row.id && t.colId === col.id; })[0];
            if (term) cls += term.sign === 1 ? " progrid-term-pos" : " progrid-term-neg";
          }
        }
        var cellBg = rowBg || (col.culoare ? progresColorCss(col.culoare) : null);
        var bgStyle = cellBg ? ' style="background:' + cellBg + '"' : "";

        if (isEditingCell) {
          return '<td class="' + cls + '"' + bgStyle + '><input class="progrid-cell-input" id="progcell-edit-' + row.id + '-' + col.id + '" draggable="false" data-progcell-input="1" value="' + esc(raw === undefined || raw === null ? "" : String(raw)) + '"></td>';
        }
        var title = fbActive ? "Click pentru a adăuga/schimba semn/scoate din formulă" : (manualEditable ? "Click = selectează (pentru lipire), dublu-click = editează" : "Valoare calculată");
        var attrs = ' draggable="false" tabindex="0" data-edit-cell="' + row.id + '|' + col.id + '" title="' + title + '"';
        var labelPrefix = (row.grup && col.id === labelColId && !isEditingCell) ? collapseToggleHTML(row) : "";
        var formulaBadge = (!isCalc && !fbActive)
          ? '<span class="progrid-formula-btn' + (cellFormula ? " has-formula" : "") + '" data-toggle-cell-formula="' + row.id + '|' + col.id + '" title="' + (cellFormula ? "Editează formula acestei celule" : "Fă din asta o formulă (adună/scade alte celule)") + '">ƒ</span>'
          : "";
        return '<td class="' + cls + '"' + attrs + bgStyle + '>' + labelPrefix + display + formulaBadge + '</td>';
      }).join("");

      var rowCls = row.grup ? "progrow-group" : "";
      var gripStyle = rowBg ? ' style="background:' + rowBg + '"' : "";
      var delStyle = rowBg ? ' style="background:' + rowBg + '"' : "";
      var dupBtn = '<span class="progrid-rowsrc-btn" data-duplicate-row="' + site.id + '|' + row.id + '" title="Duplică rândul">' + icon("copy", 12) + '</span>';
      return '<tr class="' + rowCls + '" draggable="true" data-progrow-drag-id="' + row.id + '">' +
        '<td class="progrid-grip progrid-sticky-1"' + gripStyle + '>' +
          '<span style="display:flex;align-items:center;gap:3px;justify-content:center;flex-wrap:wrap">' + icon("grip", 13) + colorSwatchHTML("row", row.id, row.culoare) + '</span>' +
        '</td>' +
        cellsHtml +
        '<td class="progrid-del-cell"' + delStyle + '><span style="display:flex;align-items:center;gap:5px;justify-content:center">' + dupBtn + '<span class="progrid-del" data-remove-row="' + site.id + '|' + row.id + '" title="Șterge rândul">' + icon("trash", 13) + '</span></span></td>' +
      '</tr>';
    }).join("");

    var colspan = orderedCols.length + 2;
    var emptyRow = orderedRows.length === 0 ? '<tr><td colspan="' + colspan + '" class="doclist-empty progrid-empty-cell">Niciun rând adăugat încă.</td></tr>' : "";

    var itemRowCount = orderedRows.filter(function (r) { return !r.grup; }).length;
    var summaryHtml = orderedRows.length ? ('<div class="summary"><div class="summary-meta">' +
      '<div class="meta-item"><div class="mv">' + itemRowCount + '</div><div class="ml">Linii</div></div>' +
      '</div></div>') : "";

    var addColFormHtml = (state.siteForm.addColForm.open && state.siteForm.addColForm.tabel === tabel) ? addColFormHTML(site, orderedCols) : "";
    var colorPopHtml = state.siteForm.colorPickerOpen.id ? colorPopoverHTML(state.siteForm.colorPickerOpen.type, state.siteForm.colorPickerOpen.id) : "";
    var formulaBarHtml = fbActive ? formulaBuilderBarHTML(fb) : "";

    return '<div data-progres-tabel="' + tabel + '">' + summaryHtml +
      '<div class="progrid-wrap"><table class="progrid">' + colGroupHtml + '<thead><tr><th class="progrid-sticky-1"></th>' + headCells + '<th></th></tr></thead>' +
      '<tbody>' + bodyRows + emptyRow + '</tbody></table></div>' +
      '<div class="progrid-toolbar">' +
        '<button class="btn btn-ghost btn-sm" data-undo-progres="' + site.id + '"' + (canUndoProgres(site, tabel) ? "" : ' disabled') + ' title="Anulează ultima acțiune">' + icon("undo", 13) + 'Anulează</button>' +
        '<button class="btn btn-ghost btn-sm" data-add-row="' + site.id + '">' + icon("plus", 13) + 'Adaugă linie</button>' +
        '<button class="btn btn-ghost btn-sm" data-add-group-row="' + site.id + '">' + icon("plus", 13) + 'Adaugă grup</button>' +
        '<button class="btn btn-ghost btn-sm" data-toggle-addcol="' + site.id + '">' + icon("plus", 13) + 'Adaugă coloană</button>' +
        '<button class="btn btn-ghost btn-sm" data-export-progres-csv="' + site.id + '">' + icon("doc", 13) + 'Exportă CSV</button>' +
        '<button class="btn btn-ghost btn-sm" data-print-progres="' + site.id + '">' + icon("printer", 13) + 'Printează</button>' +
      '</div>' +
      '<div class="helper">Click pe o celulă o selectează (poți lipi din Excel cu Ctrl+V) · dublu-click o editează · ƒ pe o celulă = adună/scade alte celule alese de tine · trage mânerul ca să reordonezi · Ctrl+Z anulează ultima acțiune.</div>' +
      addColFormHtml + colorPopHtml +
      '</div>' + formulaBarHtml;
  }

  // Floating action bar shown while building a per-cell formula (click any

  function formulaBuilderBarHTML(fb) {
