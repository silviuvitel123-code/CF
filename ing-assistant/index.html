  // --- Celule: editare in-place — fiecare celulă e independentă. Ce se tastează
  // decide tipul: dacă arată ca un număr, se salvează ca număr; altfel rămâne
  // text — indiferent de coloană, indiferent de rând. ---
  function parseCellInput(text) {
    var trimmed = (text || "").trim();
    if (trimmed === "") return "";
    var normalized = trimmed.replace(",", ".");
    return /^-?\d+(\.\d+)?$/.test(normalized) ? parseFloat(normalized) : trimmed;
  }
  function startCellEdit(rowId, colId, currentValue) {
    state.siteForm.gridCellEdit = { rowId: rowId, colId: colId, draft: currentValue === undefined || currentValue === null ? "" : String(currentValue) };
  }
  function commitCellEdit() {
    var edit = state.siteForm.gridCellEdit;
    if (!edit.rowId) return;
    var row = progresRanduri.filter(function (r) { return r.id === edit.rowId; })[0];
    var col = progresColoane.filter(function (c) { return c.id === edit.colId; })[0];
    state.siteForm.gridCellEdit = { rowId: null, colId: null, draft: "" };
    if (!row || !col) { render(); return; }
    var cellSite = findSite(state.selectedSiteId);
    if (cellSite) pushProgresUndo(cellSite, row.tabel);
    row.valori = Object.assign({}, row.valori);
    row.valori[col.id] = parseCellInput(edit.draft);
    render();
    sb.from("santier_progres_randuri").update({ valori: row.valori }).eq("id", row.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva valoarea."); console.error(res.error); render(); }
    });
  }
  function cancelCellEdit() { state.siteForm.gridCellEdit = { rowId: null, colId: null, draft: "" }; render(); }

  // --- Lipire dintr-un tabel Excel: pornind de la celula selectată, valorile
  // separate prin tab/linie nouă din clipboard se scriu în celulele
  // corespunzătoare (text sau număr, după cum arată fiecare valoare) —
  // coloanele calculate și celulele cu formulă proprie sunt sărite, fără să
  // strice alinierea restului lipirii. ---
  function pasteIntoGrid(site, anchorRowId, anchorColId, text) {
    var anchorRowLive = progresRanduri.filter(function (r) { return r.id === anchorRowId; })[0];
    if (!anchorRowLive) return;
    var tabel = anchorRowLive.tabel;
    var data = progresGridData(site, tabel);
    var orderedCols = data.orderedCols, orderedRows = data.orderedRows;
    var rowIdx = orderedRows.findIndex(function (r) { return r.id === anchorRowId; });
    var colIdx = orderedCols.findIndex(function (c) { return c.id === anchorColId; });
    if (rowIdx === -1 || colIdx === -1) return;
    pushProgresUndo(site, tabel);
    var lines = text.replace(/\r/g, "").split("\n");
    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
    var rowsById = {};
    randuriForSite(site, tabel).forEach(function (r) { rowsById[r.id] = r; });
    var touched = [];
    lines.forEach(function (line, i) {
      var targetRow = orderedRows[rowIdx + i];
      if (!targetRow) return;
      var liveRow = rowsById[targetRow.id];
      if (!liveRow) return;
      var cells = line.split("\t");
      var changed = false;
      cells.forEach(function (cellText, j) {
        var col = orderedCols[colIdx + j];
        if (!col || col.tip === "calculat") return;
        if (liveRow.formuleCelule && liveRow.formuleCelule[col.id]) return; // a formula cell keeps its formula — paste doesn't silently overwrite it
        liveRow.valori[col.id] = parseCellInput(cellText);
        changed = true;
      });
      if (changed && touched.indexOf(liveRow) === -1) touched.push(liveRow);
    });
    if (!touched.length) return;
    render();
    touched.forEach(function (row) {
      sb.from("santier_progres_randuri").update({ valori: row.valori }).eq("id", row.id).then(function (res) {
        if (res.error) { flashSyncError("Nu am putut salva datele lipite."); console.error(res.error); render(); }
      });
    });
  }

  // --- Formula pe celulă: alegi manual orice celule din orice rând/coloană
  // ca să le aduni sau să le scazi într-o celulă țintă — independent de
  // structura rândului/coloanei (spre deosebire de coloanele "calculat",
  // care sunt fixate pe aceleași coloane pentru tot tabelul). ---
  function startFormulaBuilder(tabel, rowId, colId) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    var existing = row && row.formuleCelule && row.formuleCelule[colId];
    state.siteForm.formulaBuilder = { tabel: tabel, rowId: rowId, colId: colId, terms: existing ? existing.terms.map(function (t) { return { rowId: t.rowId, colId: t.colId, sign: t.sign }; }) : [] };
    state.siteForm.cellRangeSelect = null;
  }
  function cancelFormulaBuilder() { state.siteForm.formulaBuilder = null; }
  // First click on a cell adds it (+), a second click flips it to (-), a
  // third click removes it — no drag-select needed, and it works across
  // any rows/columns since each click just names one specific cell.
  function toggleFormulaTerm(rowId, colId) {
    var fb = state.siteForm.formulaBuilder;
    if (!fb) return;
    if (rowId === fb.rowId && colId === fb.colId) return; // can't reference itself
    var idx = fb.terms.findIndex(function (t) { return t.rowId === rowId && t.colId === colId; });
    if (idx === -1) fb.terms.push({ rowId: rowId, colId: colId, sign: 1 });
    else if (fb.terms[idx].sign === 1) fb.terms[idx].sign = -1;
    else fb.terms.splice(idx, 1);
  }
  function saveFormulaBuilder(site) {
    var fb = state.siteForm.formulaBuilder;
    if (!fb) return;
    var row = progresRanduri.filter(function (r) { return r.id === fb.rowId; })[0];
    state.siteForm.formulaBuilder = null;
    if (!row) { render(); return; }
    pushProgresUndo(site, fb.tabel);
    row.formuleCelule = Object.assign({}, row.formuleCelule);
    if (fb.terms.length) row.formuleCelule[fb.colId] = { terms: fb.terms };
    else delete row.formuleCelule[fb.colId]; // no terms picked — back to a plain, manually-editable cell
    render();
    sb.from("santier_progres_randuri").update({ formule_celule: row.formuleCelule }).eq("id", row.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut salva formula."); console.error(res.error); render(); }
    });
  }
  function clearCellFormula(site, rowId, colId) {
    var row = progresRanduri.filter(function (r) { return r.id === rowId; })[0];
    if (!row || !row.formuleCelule || !row.formuleCelule[colId]) return;
    pushProgresUndo(site, row.tabel);
    row.formuleCelule = Object.assign({}, row.formuleCelule);
    delete row.formuleCelule[colId];
    render();
    sb.from("santier_progres_randuri").update({ formule_celule: row.formuleCelule }).eq("id", row.id).then(function (res) {
      if (res.error) { flashSyncError("Nu am putut șterge formula."); console.error(res.error); render(); }
    });
  }

  function docRowHTML(site, tip, label, scope, opts) {
    opts = opts || {};

    var draftVal = state.siteForm.docDrafts[key];
    var inputVal = (draftVal !== undefined) ? draftVal : (doc ? doc.valoare : "");
    var uploading = !!state.siteForm.docUploading[key];
    var isEditingLabel = state.siteForm.labelEdit.tip === tip;
    var placeholderLabel = scope === "avize" ? "Tip aviz (dublu-click)" : "Denumire document (dublu-click)";
    var displayLabel = label || placeholderLabel;
    var labelEmptyCls = label ? "" : " docrow-label-empty";

    var labelHtml = isEditingLabel
      ? '<input class="docrow-label-input" id="label-edit-' + tip + '" draggable="false" data-label-edit-input="1" value="' + esc(label || "") + '">'
      : '<div class="docrow-label' + labelEmptyCls + '" draggable="false" data-edit-label-tip="' + tip + '" data-edit-label-site="' + site.id + '" data-current-label="' + esc(label || "") + '" title="Dublu-click pentru a redenumi">' + esc(displayLabel) + '</div>';

    var delBtn = opts.deletable
      ? '<span class="doc-file-del" ' + opts.removeAttr + '="' + site.id + '|' + tip + '" title="' + esc(opts.removeTitle) + '">' + icon("trash", 14) + '</span>'
      : "";

      '<button class="btn btn-ghost btn-sm" data-save-doc-valoare="' + site.id + '|' + tip + '">Salvează</button>' +

  function pontajGridHTML() {
    var y = state.pontaj.year, m = state.pontaj.month, mode = state.pontaj.periodMode;
    var range = periodRange(mode, y, m);
    var dayNums = [];
    for (var d = range.start; d <= range.end; d++) dayNums.push(d);

    var headCells = dayNums.map(function (dd) {
      return '<th class="' + (isWeekend(y, m, dd) ? "weekend" : "") + '"><div class="daynum">' + dd + '</div><div class="daydow">' + dowShort(y, m, dd) + '</div></th>';
    }).join("");

    var STATUS_LABEL = { empty: "—", normal: "8", co: "CO", cm: "CM", liber: "L" };
    var STATUS_CLS = { empty: "cempty", normal: "cw", co: "cleave", cm: "csick", liber: "coff" };

    var rows = workers.map(function (w) {
      var total = 0;
      var cells = dayNums.map(function (dd) {
        var status = cellStatus(w.id, y, m, dd);
        if (status === "normal") total += 8;
        if (status === "weekend") {
          return '<td class="day"><div class="cell coff">' + (new Date(y, m - 1, dd).getDay() === 6 ? "S" : "D") + '</div></td>';
        }
        var dk = dateKey(y, m, dd);
        var cellKey = w.id + "|" + dk;
        var isOpen = state.pontaj.openCell === cellKey;
        var isPicked = state.pontaj.selectedCells.indexOf(cellKey) !== -1;
        var isFailed = !!failedCells[cellKey];
        var pop = "";
        if (isOpen) {
          pop = '<div class="daypop">' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|normal">Normal (8h)</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|co">CO</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|cm">CM</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|liber">Liber</div>' +
            '<div class="daypop-opt" data-set-status="' + cellKey + '|empty">Șterge (necompletat)</div>' +
          '</div>';
        }
        var cellCls = "day daycell" + (state.pontaj.selectMode ? " selectable" : "") + (isPicked ? " cell-picked" : "") + (isFailed ? " cell-failed" : "");
        var failedMark = isFailed ? '<span class="cell-failed-dot" title="Nu s-a salvat — apasă din nou">!</span>' : "";
        return '<td class="' + cellCls + '" data-cell-toggle="' + cellKey + '"><div class="cell ' + STATUS_CLS[status] + '">' + STATUS_LABEL[status] + failedMark + '</div>' + pop + '</td>';
      }).join("");

  function progresLabelColId(orderedCols) {
    for (var i = 0; i < orderedCols.length; i++) if (orderedCols[i].tip === "text") return orderedCols[i].id;
    return null;
  }
  // Cell content is independent of the column type now — a "numar" column
  // can hold typed text, a "text" column can hold a number. Display follows
  // what's actually stored (its runtime type), except "calculat" columns
  // and formula cells, which are always numbers.
  function progresCellDisplayForExport(col, v) {
    if (col.tip === "calculat") {
      var out = formatGridNumber(typeof v === "number" ? v : (parseFloat(v) || 0));
      return isPercentFormula(col.formula) ? out + "%" : out;
    }
    if (typeof v === "number") return formatGridNumber(v);
    return v || "";
  }
  function csvEscape(v) {
    var s = String(v === undefined || v === null ? "" : v);
    if (/[";\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function exportProgresCSV(site, tabel) {
    var data = progresGridData(site, tabel);
    var orderedCols = data.orderedCols, orderedRows = data.orderedRows, displayValori = data.displayValori;
    var lines = [orderedCols.map(function (c) { return csvEscape(c.label); }).join(";")];
    orderedRows.forEach(function (row) {
      var vals = displayValori[row.id] || {};
      lines.push(orderedCols.map(function (col) { return csvEscape(progresCellDisplayForExport(col, vals[col.id])); }).join(";"));
    });
    var csv = "﻿" + lines.join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    var slug = (site.numeScurt || site.nume || "santier").toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "");
    a.download = "progres-" + slug + (tabel === "capitole" ? "-capitole" : "") + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

    var colorPopHtml = state.siteForm.colorPickerOpen.id ? colorPopoverHTML(state.siteForm.colorPickerOpen.type, state.siteForm.colorPickerOpen.id) : "";

  // Motion (window.Motion, loaded via CDN <script> in <head>) is a pure
  // progressive enhancement: every call goes through this helper, which
  // no-ops silently if the library never loaded (blocked CDN, offline,
  // ad-blocker, etc.) — a missing animation is fine, a thrown error that
  // breaks the click that triggered it is not. onDone (optional) always
  // fires exactly once, animated or not, so callers can rely on it to
  // clean up (e.g. clear an inline style) either way.
  function motionAnimate(el, keyframes, options, onDone) {
    if (!el || typeof Motion === "undefined" || !Motion.animate) { if (onDone) onDone(); return; }
    try {
      var anim = Motion.animate(el, keyframes, options);
      if (onDone) {
        if (anim && anim.finished && anim.finished.then) anim.finished.then(onDone, onDone);
        else setTimeout(onDone, ((options && options.duration) || 0.2) * 1000 + 30);
      }
    } catch (e) { if (onDone) onDone(); }
  }

  // Tracks which "place" in the app the last render showed, so a fresh
  // entrance transition only plays on an actual navigation (tab, subtab,
  // opening a site, switching view) — not on every render in general
  // (typing in a cell, ticking a checkbox, a background save resolving…),
  // which would be distracting rather than smooth.
  var lastNavKey = null;

  function render() {
    if (progresDragActive) { renderQueuedDuringDrag = true; return; }
    var errorBanner = syncError ? '<div class="sync-error">' + esc(syncError) + '</div>' : "";
    var failedCount = Object.keys(failedCells).length;
    var retryBanner = failedCount > 0 ? '' +
      '<div class="sync-error retry-banner">' +
        (failedCount === 1 ? '1 zi nu s-a salvat.' : failedCount + ' zile nu s-au salvat.') +
        ' <span class="retry-link" data-retry-failed="1">Reîncearcă acum</span>' +
      '</div>' : '';

    if (!sb) { document.getElementById("app").innerHTML = sdkErrorScreenHTML(); return; }
    if (authState.loading) { document.getElementById("app").innerHTML = loadingScreenHTML(); return; }
    if (!authState.session) { document.getElementById("app").innerHTML = errorBanner + loginScreenHTML(); return; }

    var main = "";
    if (state.view === "dashboard") main = dashboardHTML();
    else if (state.view === "sites") main = sitesHTML();
    else if (state.view === "detail") main = detailHTML();
    else if (state.view === "pontaj-global") main = pontajGlobalHTML();

    var navKey = state.view + "|" + state.activeTab + "|" + state.siteForm.subTab + "|" + state.siteForm.progresSubTab + "|" + state.selectedSiteId;
    var navChanged = navKey !== lastNavKey;
    lastNavKey = navKey;

    var isWide = state.view === "detail" && state.activeTab === "progres";
    var expandBtn = state.sidebarCollapsed ? '<div class="sidebar-expand-btn" data-toggle-sidebar="1" title="Arată bara laterală">' + icon("chevronRight", 15) + '</div>' : "";
    document.getElementById("app").innerHTML = errorBanner + retryBanner + expandBtn +
      '<div class="app' + (state.sidebarCollapsed ? " sidebar-hidden" : "") + '">' + sidebarHTML() +
      '<div class="main"><div class="main-inner' + (isWide ? " wide" : "") + '">' + main + '</div></div></div>';
    positionOpenPopover();
    positionColorPopover();
    if (navChanged) {
      var mainInner = document.querySelector(".main-inner");
      motionAnimate(mainInner, { opacity: [0, 1], transform: ["translateY(6px)", "translateY(0px)"] }, { duration: 0.22, easing: "ease-out" });
    }
  }

  // Sidebar collapse/expand: width is measured before and after the render
  // (rather than relying on a CSS transition, which can't animate a full
  // innerHTML rebuild — the new sidebar node just appears already at its
  // final width) and handed to Motion as explicit from/to keyframes, so the
  // collapse genuinely slides instead of snapping.
  function toggleSidebarCollapsed() {
    var sidebarEl = document.querySelector(".sidebar");
    var oldWidth = sidebarEl ? sidebarEl.getBoundingClientRect().width : 0;
    state.sidebarCollapsed = !state.sidebarCollapsed;
    render();
    var newSidebarEl = document.querySelector(".sidebar");
    if (!newSidebarEl) return;
    var newWidth = newSidebarEl.getBoundingClientRect().width;
    motionAnimate(newSidebarEl, { width: [oldWidth + "px", newWidth + "px"] }, { duration: 0.25, easing: "ease" }, function () {
      newSidebarEl.style.width = "";
    });
  }

  function positionOpenPopover() {
    if (!state.pontaj.openCell) return;
    var pop = document.querySelector(".daypop");
    var cell = document.querySelector('[data-cell-toggle="' + state.pontaj.openCell + '"]');
    if (!pop || !cell) return;
    var r = cell.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.min(Math.max(r.left, 8), window.innerWidth - pw - 8);
    var top = (r.bottom + 4 + ph <= window.innerHeight) ? (r.bottom + 4) : Math.max(8, r.top - ph - 4);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function positionColorPopover() {
    var open = state.siteForm.colorPickerOpen;
    if (!open.id) return;
    var pop = document.querySelector(".colorpop");
    var btn = document.querySelector('[data-toggle-color="' + open.type + '|' + open.id + '"]');
    if (!pop || !btn) return;
    var r = btn.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.min(Math.max(r.left, 8), window.innerWidth - pw - 8);
    var top = (r.bottom + 4 + ph <= window.innerHeight) ? (r.bottom + 4) : Math.max(8, r.top - ph - 4);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  document.getElementById("app").addEventListener("click", function (e) {
    // A single click on an editable grid cell just selects it (as a paste
    // anchor for Ctrl+V) — it does NOT open the input, that's dblclick's job.
    // Crucially this must NOT call render() in the common case: replacing
    // the clicked <td> with a fresh DOM node between the two clicks of a
    // dblclick gesture stops the browser from ever firing "dblclick" on it.
    // While a cell formula is being built, the same click instead toggles
    // that cell in/out of the formula (add → flip sign → remove).
    var pasteTarget = e.target.closest("[data-edit-cell]");
    if (pasteTarget && e.target === pasteTarget) {
      var ptParts = pasteTarget.dataset.editCell.split("|");
      if (state.siteForm.formulaBuilder) {
        toggleFormulaTerm(ptParts[0], ptParts[1]);
        render();
        return;
      }
      state.siteForm.pasteAnchor = { rowId: ptParts[0], colId: ptParts[1] };
      // A plain click on a cell also dismisses a still-pending merge-select
      // bulk-bar left over from an earlier, abandoned drag, so it can't linger stale.
      var hadPopoverOpen = state.pontaj.openCell || state.siteForm.colorPickerOpen.id || state.siteForm.cellRangeSelect;
      state.pontaj.openCell = null;
      state.siteForm.colorPickerOpen = { type: null, id: null };
      state.siteForm.cellRangeSelect = null;
      if (hadPopoverOpen) {
        render();
        var refocus = document.querySelector('[data-edit-cell="' + ptParts[0] + '|' + ptParts[1] + '"]');
        if (refocus) refocus.focus();
      } else {
        pasteTarget.focus();
      }
      return;
    }

    var t = e.target.closest(
      "[data-go],[data-open-site],[data-tab],[data-global-site]," +
      "[data-pontaj-prev],[data-pontaj-next],[data-pontaj-mode],[data-cell-toggle],[data-set-status]," +
      "[data-add-worker],[data-remove-worker],[data-print-pontaj],[data-toggle-company],[data-save-company],[data-logout]," +
      "[data-toggle-select-mode],[data-bulk-status],[data-clear-selection],[data-retry-failed]," +
      "[data-open-add-site],[data-close-add-site],[data-save-new-site],[data-edit-site],[data-save-site-edit],[data-cancel-site-edit],[data-delete-site]," +
      "[data-site-subtab],[data-progres-subtab],[data-save-doc-valoare],[data-remove-doc-file],[data-add-aviz],[data-remove-aviz]," +
      "[data-add-gendoc],[data-remove-gendoc]," +
      "[data-add-row],[data-add-group-row],[data-remove-row],[data-remove-col],[data-toggle-addcol],[data-cancel-addcol],[data-submit-addcol]," +
      "[data-toggle-color],[data-pick-color],[data-toggle-sidebar]," +
      "[data-toggle-collapse-group],[data-duplicate-row],[data-export-progres-csv],[data-print-progres]," +
      "[data-toggle-cell-formula],[data-formula-save],[data-formula-cancel],[data-formula-clear]," +
      "[data-merge-cells-confirm],[data-merge-cells-cancel],[data-unmerge-cell]," +
      "[data-undo-progres]," +
      "[data-edit-pv-date],[data-save-pv-date],[data-cancel-pv-date]," +
      "[data-add-tronson],[data-remove-tronson],[data-generate-pv]"
    );

    // Only re-render when something actually changes. A blanket render() on every
    // click would destroy-and-recreate any input/select the click just focused
    // (e.g. clicking into "Nume și prenume" then re-rendering immediately after
    // steals focus back off it), making it impossible to type. So: clicks on
    // plain page furniture (inputs, whitespace, table cells with no data-action)
    // must be a no-op here.
    var needsRender = false;

    // clicking anywhere outside an open day-popover closes it
    if (state.pontaj.openCell && !(t && (t.dataset.cellToggle || t.dataset.setStatus))) {
      state.pontaj.openCell = null;
      needsRender = true;
    }

    // clicking anywhere outside an open color popover closes it
    if (state.siteForm.colorPickerOpen.id && !(t && (t.dataset.toggleColor || t.dataset.pickColor))) {
      state.siteForm.colorPickerOpen = { type: null, id: null };
      needsRender = true;
    }

    var isNav = false;
    if (t) {
      needsRender = true;
      if (t.dataset.go) { state.view = t.dataset.go; isNav = true; }
      else if (t.dataset.openSite) {
        if (e.target.dataset.sidebarNameInput) {
          needsRender = false; // clicking inside the active rename input just places the cursor
        } else if (e.target.closest("[data-sidebar-name-label]")) {
          // might be the first half of a double-click-to-rename — delay
          // navigation briefly so a following dblclick can cancel it instead
          needsRender = false;
          var deferSiteId = t.dataset.openSite;
          clearTimeout(sidebarClickTimer);

  // Drag-to-reorder for the fixed "Date generale ale proiectului" rows.
  // Visual feedback (dragging/insertion classes) is applied directly to the
  // DOM instead of through render(), so the drag gesture isn't interrupted
  // by a full rebuild on every dragover.
  var dragState = { tip: null, scope: null };
  var progresDragActive = false;
  var renderQueuedDuringDrag = false;
  function clearDocDragClasses() {
    document.querySelectorAll(".docrow.dragging, .docrow.drag-over-top, .docrow.drag-over-bottom").forEach(function (el) {
      el.classList.remove("dragging", "drag-over-top", "drag-over-bottom");

  document.getElementById("app").addEventListener("dragstart", function (e) {
    var row = e.target.closest("[data-doc-drag-tip]");
    if (!row) return;
    dragState.tip = row.dataset.docDragTip;
    dragState.scope = row.dataset.dragScope;
    row.classList.add("dragging");
    if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
  });
  document.getElementById("app").addEventListener("dragover", function (e) {
    var row = e.target.closest("[data-doc-drag-tip]");
    if (!row || !dragState.tip || row.dataset.dragScope !== dragState.scope) return;
    e.preventDefault();
    var rect = row.getBoundingClientRect();
    var before = (e.clientY - rect.top) < rect.height / 2;
    row.classList.toggle("drag-over-top", before);
    row.classList.toggle("drag-over-bottom", !before);
  });
  document.getElementById("app").addEventListener("dragleave", function (e) {
    var row = e.target.closest("[data-doc-drag-tip]");
    if (row) row.classList.remove("drag-over-top", "drag-over-bottom");
  });
  document.getElementById("app").addEventListener("drop", function (e) {
    var row = e.target.closest("[data-doc-drag-tip]");
    if (!row || !dragState.tip || row.dataset.dragScope !== dragState.scope) return;
    e.preventDefault();
    var before = row.classList.contains("drag-over-top");
    var targetTip = row.dataset.docDragTip;
    var draggedTip = dragState.tip;
    var scope = dragState.scope;
    dragState.tip = null; dragState.scope = null;
    clearDocDragClasses();
    var site = findSite(state.selectedSiteId);
    if (!site) return;
    var scopeTips = scope === "avize" ? avizeTips(site) : mainListTips(site);
    reorderWithinScope(draggedTip, targetTip, before, scopeTips);
  });

    dragState.tip = null; dragState.scope = null;

  // Progres grid row/column reordering: deliberately NOT the browser's
  // native HTML5 drag-and-drop (draggable="true" + dragstart/dragover/drop/
  // dragend). That API ties the gesture to the browser's own internal
  // drag-tracking state, which — confirmed by a screen recording — can get
  // stuck: the whole page stops responding to ANY click or hover anywhere
  // (not just the dragged element) until something clears it, because the
  // browser itself, not just this page's JS, considers itself mid-drag.
  // Once the browser is in that state, nothing this page's JS does (guard
  // render(), watch for mouseup, a watchdog timer — all tried already) can
  // un-stick it, since the stuck state lives outside the page entirely.
  // A manual mousedown/mousemove/mouseup implementation never touches that
  // native machinery, so there is no browser-level state to get stuck in —
  // mouseup is a plain DOM event this page fully controls and which always
  // fires when the mouse button is released.
  var manualRowDrag = { id: null };
  var manualColDrag = { id: null };
  var manualDragRAF = null;
  var manualDragPending = null;
  function scheduleManualDragUpdate(x, y) {
    manualDragPending = { x: x, y: y };
    if (manualDragRAF) return;
    manualDragRAF = requestAnimationFrame(function () {
      manualDragRAF = null;
      var p = manualDragPending;
      manualDragPending = null;
      if (!p) return;
      if (manualRowDrag.id) {
        var overEl = document.elementFromPoint(p.x, p.y);
        var tr = overEl && overEl.closest("[data-progrow-id]");
        document.querySelectorAll(".progrid tbody tr.drag-over-top, .progrid tbody tr.drag-over-bottom").forEach(function (r) {
          if (r !== tr) r.classList.remove("drag-over-top", "drag-over-bottom");
        });
        if (tr && tr.dataset.progrowId !== manualRowDrag.id) {
          var rect = tr.getBoundingClientRect();
          var before = (p.y - rect.top) < rect.height / 2;
          tr.classList.toggle("drag-over-top", before);
          tr.classList.toggle("drag-over-bottom", !before);
        }
      } else if (manualColDrag.id) {
        var overEl2 = document.elementFromPoint(p.x, p.y);
        var th = overEl2 && overEl2.closest("[data-progcol-id]");
        document.querySelectorAll(".progrid th.drag-over-left, .progrid th.drag-over-right").forEach(function (c) {
          if (c !== th) c.classList.remove("drag-over-left", "drag-over-right");
        });
        if (th && th.dataset.progcolId !== manualColDrag.id) {
          var rect2 = th.getBoundingClientRect();
          var beforeCol = (p.x - rect2.left) < rect2.width / 2;
          th.classList.toggle("drag-over-left", beforeCol);
          th.classList.toggle("drag-over-right", !beforeCol);
        }
      }
    });
  }
  document.getElementById("app").addEventListener("mousedown", function (e) {
    var rowGrip = e.target.closest("[data-row-grip-handle]");
    if (rowGrip) {
      e.preventDefault();
      manualRowDrag.id = rowGrip.dataset.rowGripHandle;
      progresDragActive = true;
      var tr = rowGrip.closest("[data-progrow-id]");
      if (tr) tr.classList.add("dragging");
      document.body.classList.add("progrid-manual-drag");
      return;
    }
    var colGrip = e.target.closest("[data-col-grip-handle]");
    if (colGrip) {
      e.preventDefault();
      manualColDrag.id = colGrip.dataset.colGripHandle;
      progresDragActive = true;
      var th = colGrip.closest("[data-progcol-id]");
      if (th) th.classList.add("dragging");
      document.body.classList.add("progrid-manual-drag");
      return;
    }
  });
  document.addEventListener("mousemove", function (e) {
    if (!manualRowDrag.id && !manualColDrag.id) return;
    // If the button was released while the cursor was outside the browser
    // viewport (e.g. dragged off the edge of the window), no mouseup event
    // is ever delivered to this page. The next mousemove that re-enters the
    // page reports e.buttons === 0, which is the only signal we get that
    // the drag actually ended — treat it exactly like a mouseup with no
    // valid drop target, so the drag can never get left dangling.
    if (e.buttons === 0) { endManualProgDrag(); return; }
    scheduleManualDragUpdate(e.clientX, e.clientY);
  });
  function endManualProgDrag() {
    manualRowDrag.id = null;
    manualColDrag.id = null;
    progresDragActive = false;
    if (manualDragRAF) { cancelAnimationFrame(manualDragRAF); manualDragRAF = null; }
    manualDragPending = null;
    document.body.classList.remove("progrid-manual-drag");
    clearDocDragClasses();
    // Any render() suppressed while this drag was active (e.g. an unrelated
    // Supabase write resolving mid-drag) is applied now that it's safe.
    if (renderQueuedDuringDrag) { renderQueuedDuringDrag = false; render(); }
  }
  document.addEventListener("mouseup", function (e) {
    if (!manualRowDrag.id && !manualColDrag.id) return;
    var isRow = !!manualRowDrag.id;
    var draggedId = isRow ? manualRowDrag.id : manualColDrag.id;
    var overEl = document.elementFromPoint(e.clientX, e.clientY);
    var targetEl = overEl && overEl.closest(isRow ? "[data-progrow-id]" : "[data-progcol-id]");
    var targetId = targetEl ? (isRow ? targetEl.dataset.progrowId : targetEl.dataset.progcolId) : null;
    var before = true;
    if (targetEl) {
      var rect = targetEl.getBoundingClientRect();
      before = isRow ? ((e.clientY - rect.top) < rect.height / 2) : ((e.clientX - rect.left) < rect.width / 2);
    }
    endManualProgDrag();
    if (targetId && targetId !== draggedId) {
      var site = findSite(state.selectedSiteId);
      if (site) { if (isRow) reorderRows(site, draggedId, targetId, before); else reorderColumns(site, draggedId, targetId, before); }
    }
  });

  // Column resize: a narrow handle at the right edge of each header cell.
  // Live width is applied straight to the <col> element (not through
  // render()) so dragging is smooth, then committed + persisted on mouseup.
  var colResizeState = { colId: null, startX: 0, startWidth: 0 };
  document.getElementById("app").addEventListener("mousedown", function (e) {
    var handle = e.target.closest("[data-resize-col]");
    if (!handle) return;
    e.preventDefault();
    var th = handle.closest("th");
    colResizeState.colId = handle.dataset.resizeCol;
    colResizeState.startX = e.clientX;
    colResizeState.startWidth = th ? th.getBoundingClientRect().width : 120;
  });
  document.addEventListener("mousemove", function (e) {
    if (!colResizeState.colId) return;
    var newWidth = Math.max(50, Math.round(colResizeState.startWidth + (e.clientX - colResizeState.startX)));
    var col = document.querySelector('col[data-col-id="' + colResizeState.colId + '"]');
    if (col) col.style.width = newWidth + "px";
  });
  document.addEventListener("mouseup", function () {
    if (!colResizeState.colId) return;
    var col = document.querySelector('col[data-col-id="' + colResizeState.colId + '"]');
    var newWidth = col ? parseInt(col.style.width, 10) : null;
    var colId = colResizeState.colId;
    colResizeState.colId = null;
    var site = findSite(state.selectedSiteId);
    if (site && newWidth) resizeColumn(site, colId, newWidth);
  });

  // Cell-merge range selection: dragging (mousedown + move + mouseup, exactly
  // the same pointer-only pattern as the row/col reordering above, for the
  // same reason — no native browser drag machinery involved) across 2+ cells
  // picks a rectangle to merge. A plain click (no movement) is left alone —
  // that's the existing single-cell "select as paste anchor" behavior.
  var cellRangeDrag = { active: false, tabel: null, startRowId: null, startColId: null, curRowId: null, curColId: null, moved: false };
  var cellRangeRAF = null;
  function clearRangeHighlightClasses() {
    document.querySelectorAll(".progrid-range-cell").forEach(function (el) { el.classList.remove("progrid-range-cell"); });
  }
  function updateRangeHighlight() {
    var wrap = document.querySelector('[data-progres-tabel="' + cellRangeDrag.tabel + '"]');
    if (!wrap) return;
    var rIdx = {}; wrap.querySelectorAll("tbody tr[data-progrow-id]").forEach(function (tr, i) { rIdx[tr.dataset.progrowId] = i; });
    var cIdx = {}; wrap.querySelectorAll("thead th[data-progcol-id]").forEach(function (th, i) { cIdx[th.dataset.progcolId] = i; });
    var r0 = Math.min(rIdx[cellRangeDrag.startRowId], rIdx[cellRangeDrag.curRowId]);
    var r1 = Math.max(rIdx[cellRangeDrag.startRowId], rIdx[cellRangeDrag.curRowId]);
    var c0 = Math.min(cIdx[cellRangeDrag.startColId], cIdx[cellRangeDrag.curColId]);
    var c1 = Math.max(cIdx[cellRangeDrag.startColId], cIdx[cellRangeDrag.curColId]);
    wrap.querySelectorAll("[data-edit-cell]").forEach(function (td) {
      var parts = td.dataset.editCell.split("|");
      var ri = rIdx[parts[0]], ci = cIdx[parts[1]];
      var inRange = ri !== undefined && ci !== undefined && ri >= r0 && ri <= r1 && ci >= c0 && ci <= c1;
      td.classList.toggle("progrid-range-cell", inRange);
    });
  }
  function scheduleCellRangeHighlight() {
    if (cellRangeRAF) return;
    cellRangeRAF = requestAnimationFrame(function () {
      cellRangeRAF = null;
      if (cellRangeDrag.active) updateRangeHighlight();
    });
  }
  document.getElementById("app").addEventListener("mousedown", function (e) {
    if (e.target.closest("[data-toggle-cell-formula],[data-unmerge-cell]")) return;
    var cell = e.target.closest("[data-edit-cell]");
    if (!cell || state.siteForm.formulaBuilder) return;
    var parts = cell.dataset.editCell.split("|");
    var wrap = cell.closest("[data-progres-tabel]");
    cellRangeDrag.active = true;
    cellRangeDrag.tabel = wrap ? wrap.dataset.progresTabel : "centralizare";
    cellRangeDrag.startRowId = cellRangeDrag.curRowId = parts[0];
    cellRangeDrag.startColId = cellRangeDrag.curColId = parts[1];
    cellRangeDrag.moved = false;
  });
  document.addEventListener("mousemove", function (e) {
    if (!cellRangeDrag.active) return;
    if (e.buttons === 0) { cellRangeDrag.active = false; clearRangeHighlightClasses(); return; }
    var overEl = document.elementFromPoint(e.clientX, e.clientY);
    var overCell = overEl && overEl.closest("[data-edit-cell]");
    if (!overCell) return;
    var parts = overCell.dataset.editCell.split("|");
    if (parts[0] === cellRangeDrag.curRowId && parts[1] === cellRangeDrag.curColId) return;
    cellRangeDrag.curRowId = parts[0];
    cellRangeDrag.curColId = parts[1];
    if (parts[0] !== cellRangeDrag.startRowId || parts[1] !== cellRangeDrag.startColId) cellRangeDrag.moved = true;
    scheduleCellRangeHighlight();
  });
  document.addEventListener("mouseup", function () {
    if (!cellRangeDrag.active) return;
    var wasMoved = cellRangeDrag.moved;
    var tabel = cellRangeDrag.tabel, startRowId = cellRangeDrag.startRowId, startColId = cellRangeDrag.startColId,
        curRowId = cellRangeDrag.curRowId, curColId = cellRangeDrag.curColId;
    cellRangeDrag.active = false;
    if (cellRangeRAF) { cancelAnimationFrame(cellRangeRAF); cellRangeRAF = null; }
    clearRangeHighlightClasses();
    if (!wasMoved) return; // plain click — the click handler below deals with paste-anchor selection (and dismisses a stale pending merge-select, if any)
    var site = findSite(state.selectedSiteId);
    if (!site) return;
    var sel = resolveCellRangeIds(site, tabel, startRowId, startColId, curRowId, curColId);
    if (!sel || sel.rowIds.length * sel.colIds.length < 2) return;
    state.siteForm.cellRangeSelect = { tabel: tabel, rowIds: sel.rowIds, colIds: sel.colIds };
    render();
  });

  // Paste from Excel: with a grid cell selected (single click), Ctrl+V
  // spills the clipboard's tab/newline-separated values starting there.
  document.getElementById("app").addEventListener("paste", function (e) {
    var anchor = state.siteForm.pasteAnchor;
    if (!anchor || !anchor.rowId) return;
    var text = (e.clipboardData || window.clipboardData).getData("text");
    if (!text) return;
    var site = findSite(state.selectedSiteId);
    if (!site) return;
    e.preventDefault();
    pasteIntoGrid(site, anchor.rowId, anchor.colId, text);
  });

  // If a save failed (offline / dropped request), retry automatically the moment
  // the connection comes back, instead of waiting for the user to notice and tap.
  window.addEventListener("online", function () {
    if (Object.keys(failedCells).length > 0) retryFailedCells();
  });

  // Never let a completed-but-unsynced day get lost by an accidental tab close.
  window.addEventListener("beforeunload", function (e) {
    if (Object.keys(failedCells).length > 0) { e.preventDefault(); e.returnValue = ""; }
  });

  // Ctrl/Cmd+Z undoes the last Progres Șantier grid action — but never while
  // an input/textarea has focus, so the browser's own text-undo still works
  // normally inside a cell/column-name edit in progress.
  document.addEventListener("keydown", function (e) {
    if (!(e.key === "z" || e.key === "Z") || !(e.ctrlKey || e.metaKey) || e.shiftKey) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (state.view !== "detail" || state.activeTab !== "progres") return;
    var site = findSite(state.selectedSiteId);
    var tabel = state.siteForm.progresSubTab || "capitole";
    if (site && canUndoProgres(site, tabel)) { e.preventDefault(); undoProgres(site, tabel); }
  });

  render();
  if (sb) {
    sb.auth.getSession().then(function (res) {
      authState.loading = false;
      var session = res.data && res.data.session;
      if (session) {
        authState.session = session;
        loadAllData().then(render);
      } else {
        render();
      }
    });
  }
})();
</script>
<script>
  // Progressive enhancement only — never lets a missing/failed registration
  // (unsupported browser, file:// during local testing, offline) affect the
  // app itself, since installability is a nice-to-have, not a dependency.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
